<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator - Buffalo Gold</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { background: #0e0f12; color: #fff; display: flex; justify-content: center; padding-bottom: 75px; }
  .app { width: 100%; max-width: 440px; background: #141519; min-height: 100vh; padding: 10px; }

  /* Header Bar */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #1b1c22; border-radius: 10px; margin-bottom: 8px; }
  .logo-aviator { color: #e51937; font-style: italic; font-weight: 900; font-size: 20px; letter-spacing: 0.5px; }
  .bal-pill { background: #262830; border: 1px solid #383b47; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #28e04d; cursor: pointer; }

  /* History Strip */
  .hist-bar { display: flex; gap: 5px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
  .hist-bar::-webkit-scrollbar { display: none; }
  .h-pill { padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: bold; background: #22242c; flex-shrink: 0; }
  .h-blue { color: #38bdf8; }
  .h-purple { color: #c084fc; }
  .h-pink { color: #f43f5e; }

  /* Game Canvas Arena */
  .arena {
    position: relative;
    width: 100%;
    height: 215px;
    border-radius: 14px;
    border: 1px solid #2b2d38;
    overflow: hidden;
    background: radial-gradient(circle at 20% 80%, #2a0a18 0%, #111216 65%, #090a0d 100%);
    margin-bottom: 10px;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .center-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    text-align: center;
  }
  .mult-text { font-size: 46px; font-weight: 900; color: #fff; text-shadow: 0 2px 15px rgba(0,0,0,0.9); }
  .mult-text.crashed { color: #e51937; }
  .sub-status { font-size: 13px; font-weight: bold; color: #f43f5e; margin-top: 2px; letter-spacing: 0.5px; }
  .wait-bar-wrap { width: 160px; height: 5px; background: #2b2d38; border-radius: 6px; margin-top: 8px; overflow: hidden; display: none; }
  .wait-bar-fill { height: 100%; background: #e51937; width: 100%; transition: width 0.1s linear; }
  .live-users-badge {
    position: absolute; bottom: 8px; right: 10px;
    background: rgba(20, 21, 25, 0.85); border: 1px solid #2e303c;
    padding: 3px 9px; border-radius: 14px; font-size: 11px; color: #ccc;
    display: flex; align-items: center; gap: 5px;
  }
  .dot-live { width: 7px; height: 7px; background: #28e04d; border-radius: 50%; display: inline-block; }

  /* Dual Bet Panels */
  .bet-panel { background: #1b1c22; border: 1px solid #2a2c36; border-radius: 14px; padding: 10px; margin-bottom: 8px; }
  .panel-tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
  .p-tab { background: #121317; color: #888; font-size: 11px; padding: 3px 16px; border-radius: 12px; font-weight: bold; }
  .p-tab.active { background: #2b2d38; color: #fff; }
  .bet-row { display: flex; gap: 10px; align-items: stretch; }
  .bet-controls { flex: 1; }
  .stepper { display: flex; align-items: center; justify-content: space-between; background: #111216; border: 1px solid #2f323d; border-radius: 20px; padding: 4px 10px; margin-bottom: 6px; }
  .step-btn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #444; background: #22242c; color: #fff; font-weight: bold; cursor: pointer; }
  .bet-val { background: transparent; border: none; color: #fff; font-weight: bold; font-size: 15px; width: 70px; text-align: center; outline: none; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .chip { background: #252730; border: none; color: #bbb; font-size: 11px; font-weight: bold; padding: 4px; border-radius: 10px; cursor: pointer; }
  .chip:active { background: #383b47; color: #fff; }

  .action-btn {
    flex: 1.15; border: none; border-radius: 14px; font-weight: 800; color: #fff; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px; text-transform: uppercase; box-shadow: 0 3px 0 rgba(0,0,0,0.4);
  }
  .btn-green { background: linear-gradient(180deg, #28a745, #1e7e34); border: 1px solid #3ce063; }
  .btn-red { background: linear-gradient(180deg, #d92638, #a61725); border: 1px solid #ff4d5e; }
  .btn-orange { background: linear-gradient(180deg, #f59e0b, #d97706); border: 1px solid #fbbf24; color: #000; }
  .action-btn span.big { font-size: 16px; }
  .action-btn span.sm { font-size: 12px; margin-top: 2px; }

  /* Live Bets Feed */
  .feed-box { background: #1b1c22; border-radius: 14px; padding: 10px; margin-top: 8px; }
  .feed-tabs { display: flex; background: #111216; border-radius: 16px; padding: 3px; margin-bottom: 8px; }
  .f-tab { flex: 1; text-align: center; font-size: 11px; padding: 5px; border-radius: 14px; color: #999; font-weight: bold; cursor: pointer; }
  .f-tab.active { background: #2c2e38; color: #fff; }
  .feed-stats { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #aaa; padding: 4px 4px 8px; border-bottom: 1px solid #272932; }
  .col-head { display: grid; grid-template-columns: 1.3fr 1fr 0.7fr 1.1fr; font-size: 10px; color: #777; padding: 6px 6px 4px; }
  .bet-item {
    display: grid; grid-template-columns: 1.3fr 1fr 0.7fr 1.1fr; align-items: center;
    background: #14151a; padding: 6px 8px; border-radius: 8px; margin-bottom: 4px; font-size: 11px;
    border: 1px solid transparent;
  }
  .bet-item.cashed { background: rgba(40, 224, 77, 0.13); border-color: rgba(40, 224, 77, 0.45); }
  .bet-item.me { border-color: #ffd700; }
  .p-cell { display: flex; align-items: center; gap: 6px; font-weight: 600; color: #ddd; }
  .avatar { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #fff; }
  .x-badge { background: #23252e; color: #38bdf8; padding: 2px 6px; border-radius: 8px; font-size: 10px; font-weight: bold; text-align: center; width: fit-content; }
  .win-val { text-align: right; font-weight: bold; color: #28e04d; }

  /* Bottom Navigation */
  .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 440px; background: #1b1c22; border-top: 1px solid #2e303c; display: flex; justify-content: space-around; padding: 9px 0; z-index: 999; }
  .nav-item { text-align: center; color: #888; font-size: 11px; cursor: pointer; }
  .nav-item.active { color: #ffd700; font-weight: bold; }
  .nav-icon { font-size: 19px; display: block; }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div style="display:flex; align-items:center; gap:8px;">
      <span onclick="location.href='game.html'" style="cursor:pointer; font-size:16px; color:#aaa;">⬅</span>
      <span class="logo-aviator">Aviator</span>
    </div>
    <div class="bal-pill" onclick="location.href='wallet.html'">₹<span id="totalBalDisplay">0.00</span> INR</div>
  </div>

  <!-- Multiplier History Strip -->
  <div class="hist-bar" id="histBar"></div>

  <!-- Flight Canvas Arena -->
  <div class="arena">
    <canvas id="flightCanvas" width="420" height="215"></canvas>
    <div class="center-overlay">
      <div class="mult-text" id="multText">1.00x</div>
      <div class="sub-status" id="statusText">WAITING FOR NEXT ROUND</div>
      <div class="wait-bar-wrap" id="waitBarWrap"><div class="wait-bar-fill" id="waitBarFill"></div></div>
    </div>
    <div class="live-users-badge"><span class="dot-live"></span> <span id="onlineCount">269</span></div>
  </div>

  <!-- Bet Panel 1 -->
  <div class="bet-panel">
    <div class="panel-tabs"><span class="p-tab active">Bet</span><span class="p-tab">Auto</span></div>
    <div class="bet-row">
      <div class="bet-controls">
        <div class="stepper">
          <button type="button" class="step-btn" onclick="adjBet(1, -10)">-</button>
          <input type="number" class="bet-val" id="betInp1" value="25">
          <button type="button" class="step-btn" onclick="adjBet(1, 10)">+</button>
        </div>
        <div class="chips">
          <button type="button" class="chip" onclick="setBet(1, 100)">100</button>
          <button type="button" class="chip" onclick="setBet(1, 200)">200</button>
          <button type="button" class="chip" onclick="setBet(1, 500)">500</button>
          <button type="button" class="chip" onclick="setBet(1, 1000)">1,000</button>
        </div>
      </div>
      <button type="button" class="action-btn btn-green" id="btn1" onclick="handleSlotClick(1)">
        <span class="big">Bet</span>
        <span class="sm" id="btnSub1">25.00 INR</span>
      </button>
    </div>
  </div>

  <!-- Bet Panel 2 -->
  <div class="bet-panel">
    <div class="panel-tabs"><span class="p-tab active">Bet</span><span class="p-tab">Auto</span></div>
    <div class="bet-row">
      <div class="bet-controls">
        <div class="stepper">
          <button type="button" class="step-btn" onclick="adjBet(2, -10)">-</button>
          <input type="number" class="bet-val" id="betInp2" value="50">
          <button type="button" class="step-btn" onclick="adjBet(2, 10)">+</button>
        </div>
        <div class="chips">
          <button type="button" class="chip" onclick="setBet(2, 100)">100</button>
          <button type="button" class="chip" onclick="setBet(2, 200)">200</button>
          <button type="button" class="chip" onclick="setBet(2, 500)">500</button>
          <button type="button" class="chip" onclick="setBet(2, 1000)">1,000</button>
        </div>
      </div>
      <button type="button" class="action-btn btn-green" id="btn2" onclick="handleSlotClick(2)">
        <span class="big">Bet</span>
        <span class="sm" id="btnSub2">50.00 INR</span>
      </button>
    </div>
  </div>

  <!-- Live Feed (Hybrid: Bots + Real Firebase Players) -->
  <div class="feed-box">
    <div class="feed-tabs">
      <div class="f-tab active" onclick="switchFeed('all', this)">All Bets</div>
      <div class="f-tab" onclick="switchFeed('my', this)">My Bets</div>
      <div class="f-tab" onclick="switchFeed('top', this)">Top Wins</div>
    </div>
    <div class="feed-stats">
      <span><strong style="color:#fff;" id="activeBetsCount">18/18</strong> Bets</span>
      <span>Total win INR: <strong style="color:#28e04d;" id="totalFeedWin">0.00</strong></span>
    </div>
    <div class="col-head">
      <span>Player</span><span>Bet INR</span><span>X</span><span style="text-align:right;">Win INR</span>
    </div>
    <div id="liveFeedList"></div>
  </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="location.href='game.html'"><span class="nav-icon">🎰</span>Game</div>
  <div class="nav-item" onclick="location.href='wallet.html'"><span class="nav-icon">💰</span>Wallet</div>
  <div class="nav-item" onclick="location.href='refer.html'"><span class="nav-icon">🎁</span>Refer</div>
  <div class="nav-item" onclick="location.href='profile.html'"><span class="nav-icon">👤</span>Profile</div>
</div>

<script>
  const DB_URL = "https://coin-play-7ac49-default-rtdb.firebaseio.com";
  const mobile = localStorage.getItem("activeUser");
  if (!mobile) window.location.replace("index.html");

  let userData = JSON.parse(localStorage.getItem("cachedUser") || "{}");
  let winRateSetting = 35;

  function getTotalBal() {
    return Number(userData.depositBal ?? userData.depositBalance ?? 0) + Number(userData.winningBal ?? userData.winningBalance ?? 0);
  }

  function updateBalHeader() {
    document.getElementById("totalBalDisplay").innerText = getTotalBal().toFixed(2);
  }
  updateBalHeader();

  async function syncUserFromDB() {
    try {
      const [uRes, rRes] = await Promise.all([
        fetch(`${DB_URL}/users/${mobile}.json?t=${Date.now()}`),
        fetch(`${DB_URL}/settings/winRate.json?t=${Date.now()}`)
      ]);
      const u = await uRes.json();
      const r = await rRes.json();
      if (u && u.name) {
        userData = u;
        localStorage.setItem("cachedUser", JSON.stringify(u));
        updateBalHeader();
      }
      if (typeof r === "number") winRateSetting = r;
    } catch (e) {}
  }
  syncUserFromDB();

  // Dual Slot Controls
  function adjBet(slot, delta) {
    const inp = document.getElementById("betInp" + slot);
    let val = Math.max(10, (parseInt(inp.value) || 10) + delta);
    inp.value = val;
    updateSlotBtnUI(slot);
  }
  function setBet(slot, val) {
    document.getElementById("betInp" + slot).value = val;
    updateSlotBtnUI(slot);
  }
  document.getElementById("betInp1").addEventListener("input", () => updateSlotBtnUI(1));
  document.getElementById("betInp2").addEventListener("input", () => updateSlotBtnUI(2));

  // Game State Machine
  let gameState = "WAITING"; // WAITING | FLYING | CRASHED
  let currentMult = 1.00;
  let crashPoint = 2.00;
  let waitRemaining = 5.0;
  let historyList = [1.12, 1.48, 2.02, 2.44, 1.31, 1.18, 1.20, 10.65, 1.85, 3.40];
  let myHistoryBets = [];
  let currentFeedTab = "all";

  const slots = {
    1: { status: "IDLE", bet: 0 }, // IDLE | QUEUED | ACTIVE
    2: { status: "IDLE", bet: 0 }
  };

  function updateSlotBtnUI(s) {
    const btn = document.getElementById("btn" + s);
    const sub = document.getElementById("btnSub" + s);
    const inpVal = Math.max(10, parseInt(document.getElementById("betInp" + s).value) || 25);

    if (slots[s].status === "ACTIVE" && gameState === "FLYING") {
      btn.className = "action-btn btn-orange";
      btn.querySelector(".big").innerText = "Cash Out";
      sub.innerText = (slots[s].bet * currentMult).toFixed(2) + " INR";
    } else if (slots[s].status === "QUEUED") {
      btn.className = "action-btn btn-red";
      btn.querySelector(".big").innerText = "Cancel";
      sub.innerText = "Waiting (" + slots[s].bet + " INR)";
    } else {
      btn.className = "action-btn btn-green";
      btn.querySelector(".big").innerText = "Bet";
      sub.innerText = inpVal.toFixed(2) + " INR";
    }
  }

  async function handleSlotClick(s) {
    const state = slots[s].status;

    // 1. Cancel Queued Bet
    if (state === "QUEUED") {
      slots[s].status = "IDLE";
      slots[s].bet = 0;
      updateSlotBtnUI(s);
      return;
    }

    // 2. Cash Out Active Bet
    if (state === "ACTIVE" && gameState === "FLYING") {
      const cashMult = currentMult;
      const winAmt = Number((slots[s].bet * cashMult).toFixed(2));
      slots[s].status = "IDLE";
      updateSlotBtnUI(s);

      // Update Live Feed row for me
      const myRow = liveBets.find(b => b.id === "ME_" + s);
      if (myRow) {
        myRow.cashed = true;
        myRow.mult = cashMult.toFixed(2) + "x";
        myRow.win = winAmt;
      }
      myHistoryBets.unshift({
        name: (userData.name || "You") + " (Slot " + s + ")",
        bet: slots[s].bet,
        mult: cashMult.toFixed(2) + "x",
        win: winAmt,
        cashed: true
      });
      renderFeed();

      // Credit to Firebase winningBal & broadcast to live feed
      const newWin = Number(userData.winningBal ?? userData.winningBalance ?? 0) + Math.floor(winAmt);
      const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
      txns.unshift({
        type: `Aviator Cashout (${cashMult.toFixed(2)}x)`,
        amt: "+₹" + Math.floor(winAmt),
        date: new Date().toLocaleString()
      });
      userData.winningBal = newWin;
      userData.txns = txns.slice(0, 30);
      localStorage.setItem("cachedUser", JSON.stringify(userData));
      updateBalHeader();

      fetch(`${DB_URL}/users/${mobile}.json`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ winningBal: newWin, txns: userData.txns })
      });

      // Real-time feed broadcast for other online players
      const maskedMe = mobile.slice(0, 1) + "***" + mobile.slice(-1);
      fetch(`${DB_URL}/aviatorLiveFeed/${mobile}_${s}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: maskedMe,
          bet: slots[s].bet,
          mult: cashMult.toFixed(2) + "x",
          win: winAmt,
          cashed: true,
          ts: Date.now()
        })
      });
      return;
    }

    // 3. Place New Bet
    const betAmt = parseInt(document.getElementById("betInp" + s).value);
    if (!betAmt || betAmt < 10) return alert("Minimum bet ₹10 hai!");
    if (betAmt > getTotalBal()) return alert("Wallet mein itna balance nahi hai!");

    slots[s].bet = betAmt;
    if (gameState === "WAITING") {
      await activateBetFromWallet(s);
    } else {
      slots[s].status = "QUEUED";
      updateSlotBtnUI(s);
    }
  }

  async function activateBetFromWallet(s) {
    const betAmt = slots[s].bet;
    if (betAmt > getTotalBal()) {
      slots[s].status = "IDLE";
      updateSlotBtnUI(s);
      return;
    }

    let dBal = Number(userData.depositBal ?? userData.depositBalance ?? 0);
    let wBal = Number(userData.winningBal ?? userData.winningBalance ?? 0);
    if (dBal >= betAmt) {
      dBal -= betAmt;
    } else {
      const rem = betAmt - dBal;
      dBal = 0;
      wBal -= rem;
    }

    const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
    txns.unshift({ type: "Aviator Bet", amt: "-₹" + betAmt, date: new Date().toLocaleString() });

    userData.depositBal = dBal;
    userData.winningBal = wBal;
    userData.txns = txns.slice(0, 30);
    localStorage.setItem("cachedUser", JSON.stringify(userData));
    updateBalHeader();

    slots[s].status = "ACTIVE";
    updateSlotBtnUI(s);

    const maskedMe = mobile.slice(0, 1) + "***" + mobile.slice(-1);
    liveBets.unshift({
      id: "ME_" + s,
      name: maskedMe + " (You)",
      color: "#eab308",
      bet: betAmt,
      targetMult: 999,
      mult: "",
      win: 0,
      cashed: false,
      isMe: true
    });
    renderFeed();

    fetch(`${DB_URL}/users/${mobile}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ depositBal: dBal, winningBal: wBal, txns: userData.txns })
    });

    fetch(`${DB_URL}/aviatorLiveFeed/${mobile}_${s}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: maskedMe,
        bet: betAmt,
        mult: "",
        win: 0,
        cashed: false,
        ts: Date.now()
      })
    });
  }

  // Hybrid Live Feed Engine (Bots + Real Players from Firebase)
  const BOT_NAMES = ["i***4", "c***9", "p***k", "m***i", "n***j", "s***t", "b***l", "r***8", "v***2", "a***7", "k***n", "h***t", "d***5", "g***1"];
  const AVATAR_COLORS = ["#e11d48", "#2563eb", "#16a34a", "#d97706", "#9333ea", "#0891b2", "#db2777"];
  let liveBets = [];

  async function generateRoundBotsAndReal() {
    liveBets = [];
    // 1. Fetch real players from Firebase who played in the last 35 seconds
    try {
      const res = await fetch(`${DB_URL}/aviatorLiveFeed.json?t=${Date.now()}`);
      const realFeed = await res.json();
      if (realFeed) {
        const now = Date.now();
        Object.keys(realFeed).forEach(k => {
          const item = realFeed[k];
          if (item && (now - item.ts) < 35000 && !k.startsWith(mobile)) {
            liveBets.push({
              id: "REAL_" + k,
              name: item.name,
              color: "#28e04d",
              bet: Number(item.bet || 100),
              targetMult: item.cashed ? parseFloat(item.mult) : (Math.random() * 2.5 + 1.3),
              mult: item.cashed ? item.mult : "",
              win: item.cashed ? Number(item.win) : 0,
              cashed: Boolean(item.cashed),
              isMe: false
            });
          }
        });
      }
    } catch (e) {}

    // 2. Fill remaining slots with realistic bots (16-22 players)
    const botCount = Math.floor(Math.random() * 7) + 15;
    const presetAmts = [12629.68, 7272.10, 5000.00, 3999.88, 3000.00, 2500.00, 1500.00, 1000.00, 500.00, 250.00];
    for (let i = 0; i < botCount; i++) {
      const bName = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
      const bAmt = presetAmts[Math.floor(Math.random() * presetAmts.length)];
      const target = Number((Math.random() * 3.8 + 1.15).toFixed(2));
      liveBets.push({
        id: "BOT_" + i,
        name: bName,
        color: AVATAR_COLORS[i % AVATAR_COLORS.length],
        bet: bAmt,
        targetMult: target,
        mult: "",
        win: 0,
        cashed: false,
        isMe: false
      });
    }
    liveBets.sort((a, b) => b.bet - a.bet);
    document.getElementById("onlineCount").innerText = Math.floor(Math.random() * 60) + 240;
    renderFeed();
  }

  function switchFeed(tab, el) {
    currentFeedTab = tab;
    document.querySelectorAll(".f-tab").forEach(t => t.classList.remove("active"));
    el.classList.add("active");
    renderFeed();
  }

  function renderFeed() {
    const listEl = document.getElementById("liveFeedList");
    let displayList = liveBets;
    if (currentFeedTab === "my") {
      displayList = myHistoryBets;
    } else if (currentFeedTab === "top") {
      displayList = [...liveBets].filter(b => b.cashed).sort((a, b) => b.win - a.win);
    }

    let totalWinSum = 0;
    let cashedCount = 0;
    liveBets.forEach(b => {
      if (b.cashed) {
        totalWinSum += Number(b.win || 0);
        cashedCount++;
      }
    });

    document.getElementById("activeBetsCount").innerText = `${cashedCount}/${liveBets.length}`;
    document.getElementById("totalFeedWin").innerText = totalWinSum.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    listEl.innerHTML = displayList.slice(0, 20).map(b => `
      <div class="bet-item ${b.cashed ? 'cashed' : ''} ${b.isMe ? 'me' : ''}">
        <div class="p-cell">
          <span class="avatar" style="background:${b.color || '#e11d48'};">${b.name.charAt(0).toUpperCase()}</span>
          <span>${b.name}</span>
        </div>
        <div style="color:#ccc;">${Number(b.bet).toFixed(2)}</div>
        <div>${b.mult ? `<span class="x-badge">${b.mult}</span>` : ''}</div>
        <div class="win-val">${b.cashed ? Number(b.win).toFixed(2) : ''}</div>
      </div>
    `).join("") || "<div style='text-align:center; color:#666; padding:12px; font-size:12px;'>No bets yet</div>";
  }

  function renderHistoryStrip() {
    document.getElementById("histBar").innerHTML = historyList.slice(0, 14).map(val => {
      const cls = val >= 10 ? "h-pink" : (val >= 2 ? "h-purple" : "h-blue");
      return `<span class="h-pill ${cls}">${val.toFixed(2)}x</span>`;
    }).join("");
  }
  renderHistoryStrip();

  // Canvas Plane & Curve Animation
  const canvas = document.getElementById("flightCanvas");
  const ctx = canvas.getContext("2d");
  let animProgress = 0;

  function drawArena() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Subtle Rotating Sunburst Rays
    ctx.save();
    ctx.translate(40, canvas.height - 25);
    const angleOffset = (Date.now() / 4000) % (Math.PI * 2);
    for (let i = 0; i < 16; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      const a1 = angleOffset + (i * Math.PI) / 8;
      const a2 = a1 + Math.PI / 16;
      ctx.arc(0, 0, 480, a1, a2);
      ctx.closePath();
      ctx.fillStyle = "rgba(229, 25, 55, 0.04)";
      ctx.fill();
    }
    ctx.restore();

    if (gameState === "FLYING") {
      animProgress = Math.min(1, animProgress + 0.008);
      const startX = 28;
      const startY = canvas.height - 24;
      const hoverY = Math.sin(Date.now() / 220) * 6;
      const endX = startX + animProgress * (canvas.width - 95);
      const endY = startY - Math.pow(animProgress, 0.85) * (canvas.height - 65) + hoverY;

      // Filled Area Under Curve
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(startX + (endX - startX) * 0.55, startY, endX, endY);
      ctx.lineTo(endX, startY);
      ctx.closePath();
      ctx.fillStyle = "rgba(229, 25, 55, 0.25)";
      ctx.fill();

      // Red Curve Line
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(startX + (endX - startX) * 0.55, startY, endX, endY);
      ctx.strokeStyle = "#e51937";
      ctx.lineWidth = 4;
      ctx.stroke();

      // Red Plane Icon
      ctx.save();
      ctx.translate(endX, endY);
      ctx.rotate(-0.22);
      ctx.font = "28px Arial";
      ctx.fillText("🛩️", -14, 8);
      ctx.restore();
    }
    requestAnimationFrame(drawArena);
  }
  drawArena();

  // Main Round Loop
  async function startWaitingPhase() {
    gameState = "WAITING";
    currentMult = 1.00;
    animProgress = 0;
    waitRemaining = 5.0;

    const multEl = document.getElementById("multText");
    multEl.className = "mult-text";
    multEl.innerText = "1.00x";
    document.getElementById("statusText").innerText = "PLACE YOUR BETS";
    document.getElementById("waitBarWrap").style.display = "block";

    await generateRoundBotsAndReal();

    // Activate any queued bets
    for (let s of [1, 2]) {
      if (slots[s].status === "QUEUED") {
        await activateBetFromWallet(s);
      } else {
        updateSlotBtnUI(s);
      }
    }

    const waitTimer = setInterval(() => {
      waitRemaining -= 0.1;
      const pct = Math.max(0, (waitRemaining / 5.0) * 100);
      document.getElementById("waitBarFill").style.width = pct + "%";

      if (waitRemaining <= 0) {
        clearInterval(waitTimer);
        document.getElementById("waitBarWrap").style.display = "none";
        startFlyingPhase();
      }
    }, 100);
  }

  function startFlyingPhase() {
    gameState = "FLYING";
    document.getElementById("statusText").innerText = "";

    // Crash point based on Admin WinRate setting
    const isEarlyCrash = (Math.random() * 100) > winRateSetting;
    if (isEarlyCrash && Math.random() < 0.45) {
      crashPoint = Number((1.05 + Math.random() * 0.65).toFixed(2));
    } else {
      crashPoint = Number((1.40 + Math.random() * 6.5).toFixed(2));
    }

    const flyTimer = setInterval(() => {
      const speed = currentMult < 2 ? 0.015 : (currentMult < 5 ? 0.035 : 0.07);
      currentMult = Number((currentMult + speed).toFixed(2));
      document.getElementById("multText").innerText = currentMult.toFixed(2) + "x";

      // Update active Cash Out buttons
      if (slots[1].status === "ACTIVE") updateSlotBtnUI(1);
      if (slots[2].status === "ACTIVE") updateSlotBtnUI(2);

      // Bot & Real player live cashouts
      let changed = false;
      liveBets.forEach(b => {
        if (!b.cashed && !b.isMe && currentMult >= b.targetMult) {
          b.cashed = true;
          b.mult = b.targetMult.toFixed(2) + "x";
          b.win = Number((b.bet * b.targetMult).toFixed(2));
          changed = true;
        }
      });
      if (changed) renderFeed();

      // Check Crash
      if (currentMult >= crashPoint) {
        clearInterval(flyTimer);
        handleCrashPhase();
      }
    }, 80);
  }

  function handleCrashPhase() {
    gameState = "CRASHED";
    const multEl = document.getElementById("multText");
    multEl.className = "mult-text crashed";
    multEl.innerText = crashPoint.toFixed(2) + "x";
    document.getElementById("statusText").innerText = "FLEW AWAY!";

    historyList.unshift(crashPoint);
    renderHistoryStrip();

    // Mark lost bets
    for (let s of [1, 2]) {
      if (slots[s].status === "ACTIVE") {
        myHistoryBets.unshift({
          name: (userData.name || "You") + " (Slot " + s + ")",
          bet: slots[s].bet,
          mult: "",
          win: 0,
          cashed: false
        });
        slots[s].status = "IDLE";
        slots[s].bet = 0;
        updateSlotBtnUI(s);
      }
    }
    renderFeed();

    setTimeout(() => {
      startWaitingPhase();
    }, 3000);
  }

  // Start Live Game Loop
  startWaitingPhase();
</script>
