<head>

<style>

  body { background: #0b0b0e; color: #fff; display: flex; justify-content: center; padding-bottom: 72px; }
  .app { width: 100%; max-width: 440px; background: #14151a; min-height: 100vh; padding: 10px; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #1c1d24; border-radius: 12px; margin-bottom: 8px; }
  .logo-title { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 17px; color: #ff2e4c; font-style: italic; }
  .sync-pill { font-size: 9px; background: rgba(40, 224, 77, 0.15); color: #28e04d; border: 1px solid rgba(40, 224, 77, 0.4); padding: 2px 6px; border-radius: 8px; font-style: normal; font-weight: bold; }
  .hdr-right { display: flex; align-items: center; gap: 8px; }
  .snd-btn { background: #262833; border: 1px solid #3c3f4f; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .bal-pill { background: #262833; border: 1px solid #3c3f4f; padding: 5px 11px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #28e04d; cursor: pointer; }
  .history-bar { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
  .history-bar::-webkit-scrollbar { display: none; }
  .hist-pill { padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: bold; background: #22242e; flex-shrink: 0; }
  .c-blue { color: #38bdf8; }
  .c-purple { color: #c084fc; }
  .c-pink { color: #f472b6; }
  .arena { position: relative; width: 100%; height: 215px; border-radius: 16px; border: 1px solid #2b2d3a; overflow: hidden; background: radial-gradient(circle at 20% 80%, #3a0b19 0%, #14151a 65%, #0d0e12 100%); margin-bottom: 10px; }
  canvas { width: 100%; height: 100%; display: block; }
  .center-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; width: 90%; }

  .m-pill.active { background: #2c2e3b; color: #fff; }

  .left-inputs { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; background: #121318; border: 1px solid #323442; border-radius: 20px; padding: 4px 10px; }
  .step-btn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid #555; background: transparent; color: #fff; font-weight: bold; cursor: pointer; }
  .bet-inp { background: transparent; border: none; color: #fff; font-size: 15px; font-weight: bold; width: 65px; text-align: center; outline: none; }
  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .q-btn { background: #252732; border: none; color: #ccc; padding: 4px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }
  .action-btn { flex: 1.15; border: none; border-radius: 14px; font-weight: 900; font-size: 15px; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-transform: uppercase; box-shadow: 0 4px 0 rgba(0,0,0,0.4); }
  .btn-green { background: linear-gradient(180deg, #28e04d, #16a332); }
  .btn-orange { background: linear-gradient(180deg, #ff9f1c, #e67700); }
  .btn-queued { background: linear-gradient(180deg, #0284c7, #0369a1); }
  .action-sub { font-size: 11px; font-weight: normal; margin-top: 2px; }
  .auto-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #2a2c38; font-size: 11px; color: #bbb; }
  .auto-group { display: flex; align-items: center; gap: 5px; }
  .auto-toggle { padding: 4px 9px; border-radius: 12px; border: 1px solid #3f4254; background: #121318; color: #9ca3af; font-size: 10px; font-weight: bold; cursor: pointer; }
  .auto-toggle.on { background: rgba(40, 224, 77, 0.18); border-color: #28e04d; color: #28e04d; }
  .auto-mult-inp { width: 48px; background: #121318; border: 1px solid #3f4254; color: #ffd700; border-radius: 8px; padding: 3px 4px; text-align: center; font-weight: bold; font-size: 11px; outline: none; }
  .feed-box { background: #1c1d24; border: 1px solid #2d2f3b; border-radius: 16px; padding: 10px; margin-top: 10px; }
  .feed-tabs { display: flex; background: #121318; border-radius: 20px; padding: 3px; margin-bottom: 8px; }
  .f-tab { flex: 1; text-align: center; font-size: 11px; padding: 5px; border-radius: 16px; color: #999; font-weight: bold; cursor: pointer; }
  .f-tab.active { background: #2c2e3b; color: #fff; }
  .feed-header { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; padding: 4px 6px 8px; border-bottom: 1px solid #2a2c38; }
  .feed-row { display: grid; grid-template-columns: 1.3fr 1fr 0.8fr 1.1fr; align-items: center; background: #14151a; padding: 7px 8px; border-radius: 8px; margin-top: 5px; font-size: 11px; }
  .feed-row.won { background: rgba(40, 224, 77, 0.14); border: 1px solid rgba(40, 224, 77, 0.45); }
  .feed-row.me { border-color: #ffd700; }
  .mult-badge { background: #262833; color: #c084fc; padding: 2px 6px; border-radius: 6px; font-weight: bold; text-align: center; width: fit-content; }
  .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 440px; background: #1c1d24; border-top: 1px solid #2d2f3b; display: flex; justify-content: space-around; padding: 9px 0; z-index: 999; }
  .nav-item { text-align: center; color: #888; font-size: 11px; cursor: pointer; }
  .nav-item.active { color: #ffd700; font-weight: bold; }
  .nav-icon { font-size: 19px; display: block; }
</style>

<script>
  const DB_URL = "https://coin-play-7ac49-default-rtdb.firebaseio.com";
  const mobile = localStorage.getItem("activeUser");
  if (!mobile) window.location.replace("index.html");

  let userData = {};
  try { userData = JSON.parse(localStorage.getItem("cachedUser") || "{}"); } catch (e) {}
  let winRateSetting = 20;

  // Server Clock Offset Sync (2-3 sec lag khatam karne ke liye)
  let serverOffsetMs = 0;
  function getSyncedNow() {
    return Date.now() + serverOffsetMs;
  }

  // Per-User Loss & Consecutive Loss Counter
  const LOSS_KEY = "bg_av_loss_" + mobile;
  const STREAK_LOSS_KEY = "bg_av_user_losses_" + mobile;
  let userNetLoss = Number(localStorage.getItem(LOSS_KEY) || 0);
  let userConsecLosses = Number(localStorage.getItem(STREAK_LOSS_KEY) || 0);

  function trackUserAviatorPnL(deltaLoss) {
    userNetLoss = Math.max(0, Number((userNetLoss + deltaLoss).toFixed(2)));
    localStorage.setItem(LOSS_KEY, String(userNetLoss));
  }

  function getTotalBal() {
    return (Number(userData.depositBal ?? userData.depositBalance ?? 0) || 0) + (Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0);
  }
  function updateHeaderBal() {
    document.getElementById("balDisplay").innerText = getTotalBal().toFixed(2);
  }
  updateHeaderBal();

  async function syncUserFromDB() {
    try {
      const [uRes, rRes] = await Promise.all([
        fetch(`${DB_URL}/users/${mobile}.json?t=${Date.now()}`),
        fetch(`${DB_URL}/settings/rates/aviator.json?t=${Date.now()}`)
      ]);
      const u = await uRes.json();
      const r = await rRes.json();
      if (u && typeof u === "object") {
        userData = { ...userData, ...u };
        localStorage.setItem("cachedUser", JSON.stringify(userData));
        updateHeaderBal();
      }
      if (typeof r === "number") winRateSetting = r;
    } catch (e) {}
  }
  syncUserFromDB();

  let soundEnabled = true, audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById("sndBtn").innerText = soundEnabled ? "🔊" : "🔇";
  }
  function playAviatorSound(type) {
    if (!soundEnabled) return;
    try {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      if (type === "bet") {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = "sine"; osc.frequency.setValueAtTime(620, now); osc.frequency.exponentialRampToValueAtTime(920, now + 0.08);
        gain.gain.setValueAtTime(0.18, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.09);
      } else if (type === "takeoff") {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = "triangle"; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(420, now + 0.55);
        gain.gain.setValueAtTime(0.16, now); gain.gain.exponentialRampToValueAtTime(0.005, now + 0.6);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.6);
      } else if (type === "cashout") {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = "triangle"; osc.frequency.setValueAtTime(freq, now + idx * 0.07);
          gain.gain.setValueAtTime(0.24, now + idx * 0.07); gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.07 + 0.28);
          osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + idx * 0.07); osc.stop(now + idx * 0.07 + 0.28);
        });
      } else if (type === "crash") {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = "sawtooth"; osc.frequency.setValueAtTime(340, now); osc.frequency.exponentialRampToValueAtTime(55, now + 0.45);
        gain.gain.setValueAtTime(0.24, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.48);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.48);
      }
    } catch (e) {}
  }

  let gameState = "WAITING", currentMult = 1.00, historyList = [2.45, 1.38, 1.00, 14.20, 2.82, 1.64, 4.35, 1.19];
  const panels = [
    { state: "IDLE", amount: 20, autoBet: false, autoCash: false },
    { state: "IDLE", amount: 50, autoBet: false, autoCash: false }
  ];

  function switchCardMode(idx, mode) {
    document.getElementById(`tabMode${idx}_bet`).classList.toggle("active", mode === "bet");
    document.getElementById(`tabMode${idx}_auto`).classList.toggle("active", mode === "auto");
    document.getElementById(`autoRow${idx}`).style.display = mode === "auto" ? "flex" : "none";
  }
  function toggleAutoBet(idx) {
    initAudio();
    panels[idx].autoBet = !panels[idx].autoBet;
    const btn = document.getElementById(`autoBetToggle${idx}`);
    btn.innerText = panels[idx].autoBet ? "ON" : "OFF";
    btn.classList.toggle("on", panels[idx].autoBet);
    if (panels[idx].autoBet && panels[idx].state === "IDLE") {
      if (gameState === "WAITING") placePanelBetNow(idx, true);
      else { panels[idx].amount = parseInt(document.getElementById(`betInp${idx}`).value) || 20; panels[idx].state = "QUEUED"; updatePanelBtn(idx); }
    }
  }
  function toggleAutoCash(idx) {
    initAudio();
    panels[idx].autoCash = !panels[idx].autoCash;
    const btn = document.getElementById(`autoCashToggle${idx}`);
    btn.innerText = panels[idx].autoCash ? "ON" : "OFF";
    btn.classList.toggle("on", panels[idx].autoCash);
  }
  function onBetInputChange(idx) {
    const val = parseInt(document.getElementById(`betInp${idx}`).value) || 10;
    if (panels[idx].state === "IDLE") document.getElementById(`betSub${idx}`).innerText = val.toFixed(2) + " INR";
  }
  function adjBet(idx, delta) {
    if (panels[idx].state !== "IDLE") return;
    const inp = document.getElementById(`betInp${idx}`);
    const val = Math.max(10, (parseInt(inp.value) || 10) + delta);
    inp.value = val;
    document.getElementById(`betSub${idx}`).innerText = val.toFixed(2) + " INR";
  }
  function setBet(idx, val) {
    if (panels[idx].state !== "IDLE") return;
    document.getElementById(`betInp${idx}`).value = val;
    document.getElementById(`betSub${idx}`).innerText = val.toFixed(2) + " INR";
  }
  function updatePanelBtn(idx) {
    const btn = document.getElementById(`betBtn${idx}`), p = panels[idx];
    const inpVal = parseInt(document.getElementById(`betInp${idx}`).value) || 20;
    if (p.state === "IDLE") { btn.className = "action-btn btn-green"; btn.innerHTML = `<span>BET</span><span class="action-sub" id="betSub${idx}">${inpVal.toFixed(2)} INR</span>`; }
    else if (p.state === "QUEUED") { btn.className = "action-btn btn-queued"; btn.innerHTML = `<span>CANCEL</span><span class="action-sub">₹${p.amount} (NEXT ROUND)</span>`; }
    else if (p.state === "PLACED") { btn.className = "action-btn btn-queued"; btn.innerHTML = `<span>✔ BET PLACED</span><span class="action-sub">₹${p.amount} (STARTING...)</span>`; }
    else if (p.state === "ACTIVE") { btn.className = "action-btn btn-orange"; btn.innerHTML = `<span>CASH OUT</span><span class="action-sub">${(p.amount * currentMult).toFixed(2)} INR</span>`; }
  }
   // ========================================================
  // 4-CHAIN QUEUE GENERATOR (Never gets stuck on one pattern)
  // Chain 1: Under 2x (1.12x - 1.94x)
  // Chain 2: 2x to 3x (2.05x - 2.95x)
  // Chain 3: 1.00x Instant Crash
  // Chain 4: Rare 10x-20x Spike at 2nd, 3rd, or 5th position
  // ========================================================
  let chainQueue = [];
  let crashCountSinceBigSpike = 0;
  let roundHadUserBet = false;
  let allCashoutBoostApplied = false;

  function buildNextChainQueue() {
    const q = [];
    const pickChain = Math.floor(Math.random() * 4);

    if (pickChain === 0) {
      // Chain 1: 3-5 rounds under 2x
      const len = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < len; i++) q.push(Number((1.12 + Math.random() * 0.82).toFixed(2)));
      crashCountSinceBigSpike += len;
    } else if (pickChain === 1) {
      // Chain 2: 2-4 rounds between 2x and 3x
      const len = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < len; i++) q.push(Number((2.05 + Math.random() * 0.90).toFixed(2)));
    } else if (pickChain === 2) {
      // Chain 3: 1.00x instant crash + 2-3 up-to-5x rounds
      q.push(1.00);
      crashCountSinceBigSpike += 2;
      const len = 2 + Math.floor(Math.random() * 2);
      for (let i = 0; i < len; i++) q.push(Number((1.35 + Math.random() * 3.55).toFixed(2)));
    } else {
      // Chain 4: Rare 10x-20x spike ONLY after many crashes, placed at 2nd, 3rd, or 5th slot
      if (crashCountSinceBigSpike >= 7 && Math.random() < 0.45) {
        crashCountSinceBigSpike = 0;
        const spikeSlot = [1, 2, 4][Math.floor(Math.random() * 3)]; // 2nd, 3rd, or 5th round
        for (let i = 0; i < 6; i++) {
          if (i === spikeSlot) {
            q.push(Number((10.50 + Math.random() * 10.50).toFixed(2))); // 10.5x - 21.0x
          } else {
            // Baaki rounds 5x tak normal chalte rahein
            q.push(Number((1.25 + Math.random() * 3.65).toFixed(2)));
          }
        }
      } else {
        // Fallback: Up to 5x normal spectator chain
        for (let i = 0; i < 4; i++) {
          const val = Number((1.18 + Math.random() * 3.72).toFixed(2));
          if (val < 2.0) crashCountSinceBigSpike++;
          q.push(val);
        }
      }
    }
    return q;
  }

  function generateCrashPoint() {
    if (chainQueue.length === 0) chainQueue = buildNextChainQueue();
    return chainQueue.shift();
  }

  // ========================================================
  // ACTIVE USER BET OVERRIDE
  // ========================================================
  async function adjustCrashOnUserBet(betAmt) {
    if (!roomState || !roomState.roundId) return;
    roundHadUserBet = true;
    let targetCrash;

    // 1. Kai baar crash hone ke baad kam amount (₹10-₹20) par 5x, 10x, 15x tease
    const teaseFreq = winRateSetting >= 65 ? 0.45 : (winRateSetting >= 45 ? 0.28 : 0.16);
    if (betAmt <= 20 && userConsecLosses >= 5 && Math.random() < teaseFreq) {
      const teasePool = [5.20, 10.40, 15.10];
      targetCrash = Number((teasePool[Math.floor(Math.random() * teasePool.length)] + Math.random() * 1.2).toFixed(2));
    }
    // 2. Normal active bet control: 2x ke andar ya 2x tak crash
    else if (betAmt <= 30) {
      if (winRateSetting >= 60 && Math.random() < 0.50) {
        targetCrash = Number((2.10 + Math.random() * 1.40).toFixed(2));
      } else {
        targetCrash = Number((1.05 + Math.random() * 0.93).toFixed(2)); // 1.05x - 1.98x
      }
    }
    // 3. Badi bet (₹31+) par tight under-2x crash
    else {
      if (winRateSetting >= 75 && Math.random() < 0.35) {
        targetCrash = Number((2.05 + Math.random() * 0.95).toFixed(2));
      } else {
        targetCrash = Number((1.00 + Math.random() * 0.72).toFixed(2)); // 1.00x - 1.72x
      }
    }

    roomState.crashAt = targetCrash;
    try {
      await fetch(`${DB_URL}/aviatorRoom/crashAt.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(targetCrash)
      });
    } catch (e) {}
  }

  // ========================================================
  // ALL USERS CASHOUT -> 20x, 30x, 50x, 100x ROCKET
  // ========================================================
  async function boostCrashWhenAllCashedOut() {
    if (allCashoutBoostApplied || !roomState || gameState !== "FLYING") return;
    if (!roundHadUserBet) return;

    const anyMyBetActive = panels.some(p => p.state === "ACTIVE" || p.state === "PLACED");
    if (anyMyBetActive) return;

    const now = getSyncedNow();
    const anyOtherActive = liveBetsData.some(b => !b.isMe && !b.id.startsWith("bot_") && !b.mult);
    if (anyOtherActive) return;

    allCashoutBoostApplied = true;
    // Kaafi baar (~75% chance) jab sab cashout kar lein toh 20x-100x tak jaye
    if (Math.random() < 0.75 && Number(roomState.crashAt) < 20) {
      const rocketTargets = [21.50, 31.80, 52.40, 101.60];
      const pick = rocketTargets[Math.floor(Math.random() * rocketTargets.length)];
      const boostedCrash = Number((Math.max(currentMult + 5, pick) + Math.random() * 4).toFixed(2));
      roomState.crashAt = boostedCrash;
      try {
        await fetch(`${DB_URL}/aviatorRoom/crashAt.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(boostedCrash)
        });
      } catch (e) {}
    }
  }

  const WAIT_MS = 5000, CRASH_PAUSE_MS = 2600;
  let lastHandledRoundId = null, roundCrashHandled = false, roundTakeoffHandled = false, isCreatingRound = false;
  const bootNow = getSyncedNow();
  let roomState = { roundId: "R" + bootNow, waitStart: bootNow, flyStart: bootNow + WAIT_MS, crashAt: 2.38, history: historyList };

  function calcMultAtElapsed(sec) { return Number(Math.pow(Math.E, 0.135 * sec).toFixed(2)); }
  function calcDurationToCrash(targetMult) { return targetMult <= 1.00 ? 0.15 : Math.log(targetMult) / 0.135; }

  async function publishNewRound(prevCrashedMult) {
    if (isCreatingRound) return;
    isCreatingRound = true;
    const now = getSyncedNow(), nextCrash = generateCrashPoint();
    let newHist = [...historyList];
    if (prevCrashedMult && !isNaN(prevCrashedMult)) { newHist.unshift(Number(prevCrashedMult)); newHist = newHist.slice(0, 12); }
    const newRoom = { roundId: "R" + now, waitStart: now, flyStart: now + WAIT_MS, crashAt: nextCrash, history: newHist, updatedAt: now };
    roomState = newRoom; historyList = newHist; renderHistory();
    try { await fetch(`${DB_URL}/aviatorRoom.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(newRoom) }); }
    catch (e) {} finally { isCreatingRound = false; }
  }

  // Fast 450ms Sync + Server Date Header Clock Alignment (Zero 2-3s Delay)
  async function syncRoomFromFirebase() {
    try {
      const reqStart = Date.now();
      const res = await fetch(`${DB_URL}/aviatorRoom.json?t=${reqStart}`);
      if (!res.ok) return;

      const dateHdr = res.headers.get("Date");
      if (dateHdr) {
        const srvTime = new Date(dateHdr).getTime();
        const rttHalf = (Date.now() - reqStart) / 2;
        if (!isNaN(srvTime)) serverOffsetMs = (srvTime + rttHalf) - Date.now();
      }

      const data = await res.json();
      const now = getSyncedNow();
      if (!data || !data.roundId || !data.flyStart || !data.crashAt) { await publishNewRound(null); return; }

      const roundEndMs = Number(data.flyStart) + calcDurationToCrash(Number(data.crashAt)) * 1000 + CRASH_PAUSE_MS;
      if (now >= roundEndMs + 150) { await publishNewRound(Number(data.crashAt)); return; }

      roomState = data;
      if (Array.isArray(data.history) && data.history.length > 0) { historyList = data.history; renderHistory(); }
    } catch (e) {}
  }

  async function placePanelBetNow(idx, isAuto = false) {
    const val = parseInt(document.getElementById(`betInp${idx}`).value);
    if (!val || val < 10) {
      if (isAuto) { panels[idx].autoBet = false; document.getElementById(`autoBetToggle${idx}`).innerText = "OFF"; document.getElementById(`autoBetToggle${idx}`).classList.remove("on"); }
      else alert("Minimum bet ₹10 hai!");
      return false;
    }
    if (val > getTotalBal()) {
      if (isAuto) { panels[idx].autoBet = false; document.getElementById(`autoBetToggle${idx}`).innerText = "OFF"; document.getElementById(`autoBetToggle${idx}`).classList.remove("on"); alert(`Panel ${idx + 1}: Balance kam hone par Auto-Bet band kar diya gaya!`); }
      else alert("Wallet mein itna balance nahi hai!");
      return false;
    }
    playAviatorSound("bet");
    let dBal = Number(userData.depositBal ?? userData.depositBalance ?? 0) || 0;
    let wBal = Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0;
    if (dBal >= val) dBal -= val; else { const rem = val - dBal; dBal = 0; wBal -= rem; }
    const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
    txns.unshift({ type: "Aviator Bet", amt: "-₹" + val, date: new Date().toLocaleString() });
    userData.depositBal = dBal; userData.winningBal = wBal; userData.txns = txns.slice(0, 30);
    localStorage.setItem("cachedUser", JSON.stringify(userData));
    updateHeaderBal();

    trackUserAviatorPnL(val);
    panels[idx].amount = val; panels[idx].state = "PLACED"; updatePanelBtn(idx);

    const combinedBet = (panels[0].state === "PLACED" ? panels[0].amount : 0) + (panels[1].state === "PLACED" ? panels[1].amount : 0);
    adjustCrashOnUserBet(combinedBet || val);

    const maskedMe = mobile.slice(0, 1) + "***" + mobile.slice(-1);
    liveBetsData.unshift({ id: "me_" + idx, name: maskedMe + " (You)", bet: val, mult: null, win: 0, isMe: true });
    renderLiveFeed();
    fetch(`${DB_URL}/users/${mobile}.json`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ depositBal: dBal, winningBal: wBal, txns: userData.txns }) });
    fetch(`${DB_URL}/aviatorLiveFeed/${mobile}_${idx}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: maskedMe, bet: val, mult: null, win: 0, ts: getSyncedNow() }) });
    return true;
  }

  async function handleBetBtn(idx) {
    initAudio();
    const p = panels[idx];
    if (p.state === "IDLE") {
      if (gameState === "WAITING") await placePanelBetNow(idx, false);
      else {
        const val = parseInt(document.getElementById(`betInp${idx}`).value);
        if (!val || val < 10) return alert("Minimum bet ₹10 hai!");
        if (val > getTotalBal()) return alert("Wallet mein itna balance nahi hai!");
        playAviatorSound("bet"); p.amount = val; p.state = "QUEUED"; updatePanelBtn(idx);
      }
    } else if (p.state === "QUEUED") { p.state = "IDLE"; updatePanelBtn(idx); }
    else if (p.state === "ACTIVE" && gameState === "FLYING") {
      const cashMult = currentMult, winAmt = Number((p.amount * cashMult).toFixed(2));
      p.state = "IDLE"; updatePanelBtn(idx); playAviatorSound("cashout");
      trackUserAviatorPnL(-winAmt);
      userConsecLosses = 0;
      localStorage.setItem(STREAK_LOSS_KEY, "0");

      const newWin = Number(((Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0) + winAmt).toFixed(2));
      const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
      txns.unshift({ type: `Aviator Win (${cashMult.toFixed(2)}x)`, amt: "+₹" + winAmt, date: new Date().toLocaleString() });
      userData.winningBal = newWin; userData.txns = txns.slice(0, 30);
      localStorage.setItem("cachedUser", JSON.stringify(userData));
      updateHeaderBal();
      const maskedMe = mobile.slice(0, 1) + "***" + mobile.slice(-1);
      const myRow = liveBetsData.find(b => b.id === "me_" + idx && !b.mult);
      if (myRow) { myRow.mult = cashMult.toFixed(2) + "x"; myRow.win = winAmt; }
      myBetsHistory.unshift({ bet: p.amount, mult: cashMult.toFixed(2) + "x", win: winAmt });
      renderLiveFeed();
      fetch(`${DB_URL}/users/${mobile}.json`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ winningBal: newWin, txns: userData.txns }) });
      fetch(`${DB_URL}/aviatorLiveFeed/${mobile}_${idx}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: maskedMe, bet: p.amount, mult: cashMult.toFixed(2) + "x", win: winAmt, ts: getSyncedNow() }) });

      boostCrashWhenAllCashedOut();
    }
  }

  const canvas = document.getElementById("aviatorCanvas"), ctx = canvas.getContext("2d");
  function renderHistory() {
    document.getElementById("historyBar").innerHTML = historyList.slice(0, 12).map(m => {
      const val = Number(m), cls = val < 2 ? "c-blue" : (val < 10 ? "c-purple" : "c-pink");
      return `<span class="hist-pill ${cls}">${val.toFixed(2)}x</span>`;
    }).join("");
  }
  renderHistory();

  function drawCanvas(progress = 0) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "rgba(255,255,255,0.04)"; ctx.lineWidth = 1;
    for (let i = 0; i < canvas.width; i += 35) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
    for (let j = 0; j < canvas.height; j += 35) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke(); }
    if (gameState === "FLYING") {
      const px = Math.min(345, 35 + progress * 310), py = Math.max(42, 185 - Math.pow(progress, 0.85) * 140 + Math.sin(Date.now() / 160) * 5);
      ctx.beginPath(); ctx.moveTo(25, 195); ctx.quadraticCurveTo(px * 0.55, 192, px, py); ctx.lineTo(px, 195); ctx.closePath();
      ctx.fillStyle = "rgba(255, 46, 76, 0.25)"; ctx.fill();
      ctx.beginPath(); ctx.moveTo(25, 195); ctx.quadraticCurveTo(px * 0.55, 192, px, py); ctx.strokeStyle = "#ff2e4c"; ctx.lineWidth = 4; ctx.stroke();
      drawPlaneIcon(px, py);
    } else if (gameState === "WAITING") drawPlaneIcon(38, 182);
  }
  function drawPlaneIcon(x, y) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.18);
    ctx.fillStyle = "#ff2e4c"; ctx.beginPath(); ctx.ellipse(0, 0, 22, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-18, -2); ctx.lineTo(-24, -12); ctx.lineTo(-12, -2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(8, -2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffbe0b"; ctx.beginPath(); ctx.arc(-25, 0, 4 + Math.random() * 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function tickSynchronizedEngine() {
    if (!roomState) return;
    const now = getSyncedNow(), flyStart = Number(roomState.flyStart), targetCrash = Number(roomState.crashAt);
    const crashTimeMs = flyStart + calcDurationToCrash(targetCrash) * 1000, nextRoundTimeMs = crashTimeMs + CRASH_PAUSE_MS;

    if (lastHandledRoundId !== roomState.roundId) {
      lastHandledRoundId = roomState.roundId;
      roundCrashHandled = false;
      roundTakeoffHandled = false;
      roundHadUserBet = false;
      allCashoutBoostApplied = false;
      [0, 1].forEach(idx => {
        if (panels[idx].state === "QUEUED") placePanelBetNow(idx, false);
        else if (panels[idx].autoBet && panels[idx].state === "IDLE") placePanelBetNow(idx, true);
      });
    }

    if (now < flyStart) {
      gameState = "WAITING"; currentMult = 1.00;
      document.getElementById("multDisplay").innerText = "1.00x";
      document.getElementById("multDisplay").classList.remove("crashed");
      document.getElementById("statusText").innerText = "PLACE YOUR BETS";
      document.getElementById("waitBarWrap").style.display = "block";
      document.getElementById("waitBar").style.width = Math.max(0, Math.min(100, ((flyStart - now) / WAIT_MS) * 100)) + "%";
      drawCanvas(0);
    } else if (now >= flyStart && now < crashTimeMs) {
      gameState = "FLYING";
      if (!roundTakeoffHandled) {
        roundTakeoffHandled = true; playAviatorSound("takeoff");
        [0, 1].forEach(idx => { if (panels[idx].state === "PLACED") { panels[idx].state = "ACTIVE"; updatePanelBtn(idx); } });
      }
      const elapsedSec = (now - flyStart) / 1000;
      currentMult = Math.min(targetCrash, calcMultAtElapsed(elapsedSec));
      document.getElementById("multDisplay").innerText = currentMult.toFixed(2) + "x";
      document.getElementById("multDisplay").classList.remove("crashed");
      document.getElementById("statusText").innerText = "";
      document.getElementById("waitBarWrap").style.display = "none";
      [0, 1].forEach(idx => {
        if (panels[idx].state === "ACTIVE") {
          updatePanelBtn(idx);
          const autoTarget = parseFloat(document.getElementById(`autoCashVal${idx}`).value) || 2.00;
          if (panels[idx].autoCash && currentMult >= autoTarget) handleBetBtn(idx);
        }
      });
      drawCanvas(Math.min(1, elapsedSec / 7.5));
    } else if (now >= crashTimeMs && now < nextRoundTimeMs) {
      gameState = "CRASHED"; currentMult = targetCrash;
      document.getElementById("multDisplay").innerText = targetCrash.toFixed(2) + "x";
      document.getElementById("multDisplay").classList.add("crashed");
      document.getElementById("statusText").innerText = "FLEW AWAY!";
      document.getElementById("waitBarWrap").style.display = "none";
      drawCanvas(1);
      if (!roundCrashHandled) {
        roundCrashHandled = true; playAviatorSound("crash");
        let lostThisRound = false;
        [0, 1].forEach(idx => {
          if (panels[idx].state === "ACTIVE" || panels[idx].state === "PLACED") {
            lostThisRound = true;
            myBetsHistory.unshift({ bet: panels[idx].amount, mult: "0.00x", win: 0 });
            panels[idx].state = "IDLE"; updatePanelBtn(idx);
          }
        });
        if (lostThisRound) {
          userConsecLosses++;
          localStorage.setItem(STREAK_LOSS_KEY, String(userConsecLosses));
        }
        renderLiveFeed();
      }
    } else publishNewRound(targetCrash);
  }

  const BOT_NAMES = ["d***4", "a***9", "r***2", "s***7", "v***1", "k***8", "m***3", "p***5", "n***6", "t***0"];
  let liveBetsData = [], myBetsHistory = [], activeFeedTab = "all";
  function seedBots() {
    liveBetsData = [];
    for (let i = 0; i < 16; i++) {
      const bAmt = [50, 100, 200, 500, 1000][Math.floor(Math.random() * 5)];
      liveBetsData.push({ id: "bot_" + i, name: BOT_NAMES[i % BOT_NAMES.length], bet: bAmt, mult: null, win: 0, isMe: false, targetBotCash: Number((1.45 + Math.random() * 4.50).toFixed(2)) });
    }
    renderLiveFeed();
  }
  seedBots();

  setInterval(async () => {
    if (gameState === "WAITING" && Math.random() < 0.35) { seedBots(); document.getElementById("onlinePlayers").innerText = 215 + Math.floor(Math.random() * 65); }
    if (gameState === "FLYING") {
      liveBetsData.forEach(b => { if (!b.isMe && !b.mult && currentMult >= b.targetBotCash) { b.mult = currentMult.toFixed(2) + "x"; b.win = Number((b.bet * currentMult).toFixed(2)); } });
    }
    try {
      const res = await fetch(`${DB_URL}/aviatorLiveFeed.json?t=${Date.now()}`);
      const realFeed = await res.json();
      if (realFeed && typeof realFeed === "object") {
        const now = getSyncedNow();
        Object.keys(realFeed).forEach(k => {
          const item = realFeed[k];
          if (item && (now - item.ts) < 20000 && !k.startsWith(mobile)) {
            const ex = liveBetsData.find(x => x.id === k);
            if (ex) { ex.mult = item.mult; ex.win = item.win; }
            else liveBetsData.unshift({ id: k, name: item.name, bet: item.bet, mult: item.mult, win: item.win, isMe: false });
          }
        });
      }
    } catch (e) {}
    if (roundHadUserBet && gameState === "FLYING") boostCrashWhenAllCashedOut();
    renderLiveFeed();
  }, 900);

  function switchFeedTab(tab, el) { activeFeedTab = tab; document.querySelectorAll(".f-tab").forEach(t => t.classList.remove("active")); el.classList.add("active"); renderLiveFeed(); }
  function renderLiveFeed() {
    const listEl = document.getElementById("liveBetsList");
    let rows = activeFeedTab === "all" ? liveBetsData.slice(0, 20) : (activeFeedTab === "my" ? myBetsHistory.slice(0, 15).map(m => ({ name: "You", bet: m.bet, mult: m.mult, win: m.win, isMe: true })) : [...liveBetsData].filter(b => b.win > 0).sort((a, b) => b.win - a.win).slice(0, 15));
    const totalWin = liveBetsData.reduce((acc, b) => acc + (Number(b.win) || 0), 0);
    document.getElementById("totalBetsCount").innerText = `${liveBetsData.length}/25 Bets`;
    document.getElementById("totalWinSum").innerText = totalWin.toFixed(2);
    listEl.innerHTML = rows.map(r => `<div class="feed-row ${r.win > 0 ? 'won' : ''} ${r.isMe ? 'me' : ''}"><div style="font-weight:bold; color:#ddd;">👤 ${r.name}</div><div>₹${Number(r.bet).toFixed(2)}</div><div>${r.mult ? `<span class="mult-badge">${r.mult}</span>` : '-'}</div><div style="text-align:right; font-weight:bold; color:${r.win > 0 ? '#28e04d' : '#777'};">${r.win > 0 ? '₹' + Number(r.win).toFixed(2) : '-'}</div></div>`).join("") || "<div style='text-align:center; color:#777; padding:12px; font-size:12px;'>Abhi koi record nahi hai</div>";
  }

  function hasRunningBet() { return panels.some(p => p.state === "PLACED" || p.state === "ACTIVE" || p.state === "QUEUED"); }
  function safeExitTo(url) {
    const msg = hasRunningBet() ? "⚠️ Aapki bet abhi chal rahi hai! Agar aap back jayenge toh aapki bet cancel/loss ho jayegi.\n\nKya aap sach mein bahar nikalna chahte hain?" : "Kya aap Aviator game se bahar nikalna chahte hain?";
    if (confirm(msg)) window.location.href = url;
  }
  history.pushState(null, "", location.href);
  window.addEventListener("popstate", function () {
    const msg = hasRunningBet() ? "⚠️ Aapki bet abhi chal rahi hai! Back jaane par aapki bet cancel/loss ho jayegi.\n\nKya aap sach mein back jaana chahte hain?" : "Kya aap Aviator game se bahar nikalna chahte hain?";
    if (confirm(msg)) window.location.href = "game.html"; else history.pushState(null, "", location.href);
  });
  window.addEventListener("beforeunload", function (e) { if (hasRunningBet()) { e.preventDefault(); e.returnValue = ""; } });

  syncRoomFromFirebase();
  setInterval(syncRoomFromFirebase, 450);
  setInterval(tickSynchronizedEngine, 40);
</script>
