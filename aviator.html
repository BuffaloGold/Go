  .feed-box { background: #1b1c22; border-radius: 14px; padding: 10px; margin-top: 8px; }

  .feed-stats { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #aaa; padding: 4px 4px 8px; border-bottom: 1px solid #272932; }

  .p-cell { display: flex; align-items: center; gap: 6px; font-weight: 600; color: #ddd; }
  .avatar { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #fff; }

  .nav-item.active { color: #ffd700; font-weight: bold; }
  .nav-icon { font-size: 19px; display: block; }
</style>

<script>
  const DB_URL = "https://coin-play-7ac49-default-rtdb.firebaseio.com";
  const mobile = localStorage.getItem("activeUser");
  if (!mobile) window.location.replace("index.html");

  let userData = {};
  try {
    userData = JSON.parse(localStorage.getItem("cachedUser") || "{}");
  } catch (e) {}

  let winRateSetting = 35;

  function getTotalBal() {
    const dep = Number(userData.depositBal ?? userData.depositBalance ?? 0) || 0;
    const win = Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0;
    return dep + win;
  }

  function updateBalHeader() {
    document.getElementById("totalBalDisplay").innerText = getTotalBal().toFixed(2);
  }
  updateBalHeader();

  async function syncUserFromDB() {
    try {
      const [uRes, rRes] = await Promise.all([
        fetch(`${DB_URL}/users/${mobile}.json?t=${Date.now()}`),
              fetch(`${DB_URL}/settings/rates/aviator.json?t=${Date.now()}`)
       
      ]);
      const u = await uRes.json();
      const r = await rRes.json();
      if (u && typeof u === "object") {
        userData = { ...userData, ...u };
        localStorage.setItem("cachedUser", JSON.stringify(userData));
        updateBalHeader();
      }
      if (typeof r === "number") winRateSetting = r;
    } catch (e) {}
  }
  syncUserFromDB();

  // ==========================================
  // WEB AUDIO AVIATOR SOUND EFFECTS
  // ==========================================
  let soundOn = true;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById("sndBtn").innerText = soundOn ? "🔊" : "🔇";
  }

  function playAviatorSound(type) {
    if (!soundOn) return;
    try {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === "bet") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(920, now + 0.08);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      } else if (type === "takeoff") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.45);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.48);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.48);
      } else if (type === "cashout") {
        [587.33, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now + idx * 0.07);
          gain.gain.setValueAtTime(0.22, now + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.07 + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.07);
          osc.stop(now + idx * 0.07 + 0.25);
        });
      } else if (type === "crash") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(360, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.42);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      }
    } catch (e) {}
  }
 // ==========================================
  // DUAL BET & AUTO-BET CONTROLS
  // ==========================================
  function switchPanelMode(slot, mode) {
    const tBet = document.getElementById("tabBet" + slot);
    const tAuto = document.getElementById("tabAuto" + slot);
    const bar = document.getElementById("autoBar" + slot);
    if (mode === "auto") {
      tBet.classList.remove("active");
      tAuto.classList.add("active");
      bar.classList.add("show");
    } else {
      tAuto.classList.remove("active");
      tBet.classList.add("active");
      bar.classList.remove("show");
    }
  }

  function toggleAutoBet(slot) {
    initAudio();
    slots[slot].autoBet = !slots[slot].autoBet;
    const tog = document.getElementById("autoBetToggle" + slot);
    if (slots[slot].autoBet) {
      tog.classList.add("on");
      tog.innerText = "🔁 Auto Bet: ON";
      if (slots[slot].status === "IDLE") {
        handleSlotClick(slot);
      }
    } else {
      tog.classList.remove("on");
      tog.innerText = "🔁 Auto Bet: OFF";
    }
  }

  function adjBet(slot, delta) {
    const inp = document.getElementById("betInp" + slot);
    let val = Math.max(10, (parseInt(inp.value) || 10) + delta);
    inp.value = val;
    updateSlotBtnUI(slot);
  }
  function setBet(slot, val) {
    document.getElementById("betInp" + slot).value = val;
    updateSlotBtnUI(slot);
  }
  document.getElementById("betInp1").addEventListener("input", () => updateSlotBtnUI(1));
  document.getElementById("betInp2").addEventListener("input", () => updateSlotBtnUI(2));

  // ==========================================
  // SHARED MULTIPLAYER ROOM STATE (WITH INSTANT START)
  // ==========================================
  const WAIT_MS = 5500;
  const CRASH_HOLD_MS = 3200;

  let historyList = [1.12, 1.48, 2.02, 2.44, 1.31, 1.18, 1.20, 10.65, 1.85, 3.40];
  let myHistoryBets = [];
  let currentFeedTab = "all";

  // Start immediately with a valid local round so UI & Live Feed NEVER get stuck
  const bootNow = Date.now();
  let roomState = {
    roundId: "R" + bootNow,
    waitStart: bootNow,
    flyStart: bootNow + WAIT_MS,
    crashPoint: 2.35,
    history: historyList
  };

  let lastHandledRoundId = null;
  let lastPhase = "";
  let isTransitioning = false;
  let gameState = "WAITING";
  let currentMult = 1.00;

  const slots = {
    1: { status: "IDLE", bet: 0, autoBet: false },
    2: { status: "IDLE", bet: 0, autoBet: false }
  };

  function updateSlotBtnUI(s) {
    const btn = document.getElementById("btn" + s);
    const sub = document.getElementById("btnSub" + s);
    const panel = document.getElementById("panel" + s);
    const inpVal = Math.max(10, parseInt(document.getElementById("betInp" + s).value) || 25);

    if (slots[s].status === "ACTIVE" && gameState === "FLYING") {
      panel.classList.add("has-bet");
      btn.className = "action-btn btn-orange";
      btn.querySelector(".big").innerText = "Cash Out";
      sub.innerText = (slots[s].bet * currentMult).toFixed(2) + " INR";
    } else if (slots[s].status === "ACTIVE" && gameState === "WAITING") {
      panel.classList.add("has-bet");
      btn.className = "action-btn btn-blue";
      btn.querySelector(".big").innerText = "✔ Bet Placed";
      sub.innerText = "₹" + slots[s].bet + " (Starting...)";
    } else if (slots[s].status === "QUEUED") {
      panel.classList.add("has-bet");
      btn.className = "action-btn btn-red";
      btn.querySelector(".big").innerText = "Cancel";
      sub.innerText = "Next Round (₹" + slots[s].bet + ")";
    } else {
      panel.classList.remove("has-bet");
      btn.className = "action-btn btn-green";
      btn.querySelector(".big").innerText = "Bet";
      sub.innerText = inpVal.toFixed(2) + " INR";
    }
  }

  function calcMultiplierAtElapsed(elapsedSec) {
    if (elapsedSec <= 0) return 1.00;
    const val = Math.pow(Math.E, 0.072 * elapsedSec);
    return Number(val.toFixed(2));
  }

  function calcDurationForCrash(cp) {
    if (cp <= 1.00) return 0.1;
    return Math.log(cp) / 0.072;
  }

  function generateNextCrashPoint() {
    const isEarlyCrash = (Math.random() * 100) > winRateSetting;
    if (isEarlyCrash && Math.random() < 0.45) {
      return Number((1.05 + Math.random() * 0.65).toFixed(2));
    }
    return Number((1.35 + Math.random() * 6.5).toFixed(2));
  }

  async function createNewSharedRound(prevCrashPoint) {
    if (isTransitioning) return;
    isTransitioning = true;

    const now = Date.now();
    const newRoundId = "R" + now;
    const nextCrash = generateNextCrashPoint();

    let updatedHist = Array.isArray(historyList) ? [...historyList] : [1.48, 2.02, 1.31];
    if (typeof prevCrashPoint === "number" && prevCrashPoint >= 1) {
      updatedHist.unshift(prevCrashPoint);
      updatedHist = updatedHist.slice(0, 15);
    }

    const newRoom = {
      roundId: newRoundId,
      waitStart: now,
      flyStart: now + WAIT_MS,
      crashPoint: nextCrash,
      history: updatedHist
    };

    // Update locally right away so game never pauses even if Firebase is slow
    roomState = newRoom;
    historyList = updatedHist;
    renderHistoryStrip();

    try {
      await fetch(`${DB_URL}/aviatorRoom.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(newRoom)
      });
    } catch (e) {
    } finally {
      isTransitioning = false;
    }
  }

  async function syncRoomFromFirebase() {
    try {
      const res = await fetch(`${DB_URL}/aviatorRoom.json?t=${Date.now()}`);
      if (!res.ok) return;
      const data = await res.json();
      const now = Date.now();

      if (!data || !data.roundId || !data.flyStart || !data.crashPoint) {
        await createNewSharedRound(null);
        return;
      }

      const flyDurMs = calcDurationForCrash(Number(data.crashPoint)) * 1000;
      const roundEndMs = Number(data.flyStart) + flyDurMs + CRASH_HOLD_MS;

      if (now >= roundEndMs + 400) {
        await createNewSharedRound(Number(data.crashPoint));
        return;
      }

      roomState = data;
      if (Array.isArray(data.history) && data.history.length > 0) {
        historyList = data.history;
        renderHistoryStrip();
      }
    } catch (e) {}
  }

  // ==========================================
  // BET & CASHOUT ACTIONS
  // ==========================================
  async function executeCashOut(s) {
    if (slots[s].status !== "ACTIVE" || gameState !== "FLYING") return;

    const cashMult = currentMult;
    const betPlaced = slots[s].bet;
    const winAmt = Number((betPlaced * cashMult).toFixed(2));
    slots[s].status = "IDLE";
    slots[s].bet = 0;
    updateSlotBtnUI(s);
    playAviatorSound("cashout");

    const myRow = liveBets.find(b => b.id === "ME_" + s);
    if (myRow) {
      myRow.cashed = true;
      myRow.mult = cashMult.toFixed(2) + "x";
      myRow.win = winAmt;
    }
    myHistoryBets.unshift({
      name: (userData.name || "You") + " (Slot " + s + ")",
      bet: betPlaced,
      mult: cashMult.toFixed(2) + "x",
      win: winAmt,
      cashed: true
    });
    renderFeed();

    const newWin = (Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0) + Math.floor(winAmt);
    const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
    txns.unshift({
      type: `Aviator Cashout (${cashMult.toFixed(2)}x)`,
      amt: "+₹" + Math.floor(winAmt),
      date: new Date().toLocaleString()
    });
    userData.winningBal = newWin;
    userData.txns = txns.slice(0, 30);
    localStorage.setItem("cachedUser", JSON.stringify(userData));
    updateBalHeader();

    fetch(`${DB_URL}/users/${mobile}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ winningBal: newWin, txns: userData.txns })
    });

    const maskedMe = mobile.slice(0, 1) + "***" + mobile.slice(-1);
    fetch(`${DB_URL}/aviatorLiveFeed/${mobile}_${s}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        roundId: roomState ? roomState.roundId : "",
        name: maskedMe,
        bet: betPlaced,
        mult: cashMult.toFixed(2) + "x",
        win: winAmt,
        cashed: true,
        ts: Date.now()
      })
    });
  }

  async function handleSlotClick(s) {
    initAudio();
    const state = slots[s].status;

    if (state === "QUEUED") {
      slots[s].status = "IDLE";
      slots[s].bet = 0;
      if (slots[s].autoBet) {
        slots[s].autoBet = false;
        const tog = document.getElementById("autoBetToggle" + s);
        tog.classList.remove("on");
        tog.innerText = "🔁 Auto Bet: OFF";
      }
      updateSlotBtnUI(s);
      return;
    }

    if (state === "ACTIVE" && gameState === "FLYING") {
      await executeCashOut(s);
      return;
    }

    if (state === "ACTIVE" && gameState === "WAITING") {
      return;
    }

    const betAmt = parseInt(document.getElementById("betInp" + s).value);
    if (!betAmt || betAmt < 10) {
      if (slots[s].autoBet) toggleAutoBet(s);
      return alert("Minimum bet ₹10 hai!");
    }
    if (betAmt > getTotalBal()) {
      if (slots[s].autoBet) toggleAutoBet(s);
      return alert("Wallet mein itna balance nahi hai!");
    }

    slots[s].bet = betAmt;
    playAviatorSound("bet");

    if (gameState === "WAITING") {
      await activateBetFromWallet(s);
    } else {
      slots[s].status = "QUEUED";
      updateSlotBtnUI(s);
    }
  }

  async function activateBetFromWallet(s) {
    const betAmt = slots[s].bet;
    if (betAmt > getTotalBal()) {
      slots[s].status = "IDLE";
      slots[s].bet = 0;
      if (slots[s].autoBet) {
        slots[s].autoBet = false;
        const tog = document.getElementById("autoBetToggle" + s);
        tog.classList.remove("on");
        tog.innerText = "🔁 Auto Bet: OFF";
      }
      updateSlotBtnUI(s);
      return;
    }

    let dBal = Number(userData.depositBal ?? userData.depositBalance ?? 0) || 0;
    let wBal = Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0;
    if (dBal >= betAmt) {
      dBal -= betAmt;
    } else {
      const rem = betAmt - dBal;
      dBal = 0;
      wBal -= rem;
    }

    const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
    txns.unshift({ type: "Aviator Bet", amt: "-₹" + betAmt, date: new Date().toLocaleString() });

    userData.depositBal = dBal;
    userData.winningBal = wBal;
    userData.txns = txns.slice(0, 30);
    localStorage.setItem("cachedUser", JSON.stringify(userData));
    updateBalHeader();

    slots[s].status = "ACTIVE";
    updateSlotBtnUI(s);

    const maskedMe = mobile.slice(0, 1) + "***" + mobile.slice(-1);
    liveBets.unshift({
      id: "ME_" + s,
      name: maskedMe + " (You)",
      color: "#eab308",
      bet: betAmt,
      targetMult: 999,
      mult: "",
      win: 0,
      cashed: false,
      isMe: true
    });
    renderFeed();

    fetch(`${DB_URL}/users/${mobile}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ depositBal: dBal, winningBal: wBal, txns: userData.txns })
    });

    fetch(`${DB_URL}/aviatorLiveFeed/${mobile}_${s}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        roundId: roomState ? roomState.roundId : "",
        name: maskedMe,
        bet: betAmt,
        mult: "",
        win: 0,
        cashed: false,
        ts: Date.now()
      })
    });
 }
 // ==========================================
  // DETERMINISTIC BOTS + REAL FIREBASE FEED
  // ==========================================
  const BOT_NAMES = ["i***4", "c***9", "p***k", "m***i", "n***j", "s***t", "b***l", "r***8", "v***2", "a***7", "k***n", "h***t", "d***5", "g***1"];
  const AVATAR_COLORS = ["#e11d48", "#2563eb", "#16a34a", "#d97706", "#9333ea", "#0891b2", "#db2777"];
  const PRESET_AMTS = [12629.68, 7272.10, 5000.00, 3999.88, 3000.00, 2500.00, 1500.00, 1000.00, 500.00, 250.00];
  let liveBets = [];

  function seededRand(seed) {
    const x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
  }

  function buildLocalBotsImmediately(rId) {
    const numSeed = parseInt(String(rId).replace(/\D/g, "").slice(-6)) || 12345;
    const bots = [];
    const botCount = 16 + Math.floor(seededRand(numSeed) * 6);
    for (let i = 0; i < botCount; i++) {
      const r1 = seededRand(numSeed + i * 11);
      const r2 = seededRand(numSeed + i * 23);
      const r3 = seededRand(numSeed + i * 37);
      const bName = BOT_NAMES[Math.floor(r1 * BOT_NAMES.length)];
      const bAmt = PRESET_AMTS[Math.floor(r2 * PRESET_AMTS.length)];
      const target = Number((1.15 + r3 * 3.8).toFixed(2));
      bots.push({
        id: "BOT_" + i,
        name: bName,
        color: AVATAR_COLORS[i % AVATAR_COLORS.length],
        bet: bAmt,
        targetMult: target,
        mult: "",
        win: 0,
        cashed: false,
        isMe: false
      });
    }
    bots.sort((a, b) => b.bet - a.bet);
    liveBets = bots;
    document.getElementById("onlineCount").innerText = 240 + Math.floor(seededRand(numSeed + 99) * 60);
    renderFeed();
  }

  async function mergeRealFeedFromFirebase() {
    try {
      const res = await fetch(`${DB_URL}/aviatorLiveFeed.json?t=${Date.now()}`);
      if (!res.ok) return;
      const realFeed = await res.json();
      if (!realFeed) return;
      const now = Date.now();
      let added = false;
      Object.keys(realFeed).forEach(k => {
        const item = realFeed[k];
        if (item && (now - item.ts) < 35000 && !k.startsWith(mobile)) {
          const existing = liveBets.find(b => b.id === "REAL_" + k);
          if (existing) {
            if (item.cashed) {
              existing.cashed = true;
              existing.mult = item.mult;
              existing.win = Number(item.win);
              added = true;
            }
          } else {
            liveBets.unshift({
              id: "REAL_" + k,
              name: item.name,
              color: "#28e04d",
              bet: Number(item.bet || 100),
              targetMult: item.cashed ? parseFloat(item.mult) : 999,
              mult: item.cashed ? item.mult : "",
              win: item.cashed ? Number(item.win) : 0,
              cashed: Boolean(item.cashed),
              isMe: false
            });
            added = true;
          }
        }
      });
      if (added) renderFeed();
    } catch (e) {}
  }

  function switchFeed(tab, el) {
    currentFeedTab = tab;
    document.querySelectorAll(".f-tab").forEach(t => t.classList.remove("active"));
    el.classList.add("active");
    renderFeed();
  }

  function renderFeed() {
    const listEl = document.getElementById("liveFeedList");
    let displayList = liveBets;
    if (currentFeedTab === "my") {
      displayList = myHistoryBets;
    } else if (currentFeedTab === "top") {
      displayList = [...liveBets].filter(b => b.cashed).sort((a, b) => b.win - a.win);
    }

    let totalWinSum = 0;
    let cashedCount = 0;
    liveBets.forEach(b => {
      if (b.cashed) {
        totalWinSum += Number(b.win || 0);
        cashedCount++;
      }
    });

    document.getElementById("activeBetsCount").innerText = `${cashedCount}/${liveBets.length}`;
    document.getElementById("totalFeedWin").innerText = totalWinSum.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    listEl.innerHTML = displayList.slice(0, 20).map(b => `
      <div class="bet-item ${b.cashed ? 'cashed' : ''} ${b.isMe ? 'me' : ''}">
        <div class="p-cell">
          <span class="avatar" style="background:${b.color || '#e11d48'};">${b.name.charAt(0).toUpperCase()}</span>
          <span>${b.name}</span>
        </div>
        <div style="color:#ccc;">${Number(b.bet).toFixed(2)}</div>
        <div>${b.mult ? `<span class="x-badge">${b.mult}</span>` : ''}</div>
        <div class="win-val">${b.cashed ? Number(b.win).toFixed(2) : ''}</div>
      </div>
    `).join("") || "<div style='text-align:center; color:#666; padding:12px; font-size:12px;'>No bets yet</div>";
  }

  function renderHistoryStrip() {
    document.getElementById("histBar").innerHTML = historyList.slice(0, 14).map(val => {
      const cls = val >= 10 ? "h-pink" : (val >= 2 ? "h-purple" : "h-blue");
      return `<span class="h-pill ${cls}">${Number(val).toFixed(2)}x</span>`;
    }).join("");
  }
  renderHistoryStrip();

  // ==========================================
  // CANVAS PLANE & CURVE ANIMATION
  // ==========================================
  const canvas = document.getElementById("flightCanvas");
  const ctx = canvas.getContext("2d");

  function drawArena() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(40, canvas.height - 25);
    const angleOffset = (Date.now() / 4000) % (Math.PI * 2);
    for (let i = 0; i < 16; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      const a1 = angleOffset + (i * Math.PI) / 8;
      const a2 = a1 + Math.PI / 16;
      ctx.arc(0, 0, 480, a1, a2);
      ctx.closePath();
      ctx.fillStyle = "rgba(229, 25, 55, 0.04)";
      ctx.fill();
    }
    ctx.restore();

    if (gameState === "FLYING" && roomState) {
      const elapsedSec = Math.max(0, (Date.now() - Number(roomState.flyStart)) / 1000);
      const animProgress = Math.min(1, elapsedSec / 7.5);
      const startX = 28;
      const startY = canvas.height - 24;
      const hoverY = Math.sin(Date.now() / 220) * 6;
      const endX = startX + animProgress * (canvas.width - 95);
      const endY = startY - Math.pow(animProgress, 0.85) * (canvas.height - 65) + hoverY;

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(startX + (endX - startX) * 0.55, startY, endX, endY);
      ctx.lineTo(endX, startY);
      ctx.closePath();
      ctx.fillStyle = "rgba(229, 25, 55, 0.25)";
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(startX + (endX - startX) * 0.55, startY, endX, endY);
      ctx.strokeStyle = "#e51937";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.save();
      ctx.translate(endX, endY);
      ctx.rotate(-0.22);
      ctx.font = "28px Arial";
      ctx.fillText("🛩️", -14, 8);
      ctx.restore();
    }
    requestAnimationFrame(drawArena);
  }
  drawArena();

  // ==========================================
  // MASTER SYNCHRONIZED TICKER LOOP (60ms)
  // ==========================================
  async function tickSynchronizedRound() {
    if (!roomState) return;
    const now = Date.now();
    const flyStart = Number(roomState.flyStart);
    const cp = Number(roomState.crashPoint);
    const flyDurMs = calcDurationForCrash(cp) * 1000;
    const crashTimeMs = flyStart + flyDurMs;
    const nextRoundTimeMs = crashTimeMs + CRASH_HOLD_MS;

    if (lastHandledRoundId !== roomState.roundId) {
      lastHandledRoundId = roomState.roundId;
      buildLocalBotsImmediately(roomState.roundId);
      mergeRealFeedFromFirebase();

      if (now < flyStart) {
        for (let s of [1, 2]) {
          if (slots[s].status === "QUEUED") {
            await activateBetFromWallet(s);
          } else if (slots[s].autoBet && slots[s].status === "IDLE") {
            const autoAmt = Math.max(10, parseInt(document.getElementById("betInp" + s).value) || 25);
            slots[s].bet = autoAmt;
            await activateBetFromWallet(s);
          } else {
            updateSlotBtnUI(s);
          }
        }
      }
    }

    if (now < flyStart) {
      gameState = "WAITING";
      currentMult = 1.00;
      const multEl = document.getElementById("multText");
      multEl.className = "mult-text";
      multEl.innerText = "1.00x";
      document.getElementById("statusText").innerText = "PLACE YOUR BETS";
      document.getElementById("waitBarWrap").style.display = "block";
      const remPct = Math.max(0, Math.min(100, ((flyStart - now) / WAIT_MS) * 100));
      document.getElementById("waitBarFill").style.width = remPct + "%";
      if (lastPhase !== "WAITING") {
        lastPhase = "WAITING";
        updateSlotBtnUI(1);
        updateSlotBtnUI(2);
      }
    } else if (now >= flyStart && now < crashTimeMs) {
      gameState = "FLYING";
      document.getElementById("waitBarWrap").style.display = "none";
      document.getElementById("statusText").innerText = "";

      if (lastPhase !== "FLYING") {
        lastPhase = "FLYING";
        playAviatorSound("takeoff");
      }

      const elapsedSec = (now - flyStart) / 1000;
      currentMult = Math.min(cp, calcMultiplierAtElapsed(elapsedSec));
      const multEl = document.getElementById("multText");
      multEl.className = "mult-text";
      multEl.innerText = currentMult.toFixed(2) + "x";

      for (let s of [1, 2]) {
        if (slots[s].status === "ACTIVE") {
          const autoCoEnabled = document.getElementById("autoCoCheck" + s).checked;
          const autoCoTarget = parseFloat(document.getElementById("autoCoVal" + s).value) || 2.0;
          if (autoCoEnabled && currentMult >= autoCoTarget && currentMult < cp) {
            executeCashOut(s);
          } else {
            updateSlotBtnUI(s);
          }
        }
      }

      let changed = false;
      liveBets.forEach(b => {
        if (!b.cashed && !b.isMe && currentMult >= b.targetMult) {
          b.cashed = true;
          b.mult = b.targetMult.toFixed(2) + "x";
          b.win = Number((b.bet * b.targetMult).toFixed(2));
          changed = true;
        }
      });
      if (changed) renderFeed();

    } else if (now >= crashTimeMs && now < nextRoundTimeMs) {
      gameState = "CRASHED";
      currentMult = cp;
      document.getElementById("waitBarWrap").style.display = "none";
      const multEl = document.getElementById("multText");
      multEl.className = "mult-text crashed";
      multEl.innerText = cp.toFixed(2) + "x";
      document.getElementById("statusText").innerText = "FLEW AWAY!";

      if (lastPhase !== "CRASHED") {
        lastPhase = "CRASHED";
        playAviatorSound("crash");

        for (let s of [1, 2]) {
          if (slots[s].status === "ACTIVE") {
            myHistoryBets.unshift({
              name: (userData.name || "You") + " (Slot " + s + ")",
              bet: slots[s].bet,
              mult: "",
              win: 0,
              cashed: false
            });
            slots[s].status = "IDLE";
            slots[s].bet = 0;
            updateSlotBtnUI(s);
          }
        }
        renderFeed();
      }
    } else {
      await createNewSharedRound(cp);
    }
  }

  // Boot live feed immediately, then sync with Firebase
  buildLocalBotsImmediately(roomState.roundId);
  syncRoomFromFirebase();
  setInterval(syncRoomFromFirebase, 1500);
  setInterval(mergeRealFeedFromFirebase, 2000);
  setInterval(tickSynchronizedRound, 60);
</script>
