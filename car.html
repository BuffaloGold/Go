<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Car Roulette - Buffalo Gold</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { background: #090b10; color: #fff; display: flex; justify-content: center; padding-bottom: 75px; }
  .app { width: 100%; max-width: 440px; background: #12151f; min-height: 100vh; padding: 10px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #1b2030; border-radius: 12px; margin-bottom: 8px; border: 1px solid #2c344d; }
  .logo-title { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; color: #ffbe0b; }
  .sync-pill { font-size: 9px; background: rgba(40, 224, 77, 0.15); color: #28e04d; border: 1px solid rgba(40, 224, 77, 0.4); padding: 2px 6px; border-radius: 8px; font-weight: bold; }
  .hdr-right { display: flex; align-items: center; gap: 8px; }
  .snd-btn { background: #262d42; border: 1px solid #3c4766; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .bal-pill { background: #262d42; border: 1px solid #3c4766; padding: 5px 11px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #28e04d; cursor: pointer; }

  /* Recent Winners Strip */
  .hist-strip { display: flex; gap: 5px; overflow-x: auto; padding: 3px 2px 8px; scrollbar-width: none; }
  .hist-strip::-webkit-scrollbar { display: none; }
  .h-badge {
    padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold;
    background: #1d2233; border: 1px solid #2e3752; color: #e2e8f0; flex-shrink: 0;
  }
  .h-badge.super { border-color: #ffd700; color: #ffd700; background: rgba(255, 215, 0, 0.14); }

  /* 3D Roulette Track Canvas */
  .track-arena {
    position: relative;
    width: 100%;
    height: 225px;
    border-radius: 16px;
    border: 2px solid #2c354f;
    overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #1e2947 0%, #0d111a 78%, #07090f 100%);
    margin-bottom: 10px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.85);
  }
  canvas { width: 100%; height: 100%; display: block; }
  .center-hud {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none;
  }
  .phase-tag { font-size: 10px; font-weight: 800; color: #38bdf8; letter-spacing: 0.8px; }
  .timer-num { font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
  .win-car-big { font-size: 28px; display: block; }

  /* Chip Selector */
  .chip-bar {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    background: #1b2030; border: 1px solid #2c344d; border-radius: 14px;
    padding: 8px 10px; margin-bottom: 10px;
  }
  .chip-btn {
    flex: 1; padding: 7px 2px; border-radius: 10px; border: 1.5px solid #384261;
    background: #12151f; color: #cbd5e1; font-size: 12px; font-weight: 900; cursor: pointer;
  }
  .chip-btn.active { background: #ffd700; color: #000; border-color: #fff; transform: scale(1.05); }
  .btn-clear {
    padding: 7px 10px; border-radius: 10px; border: 1px solid #ef4444;
    background: rgba(239, 68, 68, 0.16); color: #f87171; font-size: 11px; font-weight: bold; cursor: pointer;
  }

  /* 8 Car Slots Betting Grid */
  .cars-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px;
    margin-bottom: 10px;
  }
  .car-card {
    background: linear-gradient(180deg, #1e2436, #141824);
    border: 1.5px solid #2e3752; border-radius: 12px; padding: 8px 4px;
    text-align: center; cursor: pointer; position: relative; transition: transform 0.1s;
  }
  .car-card:active { transform: scale(0.95); }
  .car-card.vip { border-color: rgba(255, 215, 0, 0.55); background: linear-gradient(180deg, #2d2212, #17130d); }
  .car-card.winner-glow {
    border: 2px solid #28e04d;
    box-shadow: 0 0 18px rgba(40, 224, 77, 0.75);
    transform: scale(1.04);
  }
  .car-mult { font-size: 10px; font-weight: 900; color: #ffd700; display: block; }
  .car-emoji { font-size: 24px; margin: 3px 0; display: block; }
  .car-name { font-size: 10px; font-weight: 800; color: #cbd5e1; display: block; }
  .my-bet-pill {
    margin-top: 4px; background: #0284c7; color: #fff; font-size: 10px;
    font-weight: 900; border-radius: 8px; padding: 2px 4px; display: none;
  }
  .my-bet-pill.show { display: block; }

  /* Live Feed */
  .feed-box { background: #1b2030; border: 1px solid #2c344d; border-radius: 14px; padding: 10px; }
  .feed-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #cbd5e1; padding-bottom: 7px; border-bottom: 1px solid #2c344d; margin-bottom: 6px; }
  .feed-row {
    display: grid; grid-template-columns: 1.2fr 1fr 0.7fr 1.1fr; align-items: center;
    background: #12151f; padding: 6px 8px; border-radius: 8px; margin-bottom: 4px; font-size: 11px;
  }
  .feed-row.win { background: rgba(40, 224, 77, 0.12); border: 1px solid rgba(40, 224, 77, 0.35); }
  .feed-row.me { border-color: #ffd700; }

  /* Bottom Navigation */
  .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 440px; background: #1b2030; border-top: 1px solid #2c344d; display: flex; justify-content: space-around; padding: 9px 0; z-index: 999; }
  .nav-item { text-align: center; color: #888; font-size: 11px; cursor: pointer; }
  .nav-item.active { color: #ffd700; font-weight: bold; }
  .nav-icon { font-size: 19px; display: block; }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo-title">
      <span onclick="safeExitTo('game.html')" style="cursor:pointer; color:#aaa; font-size:16px;">⬅</span>
      <span>🏎️ 3D CAR ROULETTE</span>
      <span class="sync-pill">● 25S LIVE</span>
    </div>
    <div class="hdr-right">
      <button type="button" class="snd-btn" id="sndBtn" onclick="toggleSound()">🔊</button>
      <div class="bal-pill" onclick="safeExitTo('wallet.html')">₹<span id="balDisplay">0.00</span></div>
    </div>
  </div>

  <!-- Recent Winning Cars Bar -->
  <div class="hist-strip" id="histStrip"></div>

  <!-- 3D Circular Track Arena -->
  <div class="track-arena">
    <canvas id="carTrackCanvas" width="420" height="225"></canvas>
    <div class="center-hud">
      <div class="phase-tag" id="phaseTag">PLACE BETS</div>
      <div class="timer-num" id="timerNum">15s</div>
    </div>
  </div>

  <!-- Chip Selector Bar -->
  <div class="chip-bar">
    <button type="button" class="chip-btn active" onclick="selectChip(10, this)">₹10</button>
    <button type="button" class="chip-btn" onclick="selectChip(50, this)">₹50</button>
    <button type="button" class="chip-btn" onclick="selectChip(100, this)">₹100</button>
    <button type="button" class="chip-btn" onclick="selectChip(500, this)">₹500</button>
    <button type="button" class="chip-btn" onclick="selectChip(1000, this)">₹1K</button>
  </div>

  <!-- 8 Luxury Car Slots Grid -->
  <div class="cars-grid" id="carsGrid"></div>

  <!-- Live Winners Feed -->
  <div class="feed-box">
    <div class="feed-head">
      <span>🔥 LIVE GARAGE WINNERS</span>
      <span style="color:#28e04d; font-weight:bold;" id="onlineCount">● 268 Racing</span>
    </div>
    <div id="liveFeedList"></div>
  </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="safeExitTo('game.html')"><span class="nav-icon">🎰</span>Game</div>
  <div class="nav-item" onclick="safeExitTo('wallet.html')"><span class="nav-icon">💰</span>Wallet</div>
  <div class="nav-item" onclick="safeExitTo('refer.html')"><span class="nav-icon">🎁</span>Refer</div>
  <div class="nav-item" onclick="safeExitTo('profile.html')"><span class="nav-icon">👤</span>Profile</div>
</div>

<script>
  const DB_URL = "https://coin-play-7ac49-default-rtdb.firebaseio.com";
  const mobile = localStorage.getItem("activeUser");
  if (!mobile) window.location.replace("index.html");

  let userData = {};
  try {
    userData = JSON.parse(localStorage.getItem("cachedUser") || "{}");
  } catch (e) {}
  let winRateSetting = 35;

  function getTotalBal() {
    const dep = Number(userData.depositBal ?? userData.depositBalance ?? 0) || 0;
    const win = Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0;
    return dep + win;
  }

  function updateHeaderBal() {
    document.getElementById("balDisplay").innerText = getTotalBal().toFixed(2);
  }
  updateHeaderBal();

  async function syncUser() {
    try {
      const [uRes, rRes] = await Promise.all([
        fetch(`${DB_URL}/users/${mobile}.json?t=${Date.now()}`),
        fetch(`${DB_URL}/settings/rates/car.json?t=${Date.now()}`)
      ]);
      const u = await uRes.json();
      const r = await rRes.json();
      if (u && typeof u === "object") {
        userData = { ...userData, ...u };
        localStorage.setItem("cachedUser", JSON.stringify(userData));
        updateHeaderBal();
      }
      if (typeof r === "number") winRateSetting = r;
    } catch (e) {}
  }
  syncUser();

  // ==========================================
  // WEB AUDIO 3D CAR ROULETTE SOUNDS
  // ==========================================
  let soundOn = true;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById("sndBtn").innerText = soundOn ? "🔊" : "🔇";
  }

  function playCarSound(type) {
    if (!soundOn) return;
    try {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === "chip") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.05);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (type === "tick") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(520, now);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } else if (type === "win") {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now + idx * 0.07);
          gain.gain.setValueAtTime(0.24, now + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.07 + 0.28);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.07);
          osc.stop(now + idx * 0.07 + 0.28);
        });
      }
    } catch (e) {}
  }
   // ==========================================
  // 8 LUXURY CAR BRANDS & BETTING SLOTS
  // ==========================================
  const CARS = [
    { id: 0, name: "FERRARI",  emoji: "🏎️", mult: 40, vip: true,  color: "#ef4444" },
    { id: 1, name: "LAMBO",    emoji: "🚀", mult: 25, vip: true,  color: "#f59e0b" },
    { id: 2, name: "PORSCHE",  emoji: "🏁", mult: 15, vip: true,  color: "#a855f7" },
    { id: 3, name: "BUGATTI",  emoji: "⚡", mult: 10, vip: true,  color: "#3b82f6" },
    { id: 4, name: "BMW",      emoji: "🚙", mult: 5,  vip: false, color: "#0ea5e9" },
    { id: 5, name: "MERCEDES", emoji: "🚘", mult: 5,  vip: false, color: "#10b981" },
    { id: 6, name: "AUDI",     emoji: "🚗", mult: 5,  vip: false, color: "#f97316" },
    { id: 7, name: "JAGUAR",   emoji: "🚕", mult: 5,  vip: false, color: "#eab308" }
  ];

  let selectedChip = 10;
  let myBets = {}; // { carId: amount }
  let recentCars = [4, 6, 2, 5, 7, 4, 1, 6];
  let highlightedCarIdx = 0;
  let winningCarIdx = -1;

  function renderHistory() {
    document.getElementById("histStrip").innerHTML = recentCars.slice(0, 12).map(id => {
      const c = CARS[id] || CARS[4];
      return `<span class="h-badge ${c.vip ? 'super' : ''}">${c.emoji} ${c.mult}x</span>`;
    }).join("");
  }
  renderHistory();

  function renderCarsGrid() {
    document.getElementById("carsGrid").innerHTML = CARS.map(c => {
      const betVal = myBets[c.id] || 0;
      const isWin = winningCarIdx === c.id;
      return `
        <div class="car-card ${c.vip ? 'vip' : ''} ${isWin ? 'winner-glow' : ''}" onclick="placeCarBet(${c.id})">
          <span class="car-mult">${c.mult}x</span>
          <span class="car-emoji">${c.emoji}</span>
          <span class="car-name">${c.name}</span>
          <div class="my-bet-pill ${betVal > 0 ? 'show' : ''}">₹${betVal}</div>
        </div>
      `;
    }).join("");
  }
  renderCarsGrid();

  function selectChip(amt, el) {
    initAudio();
    playCarSound("chip");
    selectedChip = amt;
    document.querySelectorAll(".chip-btn").forEach(b => b.classList.remove("active"));
    el.classList.add("active");
  }

  async function placeCarBet(carId) {
    initAudio();
    if (roundPhase !== "BETTING") {
      return alert("Bets closed! Car spin ho rahi hai, agle round mein lagayein.");
    }
    if (selectedChip > getTotalBal()) {
      return alert("Wallet mein itna balance nahi hai!");
    }

    playCarSound("chip");

    let dBal = Number(userData.depositBal ?? userData.depositBalance ?? 0) || 0;
    let wBal = Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0;
    if (dBal >= selectedChip) {
      dBal -= selectedChip;
    } else {
      const rem = selectedChip - dBal;
      dBal = 0;
      wBal -= rem;
    }

    myBets[carId] = (myBets[carId] || 0) + selectedChip;

    const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
    txns.unshift({
      type: `Car Roulette (${CARS[carId].name})`,
      amt: "-₹" + selectedChip,
      date: new Date().toLocaleString()
    });

    userData.depositBal = dBal;
    userData.winningBal = wBal;
    userData.txns = txns.slice(0, 30);
    localStorage.setItem("cachedUser", JSON.stringify(userData));
    updateHeaderBal();
    renderCarsGrid();

    fetch(`${DB_URL}/users/${mobile}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ depositBal: dBal, winningBal: wBal, txns: userData.txns })
    });
  }

  // ==========================================
  // 3D ELLIPTICAL RACE TRACK CANVAS
  // ==========================================
  const canvas = document.getElementById("carTrackCanvas");
  const ctx = canvas.getContext("2d");

  function draw3DRouletteTrack() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2 + 4;
    const rx = 165;
    const ry = 76;

    // Outer 3D Track Ring
    ctx.save();
    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 34;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = "#fbbf24";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx + 17, ry + 17, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx - 17, ry - 17, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Draw 8 Car Nodes around 3D Track
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2 - Math.PI / 2;
      const x = cx + Math.cos(angle) * rx;
      const y = cy + Math.sin(angle) * ry;
      const isSelected = (highlightedCarIdx === i);
      const car = CARS[i];

      if (isSelected) {
        const glow = ctx.createRadialGradient(x, y, 4, x, y, 28);
        glow.addColorStop(0, "rgba(255, 215, 0, 0.95)");
        glow.addColorStop(1, "rgba(255, 215, 0, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, 28, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = isSelected ? "#ffd700" : "#0f172a";
      ctx.beginPath();
      ctx.arc(x, y, isSelected ? 21 : 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = isSelected ? "#ffffff" : car.color;
      ctx.lineWidth = isSelected ? 3 : 2;
      ctx.stroke();

      ctx.font = isSelected ? "20px Segoe UI" : "17px Segoe UI";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(car.emoji, x, y + 1);
    }

    ctx.restore();
    requestAnimationFrame(draw3DRouletteTrack);
  }
  requestAnimationFrame(draw3DRouletteTrack);

  // ==========================================
  // SYNCHRONIZED 25-SECOND ROULETTE CLOCK
  // ==========================================
  const ROUND_SEC = 25;
  const BET_SEC = 15;
  const SPIN_SEC = 6;
  let roundPhase = "BETTING";
  let lastRoundIdx = -1;
  let settledRoundIdx = -1;
  let lastTickStep = -1;

  function chooseWinningCar(rIdx) {
    const x = Math.sin(rIdx * 7919) * 10000;
    const frac = x - Math.floor(x);
    let defaultPick = frac < 0.78 ? (4 + Math.floor((frac / 0.78) * 4)) : Math.floor(((frac - 0.78) / 0.22) * 4);

    // Apply Admin car winRateSetting if user has active bets
    const betKeys = Object.keys(myBets).map(Number);
    if (betKeys.length > 0 && (Math.random() * 100) > winRateSetting) {
      const unbetCars = [4, 5, 6, 7, 3, 2, 1, 0].filter(id => !betKeys.includes(id));
      if (unbetCars.length > 0) return unbetCars[0];
    }
    return defaultPick;
  }

  async function settleCarRound(rIdx, winId) {
    if (settledRoundIdx === rIdx) return;
    settledRoundIdx = rIdx;
    winningCarIdx = winId;
    highlightedCarIdx = winId;

    recentCars.unshift(winId);
    recentCars = recentCars.slice(0, 14);
    renderHistory();
    renderCarsGrid();

    const winCar = CARS[winId];
    const betOnWin = myBets[winId] || 0;

    if (betOnWin > 0) {
      const winAmt = betOnWin * winCar.mult;
      playCarSound("win");

      const newWinBal = (Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0) + winAmt;
      const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
      txns.unshift({
        type: `Car Roulette Win (${winCar.name} ${winCar.mult}x)`,
        amt: "+₹" + winAmt,
        date: new Date().toLocaleString()
      });

      userData.winningBal = newWinBal;
      userData.txns = txns.slice(0, 30);
      localStorage.setItem("cachedUser", JSON.stringify(userData));
      updateHeaderBal();

      const maskedMe = mobile.slice(0, 1) + "***" + mobile.slice(-1);
      liveFeedData.unshift({
        name: maskedMe + " (You)",
        car: `${winCar.emoji} ${winCar.name}`,
        mult: winCar.mult + "x",
        win: winAmt,
        isMe: true
      });
      renderFeed();

      fetch(`${DB_URL}/users/${mobile}.json`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ winningBal: newWinBal, txns: userData.txns })
      });

      fetch(`${DB_URL}/carLiveFeed/${mobile}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: maskedMe, car: `${winCar.emoji} ${winCar.name}`, mult: winCar.mult + "x", win: winAmt, ts: Date.now() })
      });
    }
  }

  let currentRoundWinner = 4;
  function tickCarClock() {
    const nowSec = Math.floor(Date.now() / 1000);
    const rIdx = Math.floor(nowSec / ROUND_SEC);
    const elapsed = nowSec % ROUND_SEC;

    if (lastRoundIdx !== rIdx) {
      lastRoundIdx = rIdx;
      myBets = {};
      winningCarIdx = -1;
      currentRoundWinner = chooseWinningCar(rIdx);
      renderCarsGrid();
    }

    if (elapsed < BET_SEC) {
      roundPhase = "BETTING";
      const rem = BET_SEC - elapsed;
      document.getElementById("phaseTag").innerText = "PLACE YOUR BETS";
      document.getElementById("phaseTag").style.color = "#38bdf8";
      document.getElementById("timerNum").innerText = rem + "s";
      document.getElementById("timerNum").style.color = rem <= 4 ? "#ef4444" : "#fff";
    } else if (elapsed < BET_SEC + SPIN_SEC) {
      roundPhase = "SPINNING";
      if (settledRoundIdx !== rIdx && Object.keys(myBets).length > 0) {
        currentRoundWinner = chooseWinningCar(rIdx);
      }
      const spinElapsed = (Date.now() / 1000) % ROUND_SEC - BET_SEC;
      const totalSteps = 24 + currentRoundWinner;
      const easeProg = 1 - Math.pow(1 - Math.min(1, spinElapsed / SPIN_SEC), 2.4);
      const stepNow = Math.floor(easeProg * totalSteps);
      highlightedCarIdx = stepNow % 8;

      if (lastTickStep !== stepNow) {
        lastTickStep = stepNow;
        playCarSound("tick");
      }

      document.getElementById("phaseTag").innerText = "RACING...";
      document.getElementById("phaseTag").style.color = "#ffbe0b";
      document.getElementById("timerNum").innerText = CARS[highlightedCarIdx].emoji;
    } else {
      roundPhase = "RESULT";
      settleCarRound(rIdx, currentRoundWinner);
      const winCar = CARS[currentRoundWinner];
      document.getElementById("phaseTag").innerText = `${winCar.name} (${winCar.mult}x)`;
      document.getElementById("phaseTag").style.color = "#28e04d";
      document.getElementById("timerNum").innerText = winCar.emoji;
    }
  }

  // Hybrid Live Feed
  const BOTS = ["r***5", "k***2", "a***8", "s***4", "v***7", "m***1", "p***9", "d***3", "n***6", "t***0"];
  let liveFeedData = [
    { name: "r***5", car: "🏎️ FERRARI", mult: "40x", win: 4000, isMe: false },
    { name: "k***2", car: "🚙 BMW", mult: "5x", win: 1000, isMe: false },
    { name: "a***8", car: "🏁 PORSCHE", mult: "15x", win: 1500, isMe: false },
    { name: "s***4", car: "🚘 MERCEDES", mult: "5x", win: 500, isMe: false },
    { name: "v***7", car: "🚀 LAMBO", mult: "25x", win: 2500, isMe: false }
  ];

  function renderFeed() {
    document.getElementById("liveFeedList").innerHTML = liveFeedData.slice(0, 10).map(item => `
      <div class="feed-row win ${item.isMe ? 'me' : ''}">
        <div style="font-weight:bold; color:#e2e8f0;">${item.name}</div>
        <div style="color:#ffbe0b; font-weight:bold;">${item.car}</div>
        <div style="color:#38bdf8; font-weight:bold;">${item.mult}</div>
        <div style="text-align:right; font-weight:bold; color:#28e04d;">+₹${item.win}</div>
      </div>
    `).join("");
  }
  renderFeed();

  setInterval(async () => {
    const bName = BOTS[Math.floor(Math.random() * BOTS.length)];
    const bCar = CARS[Math.floor(Math.random() * CARS.length)];
    const bAmt = [50, 100, 200, 500][Math.floor(Math.random() * 4)];
    liveFeedData.unshift({ name: bName, car: `${bCar.emoji} ${bCar.name}`, mult: bCar.mult + "x", win: bAmt * bCar.mult, isMe: false });
    document.getElementById("onlineCount").innerText = "● " + (240 + Math.floor(Math.random() * 55)) + " Racing";

    try {
      const res = await fetch(`${DB_URL}/carLiveFeed.json?t=${Date.now()}`);
      const real = await res.json();
      if (real) {
        Object.keys(real).forEach(k => {
          const r = real[k];
          if (r && (Date.now() - r.ts) < 25000 && k !== mobile) {
            liveFeedData.unshift({ name: r.name, car: r.car, mult: r.mult, win: r.win, isMe: false });
          }
        });
      }
    } catch (e) {}
    renderFeed();
  }, 4500);

  // ==========================================
  // SAFE EXIT & BACK BUTTON CONFIRMATION
  // ==========================================
  function hasRunningBet() {
    return Object.values(myBets).some(v => v > 0);
  }

  function safeExitTo(url) {
    const msg = hasRunningBet()
      ? "⚠️ Aapki Car Roulette par bet lagi hui hai! Agar aap back jayenge toh aapki bet cancel/loss ho jayegi.\n\nKya aap sach mein bahar nikalna chahte hain?"
      : "Kya aap Car Roulette game se bahar nikalna chahte hain?";
    if (confirm(msg)) {
      window.location.href = url;
    }
  }

  history.pushState(null, "", location.href);
  window.addEventListener("popstate", function () {
    const msg = hasRunningBet()
      ? "⚠️ Aapki Car Roulette par bet lagi hui hai! Back jaane par aapki bet cancel/loss ho jayegi.\n\nKya aap sach mein back jaana chahte hain?"
      : "Kya aap Car Roulette game se bahar nikalna chahte hain?";
    if (confirm(msg)) {
      window.location.href = "game.html";
    } else {
      history.pushState(null, "", location.href);
    }
  });

  window.addEventListener("beforeunload", function (e) {
    if (hasRunningBet()) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  tickCarClock();
  setInterval(tickCarClock, 80);
</script>
</body>
</html>
