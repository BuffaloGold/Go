<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken Road - Buffalo Gold</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { background: #0e1015; color: #fff; display: flex; justify-content: center; padding-bottom: 75px; }
  .app { width: 100%; max-width: 440px; background: #141720; min-height: 100vh; padding: 10px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; background: #1c202b; border-radius: 12px; margin-bottom: 10px; border: 1px solid #2b3142; }
  .logo-title { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px; color: #ffbe0b; letter-spacing: 0.5px; }
  .bal-pill { background: #262b38; border: 1px solid #3c4459; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #28e04d; cursor: pointer; }

  /* Highway Road Arena */
  .road-arena {
    position: relative;
    width: 100%;
    height: 235px;
    background: linear-gradient(180deg, #1b1f29 0%, #242936 100%);
    border-radius: 16px;
    border: 2px solid #2f3646;
    overflow: hidden;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
  }
  .road-sky {
    height: 36px;
    background: #13161f;
    border-bottom: 2px solid #384052;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 12px;
    font-size: 11px;
    color: #9ca3af;
  }
  .lanes-viewport {
    flex: 1;
    display: flex;
    overflow-x: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
    position: relative;
  }
  .lanes-viewport::-webkit-scrollbar { display: none; }

  /* Safe Start Curb */
  .start-zone {
    min-width: 78px;
    background: repeating-linear-gradient(45deg, #272c38, #272c38 10px, #1f232e 10px, #1f232e 20px);
    border-right: 3px dashed #fbbf24;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .start-tag { font-size: 10px; font-weight: 800; color: #fbbf24; position: absolute; top: 8px; }

  /* Individual Road Lane */
  .lane {
    min-width: 86px;
    height: 100%;
    background: #232834;
    border-right: 2px dashed rgba(255, 255, 255, 0.22);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 12px 4px 16px;
    position: relative;
    transition: background 0.25s;
  }
  .lane.passed { background: rgba(40, 224, 77, 0.12); }
  .lane.current { background: rgba(255, 190, 11, 0.16); box-shadow: inset 0 0 18px rgba(255, 190, 11, 0.25); }
  .lane.burned { background: rgba(239, 68, 68, 0.25); }

  /* Golden Manhole Multiplier Coin */
  .manhole {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #3a4152, #1c2029);
    border: 3px solid #4b5563;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 13px;
    color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    z-index: 2;
  }
  .lane.next-target .manhole {
    border-color: #fbbf24;
    background: radial-gradient(circle at 30% 30%, #4d3e14, #261e08);
    color: #fde047;
    animation: pulseCoin 1.1s infinite;
  }
  .lane.passed .manhole {
    border-color: #28e04d;
    background: #14532d;
    color: #86efac;
  }
  .lane.burned .manhole {
    border-color: #ef4444;
    background: #7f1d1d;
    color: #fca5a5;
  }
  @keyframes pulseCoin {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }

  /* Golden Finish Trophy Lane */
  .finish-zone {
    min-width: 92px;
    background: linear-gradient(180deg, #422006, #713f12);
    border-left: 3px solid #ffd700;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  /* Chicken Character */
  .chicken-sprite {
    font-size: 38px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 5;
  }
  .chicken-hop { transform: translateY(-12px) scale(1.12); }

  /* Traffic Car Animation */
  .car-hazard {
    position: absolute;
    top: -45px;
    font-size: 32px;
    z-index: 4;
    transition: top 0.35s ease-in;
  }

  /* Status Banner */
  .game-banner {
    background: #1c202b;
    border: 1px solid #2f3646;
    border-radius: 10px;
    padding: 7px 12px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    color: #fde047;
    margin-bottom: 10px;
  }

  /* Control Deck */
  .deck { background: #1c202b; border: 1px solid #2b3142; border-radius: 16px; padding: 12px; margin-bottom: 10px; }
  .diff-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .diff-btn {
    background: #13161f; border: 1px solid #2f3646; color: #9ca3af;
    padding: 7px 2px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer;
  }
  .diff-btn.active { background: #2b3244; color: #fff; border-color: #fbbf24; }
  .diff-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .bet-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .stepper { flex: 1; display: flex; align-items: center; justify-content: space-between; background: #12151c; border: 1px solid #2f3646; border-radius: 12px; padding: 6px 10px; }
  .step-btn { width: 26px; height: 26px; border-radius: 8px; border: 1px solid #3f475c; background: #222734; color: #fff; font-weight: bold; cursor: pointer; }
  .bet-inp { background: transparent; border: none; color: #fff; font-size: 16px; font-weight: 800; width: 75px; text-align: center; outline: none; }
  .quick-chips { display: flex; gap: 5px; }
  .q-chip { background: #252b3a; border: none; color: #cbd5e1; padding: 8px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; }

  .action-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .action-grid.dual { grid-template-columns: 1fr 1.2fr; }
  .btn-play {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: linear-gradient(180deg, #28e04d, #159932);
    color: #fff; font-size: 16px; font-weight: 900; cursor: pointer;
    box-shadow: 0 4px 0 #0c5e1d; text-transform: uppercase;
  }
  .btn-go {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: linear-gradient(180deg, #38bdf8, #0284c7);
    color: #fff; font-size: 15px; font-weight: 900; cursor: pointer;
    box-shadow: 0 4px 0 #075985;
  }
  .btn-cash {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: linear-gradient(180deg, #fbbf24, #d97706);
    color: #000; font-size: 15px; font-weight: 900; cursor: pointer;
    box-shadow: 0 4px 0 #92400e;
  }

  /* Live Feed */
  .feed-box { background: #1c202b; border: 1px solid #2b3142; border-radius: 14px; padding: 10px; }
  .feed-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #cbd5e1; padding-bottom: 8px; border-bottom: 1px solid #2b3142; margin-bottom: 6px; }
  .feed-row {
    display: grid; grid-template-columns: 1.2fr 0.9fr 0.8fr 1.1fr; align-items: center;
    background: #141720; padding: 7px 8px; border-radius: 8px; margin-bottom: 4px; font-size: 11px;
  }
  .feed-row.win { background: rgba(40, 224, 77, 0.12); border: 1px solid rgba(40, 224, 77, 0.35); }
  .feed-row.me { border-color: #fbbf24; }
  .x-pill { background: #262c3a; color: #fbbf24; padding: 2px 6px; border-radius: 6px; font-weight: bold; width: fit-content; }

  /* Bottom Navigation */
  .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 440px; background: #1c202b; border-top: 1px solid #2b3142; display: flex; justify-content: space-around; padding: 9px 0; z-index: 999; }
  .nav-item { text-align: center; color: #888; font-size: 11px; cursor: pointer; }
  .nav-item.active { color: #ffd700; font-weight: bold; }
  .nav-icon { font-size: 19px; display: block; }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo-title">
      <span onclick="location.href='game.html'" style="cursor:pointer; color:#9ca3af; font-size:16px;">⬅</span>
      <span>🐔 CHICKEN ROAD</span>
    </div>
    <div class="bal-pill" onclick="location.href='wallet.html'">₹<span id="balDisplay">0.00</span></div>
  </div>

  <!-- Road Arena -->
  <div class="road-arena">
    <div class="road-sky">
      <span>⚡ Provably Fair Road</span>
      <span id="modeBadge" style="color:#fbbf24; font-weight:bold;">MODE: EASY</span>
    </div>
    <div class="lanes-viewport" id="lanesViewport"></div>
  </div>

  <!-- Status Banner -->
  <div class="game-banner" id="statusBanner">Difficulty chunein, Bet lagayein aur PLAY dabayein!</div>

  <!-- Control Deck -->
  <div class="deck">
    <div class="diff-row">
      <button type="button" class="diff-btn active" onclick="setDifficulty('easy', this)">Easy</button>
      <button type="button" class="diff-btn" onclick="setDifficulty('medium', this)">Medium</button>
      <button type="button" class="diff-btn" onclick="setDifficulty('hard', this)">Hard</button>
      <button type="button" class="diff-btn" onclick="setDifficulty('hardcore', this)">Hardcore</button>
    </div>

    <div class="bet-row" id="betControlsRow">
      <div class="stepper">
        <button type="button" class="step-btn" onclick="adjBet(-10)">-</button>
        <input type="number" class="bet-inp" id="betInp" value="20">
        <button type="button" class="step-btn" onclick="adjBet(10)">+</button>
      </div>
      <div class="quick-chips">
        <button type="button" class="q-chip" onclick="setBet(50)">50</button>
        <button type="button" class="q-chip" onclick="setBet(100)">100</button>
        <button type="button" class="q-chip" onclick="setBet(500)">500</button>
      </div>
    </div>

    <!-- Start Button -->
    <div class="action-grid" id="startBtnWrap">
      <button type="button" class="btn-play" onclick="startChickenRun()">PLAY</button>
    </div>

    <!-- Active Step / Cashout Buttons -->
    <div class="action-grid dual" id="activeBtnsWrap" style="display:none;">
      <button type="button" class="btn-cash" id="cashBtn" onclick="cashOutChicken()">CASH OUT ₹0</button>
      <button type="button" class="btn-go" onclick="stepChickenForward()">GO NEXT 🐾</button>
    </div>
  </div>

  <!-- Live Feed (Bots + Real Players) -->
  <div class="feed-box">
    <div class="feed-head">
      <span>🔥 LIVE ROAD WINNERS</span>
      <span style="color:#28e04d; font-weight:bold;" id="onlineTxt">● 184 Playing</span>
    </div>
    <div id="liveFeedList"></div>
  </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="location.href='game.html'"><span class="nav-icon">🎰</span>Game</div>
  <div class="nav-item" onclick="location.href='wallet.html'"><span class="nav-icon">💰</span>Wallet</div>
  <div class="nav-item" onclick="location.href='refer.html'"><span class="nav-icon">🎁</span>Refer</div>
  <div class="nav-item" onclick="location.href='profile.html'"><span class="nav-icon">👤</span>Profile</div>
</div>

<script>
  const DB_URL = "https://coin-play-7ac49-default-rtdb.firebaseio.com";
  const mobile = localStorage.getItem("activeUser");
  if (!mobile) window.location.replace("index.html");

  let userData = JSON.parse(localStorage.getItem("cachedUser") || "{}");
  let winRateSetting = 35;

  function getTotalBal() {
    return Number(userData.depositBal ?? userData.depositBalance ?? 0) + Number(userData.winningBal ?? userData.winningBalance ?? 0);
  }
  function updateHeaderBal() {
    document.getElementById("balDisplay").innerText = getTotalBal().toFixed(2);
  }
  updateHeaderBal();

  async function syncUser() {
    try {
      const [uRes, rRes] = await Promise.all([
        fetch(`${DB_URL}/users/${mobile}.json?t=${Date.now()}`),
        fetch(`${DB_URL}/settings/winRate.json?t=${Date.now()}`)
      ]);
      const u = await uRes.json();
      const r = await rRes.json();
      if (u && u.name) {
        userData = u;
        localStorage.setItem("cachedUser", JSON.stringify(u));
        updateHeaderBal();
      }
      if (typeof r === "number") winRateSetting = r;
    } catch (e) {}
  }
  syncUser();

  // Difficulty Multipliers & Risk Config
  const MODES = {
    easy: {
      label: "EASY",
      baseFail: 0.14,
      mults: [1.05, 1.18, 1.32, 1.48, 1.66, 1.88, 2.15, 2.48, 2.90, 3.45, 4.15, 5.00]
    },
    medium: {
      label: "MEDIUM",
      baseFail: 0.24,
      mults: [1.18, 1.45, 1.80, 2.25, 2.85, 3.60, 4.60, 5.90, 7.60, 10.00]
    },
    hard: {
      label: "HARD",
      baseFail: 0.36,
      mults: [1.35, 1.90, 2.75, 4.00, 5.90, 8.80, 13.50, 21.00]
    },
    hardcore: {
      label: "HARDCORE",
      baseFail: 0.50,
      mults: [1.65, 2.80, 4.90, 8.80, 16.50, 32.00]
    }
  };

  let currentMode = "easy";
  let isGameActive = false;
  let currentStep = 0; // 0 = start curb, 1..N = road lanes
  let currentBet = 0;
  let burnedLane = -1;

  function setDifficulty(mode, btn) {
    if (isGameActive) return;
    currentMode = mode;
    document.querySelectorAll(".diff-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("modeBadge").innerText = "MODE: " + MODES[mode].label;
    burnedLane = -1;
    currentStep = 0;
    renderRoad();
  }

  function adjBet(delta) {
    if (isGameActive) return;
    const inp = document.getElementById("betInp");
    inp.value = Math.max(10, (parseInt(inp.value) || 10) + delta);
  }
  function setBet(val) {
    if (isGameActive) return;
    document.getElementById("betInp").value = val;
  }

  function renderRoad() {
    const vp = document.getElementById("lanesViewport");
    const mults = MODES[currentMode].mults;

    let html = `
      <div class="start-zone">
        <span class="start-tag">SAFE</span>
        ${currentStep === 0 ? `<div class="chicken-sprite" id="chickSprite">🐔</div>` : `<div style="font-size:11px; color:#888;">START</div>`}
      </div>
    `;

    mults.forEach((m, idx) => {
      const stepNum = idx + 1;
      let cls = "lane";
      if (burnedLane === stepNum) cls += " burned";
      else if (stepNum < currentStep) cls += " passed";
      else if (stepNum === currentStep) cls += " current";
      else if (isGameActive && stepNum === currentStep + 1) cls += " next-target";

      const isHere = (currentStep === stepNum && burnedLane !== stepNum);
      const isCrashHere = (burnedLane === stepNum);

      html += `
        <div class="${cls}" id="lane_${stepNum}">
          ${isCrashHere ? `<div class="car-hazard" style="top:18px;">🚘</div>` : `<div style="font-size:10px; color:#6b7280;">LANE ${stepNum}</div>`}
          <div class="manhole">${isCrashHere ? "💥" : m.toFixed(2) + "x"}</div>
          <div style="height:40px; display:flex; align-items:center; justify-content:center;">
            ${isHere ? `<div class="chicken-sprite" id="chickSprite">🐔</div>` : (isCrashHere ? `<div style="font-size:28px;">🍗</div>` : "")}
          </div>
        </div>
      `;
    });

    html += `
      <div class="finish-zone">
        <div style="font-size:32px;">🏆</div>
        <div style="font-size:11px; font-weight:bold; color:#ffd700;">MAX WIN</div>
      </div>
    `;

    vp.innerHTML = html;

    // Auto-scroll road to keep chicken centered
    if (currentStep > 1) {
      const targetScroll = (currentStep - 1) * 86;
      vp.scrollLeft = targetScroll;
    } else {
      vp.scrollLeft = 0;
    }
  }
  renderRoad();

  async function startChickenRun() {
    const bet = parseInt(document.getElementById("betInp").value);
    if (!bet || bet < 10) return alert("Minimum bet ₹10 hai!");
    if (bet > getTotalBal()) return alert("Aapke wallet mein itna balance nahi hai!");

    // Deduct balance (Deposit first, then Winning)
    let dBal = Number(userData.depositBal ?? userData.depositBalance ?? 0);
    let wBal = Number(userData.winningBal ?? userData.winningBalance ?? 0);
    if (dBal >= bet) {
      dBal -= bet;
    } else {
      const rem = bet - dBal;
      dBal = 0;
      wBal -= rem;
    }

    const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
    txns.unshift({ type: `Chicken Road Bet (${MODES[currentMode].label})`, amt: "-₹" + bet, date: new Date().toLocaleString() });

    userData.depositBal = dBal;
    userData.winningBal = wBal;
    userData.txns = txns.slice(0, 30);
    localStorage.setItem("cachedUser", JSON.stringify(userData));
    updateHeaderBal();

    fetch(`${DB_URL}/users/${mobile}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ depositBal: dBal, winningBal: wBal, txns: userData.txns })
    });

    currentBet = bet;
    currentStep = 0;
    burnedLane = -1;
    isGameActive = true;

    document.querySelectorAll(".diff-btn").forEach(b => b.disabled = true);
    document.getElementById("startBtnWrap").style.display = "none";
    document.getElementById("activeBtnsWrap").style.display = "grid";
    document.getElementById("cashBtn").innerText = `CASH OUT ₹${bet}`;
    document.getElementById("statusBanner").innerText = "🐾 GO NEXT dabakar pehli lane cross karein!";
    renderRoad();
  }

  function stepChickenForward() {
    if (!isGameActive) return;
    const mults = MODES[currentMode].mults;
    const nextStep = currentStep + 1;
    if (nextStep > mults.length) return;

    // Adjust fail chance using Admin winRate setting
    const baseFail = MODES[currentMode].baseFail;
    const adminFactor = (100 - winRateSetting) / 65; // higher when winRate is low
    const failProb = Math.min(0.75, Math.max(0.08, baseFail * adminFactor));

    if (Math.random() < failProb) {
      // Hit by car!
      burnedLane = nextStep;
      currentStep = nextStep;
      isGameActive = false;
      renderRoad();

      document.getElementById("statusBanner").innerHTML = `<span style="color:#ff4d6d;">💥 CRASH! Car ne takkar maar di. Bet ₹${currentBet} lost!</span>`;
      resetDeckUI();
      return;
    }

    // Safe step!
    currentStep = nextStep;
    renderRoad();
    const sprite = document.getElementById("chickSprite");
    if (sprite) {
      sprite.classList.add("chicken-hop");
      setTimeout(() => sprite.classList.remove("chicken-hop"), 200);
    }

    const curMult = mults[currentStep - 1];
    const curWin = Math.floor(currentBet * curMult);
    document.getElementById("cashBtn").innerText = `CASH OUT ₹${curWin}`;
    document.getElementById("statusBanner").innerText = `🔥 Step ${currentStep} Clear! Current Win: ₹${curWin} (${curMult.toFixed(2)}x)`;

    // Auto-cashout if reached final golden trophy
    if (currentStep === mults.length) {
      cashOutChicken();
    }
  }

  async function cashOutChicken() {
    if (!isGameActive) return;
    if (currentStep === 0) return alert("Pehle kam se kam 1 lane cross karein!");

    const mults = MODES[currentMode].mults;
    const curMult = mults[currentStep - 1];
    const winAmt = Math.floor(currentBet * curMult);

    isGameActive = false;
    resetDeckUI();

    const newWinBal = Number(userData.winningBal ?? userData.winningBalance ?? 0) + winAmt;
    const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
    txns.unshift({
      type: `Chicken Road Win (${curMult.toFixed(2)}x)`,
      amt: "+₹" + winAmt,
      date: new Date().toLocaleString()
    });

    userData.winningBal = newWinBal;
    userData.txns = txns.slice(0, 30);
    localStorage.setItem("cachedUser", JSON.stringify(userData));
    updateHeaderBal();

    document.getElementById("statusBanner").innerHTML = `<span style="color:#28e04d;">🎉 CASHED OUT! Aapne ₹${winAmt} (${curMult.toFixed(2)}x) jeete!</span>`;

    // Add my win to live feed & broadcast to Firebase
    const maskedMe = mobile.slice(0, 1) + "***" + mobile.slice(-1);
    liveFeedData.unshift({
      name: maskedMe + " (You)",
      bet: currentBet,
      mult: curMult.toFixed(2) + "x",
      win: winAmt,
      isMe: true
    });
    renderFeed();

    fetch(`${DB_URL}/users/${mobile}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ winningBal: newWinBal, txns: userData.txns })
    });

    fetch(`${DB_URL}/chickenLiveFeed/${mobile}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: maskedMe,
        bet: currentBet,
        mult: curMult.toFixed(2) + "x",
        win: winAmt,
        ts: Date.now()
      })
    });
  }

  function resetDeckUI() {
    document.querySelectorAll(".diff-btn").forEach(b => b.disabled = false);
    document.getElementById("startBtnWrap").style.display = "grid";
    document.getElementById("activeBtnsWrap").style.display = "none";
  }

  // Hybrid Live Feed (Bots + Real Players)
  const BOTS = ["r***9", "s***2", "a***7", "m***4", "k***1", "v***8", "p***5", "d***3", "n***6", "t***0"];
  let liveFeedData = [
    { name: "r***9", bet: 500, mult: "2.48x", win: 1240, isMe: false },
    { name: "a***7", bet: 200, mult: "1.80x", win: 360, isMe: false },
    { name: "m***4", bet: 1000, mult: "3.60x", win: 3600, isMe: false },
    { name: "v***8", bet: 100, mult: "1.48x", win: 148, isMe: false },
    { name: "k***1", bet: 300, mult: "2.25x", win: 675, isMe: false }
  ];

  function renderFeed() {
    document.getElementById("liveFeedList").innerHTML = liveFeedData.slice(0, 10).map(item => `
      <div class="feed-row win ${item.isMe ? 'me' : ''}">
        <div style="font-weight:bold; color:#e2e8f0;">🐔 ${item.name}</div>
        <div style="color:#9ca3af;">₹${item.bet}</div>
        <div><span class="x-pill">${item.mult}</span></div>
        <div style="text-align:right; font-weight:bold; color:#28e04d;">+₹${item.win}</div>
      </div>
    `).join("");
  }
  renderFeed();

  // Periodic live bot & real player sync
  setInterval(async () => {
    const bName = BOTS[Math.floor(Math.random() * BOTS.length)];
    const bBet = [50, 100, 200, 500, 1000][Math.floor(Math.random() * 5)];
    const bMult = (1.18 + Math.random() * 3.5).toFixed(2);
    liveFeedData.unshift({
      name: bName,
      bet: bBet,
      mult: bMult + "x",
      win: Math.floor(bBet * Number(bMult)),
      isMe: false
    });
    document.getElementById("onlineTxt").innerText = "● " + (Math.floor(Math.random() * 45) + 160) + " Playing";

    try {
      const res = await fetch(`${DB_URL}/chickenLiveFeed.json?t=${Date.now()}`);
      const real = await res.json();
      if (real) {
        Object.keys(real).forEach(k => {
          const r = real[k];
          if (r && (Date.now() - r.ts) < 25000 && k !== mobile) {
            liveFeedData.unshift({ name: r.name, bet: r.bet, mult: r.mult, win: r.win, isMe: false });
          }
        });
      }
    } catch (e) {}

    renderFeed();
  }, 4500);
</script>
</body>
</html>
