<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Chicken Road - Buffalo Gold</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { background: #0c0e14; color: #fff; display: flex; justify-content: center; padding-bottom: 75px; }
  .app { width: 100%; max-width: 440px; background: #141722; min-height: 100vh; padding: 10px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #1e2230; border-radius: 12px; margin-bottom: 8px; border: 1px solid #2e3448; }
  .logo-title { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 16px; color: #ffbe0b; }
  .hdr-right { display: flex; align-items: center; gap: 8px; }
  .snd-btn { background: #292f42; border: 1px solid #404863; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .bal-pill { background: #292f42; border: 1px solid #404863; padding: 5px 11px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #28e04d; cursor: pointer; }

  /* Multiplier Step Ribbon */
  .mult-ribbon { display: flex; gap: 5px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
  .mult-ribbon::-webkit-scrollbar { display: none; }
  .m-step {
    padding: 4px 9px; border-radius: 10px; font-size: 11px; font-weight: 800;
    background: #1f2433; color: #8c96b0; border: 1px solid #2e354a; flex-shrink: 0;
  }
  .m-step.passed { background: rgba(40, 224, 77, 0.2); color: #28e04d; border-color: #28e04d; }
  .m-step.current { background: #ffbe0b; color: #000; border-color: #fff; transform: scale(1.06); }

  /* 3D Road Canvas */
  .road-arena {
    position: relative;
    width: 100%;
    height: 245px;
    border-radius: 16px;
    border: 2px solid #2e3448;
    overflow: hidden;
    background: linear-gradient(180deg, #1b2838 0%, #2a394a 100%);
    margin-bottom: 10px;
    box-shadow: inset 0 0 25px rgba(0,0,0,0.7);
  }
  canvas { width: 100%; height: 100%; display: block; }
  .hud-badge {
    position: absolute; top: 8px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  .lane-tag { background: rgba(0,0,0,0.7); border: 1px solid #444; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: #ffbe0b; }
  .win-tag { background: rgba(40, 224, 77, 0.22); border: 1px solid #28e04d; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 900; color: #28e04d; }

  /* Controls Card */
  .controls-card { background: #1e2230; border: 1px solid #2e3448; border-radius: 16px; padding: 11px; margin-bottom: 10px; }
  .diff-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .diff-btn {
    background: #141722; border: 1.5px solid #30374d; color: #aaa; padding: 7px 4px;
    border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center;
  }
  .diff-btn.active { background: #2c334a; color: #ffbe0b; border-color: #ffbe0b; }

  .bet-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .stepper { flex: 1; display: flex; align-items: center; justify-content: space-between; background: #141722; border: 1px solid #30374d; border-radius: 12px; padding: 6px 10px; }
  .step-btn { width: 26px; height: 26px; border-radius: 8px; border: 1px solid #4c5675; background: #242a3b; color: #fff; font-weight: bold; cursor: pointer; }
  .bet-inp { background: transparent; border: none; color: #fff; font-size: 16px; font-weight: 800; width: 70px; text-align: center; outline: none; }
  .quick-chips { display: flex; gap: 5px; }
  .q-chip { background: #272d3f; border: none; color: #ccc; padding: 8px 9px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; }

  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-main {
    padding: 13px 8px; border: none; border-radius: 12px; font-size: 14px; font-weight: 900;
    color: #fff; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 rgba(0,0,0,0.4);
  }
  .btn-main:active { transform: scale(0.97); }
  .btn-play { background: linear-gradient(180deg, #28e04d, #149630); grid-column: span 2; }
  .btn-go { background: linear-gradient(180deg, #3b82f6, #1d4ed8); }
  .btn-cash { background: linear-gradient(180deg, #ffbe0b, #e09600); color: #000; }

  /* Live Feed */
  .feed-box { background: #1e2230; border: 1px solid #2e3448; border-radius: 14px; padding: 10px; }
  .feed-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #ccc; padding-bottom: 7px; border-bottom: 1px solid #2e3448; margin-bottom: 6px; }
  .feed-row {
    display: grid; grid-template-columns: 1.2fr 0.9fr 0.8fr 1.1fr; align-items: center;
    background: #141722; padding: 6px 8px; border-radius: 8px; margin-bottom: 4px; font-size: 11px;
  }
  .feed-row.win { background: rgba(40, 224, 77, 0.12); border: 1px solid rgba(40, 224, 77, 0.35); }
  .feed-row.me { border-color: #ffbe0b; }

  /* Bottom Navigation */
  .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 440px; background: #1e2230; border-top: 1px solid #2e3448; display: flex; justify-content: space-around; padding: 9px 0; z-index: 999; }
  .nav-item { text-align: center; color: #888; font-size: 11px; cursor: pointer; }
  .nav-item.active { color: #ffd700; font-weight: bold; }
  .nav-icon { font-size: 19px; display: block; }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo-title">
      <span onclick="safeExitTo('game.html')" style="cursor:pointer; color:#aaa; font-size:16px;">⬅</span>
      <span>🐔 3D CHICKEN ROAD</span>
    </div>
    <div class="hdr-right">
      <button type="button" class="snd-btn" id="sndBtn" onclick="toggleSound()">🔊</button>
      <div class="bal-pill" onclick="safeExitTo('wallet.html')">₹<span id="balDisplay">0.00</span></div>
    </div>
  </div>

  <!-- Multiplier Steps Ribbon -->
  <div class="mult-ribbon" id="multRibbon"></div>

  <!-- 3D Highway Canvas Arena -->
  <div class="road-arena">
    <canvas id="roadCanvas" width="420" height="245"></canvas>
    <div class="hud-badge">
      <div class="lane-tag" id="laneHud">LANE: 0 / 8</div>
      <div class="win-tag" id="winHud">WIN: ₹0.00</div>
    </div>
  </div>

  <!-- Controls Deck -->
  <div class="controls-card">
    <div class="diff-row">
      <button type="button" class="diff-btn active" onclick="setDiff('easy', this)">🟢 EASY (1.25x+)</button>
      <button type="button" class="diff-btn" onclick="setDiff('med', this)">🟡 MEDIUM (1.55x+)</button>
      <button type="button" class="diff-btn" onclick="setDiff('hard', this)">🔴 HARD (2.10x+)</button>
    </div>

    <div class="bet-row">
      <div class="stepper">
        <button type="button" class="step-btn" onclick="adjBet(-10)">-</button>
        <input type="number" class="bet-inp" id="betInp" value="20">
        <button type="button" class="step-btn" onclick="adjBet(10)">+</button>
      </div>
      <div class="quick-chips">
        <button type="button" class="q-chip" onclick="setBet(50)">50</button>
        <button type="button" class="q-chip" onclick="setBet(100)">100</button>
        <button type="button" class="q-chip" onclick="setBet(500)">500</button>
      </div>
    </div>

    <div class="action-grid" id="actionGrid">
      <button type="button" class="btn-main btn-play" onclick="startChickenGame()">▶ START CROSSING</button>
    </div>
  </div>

  <!-- Live Hybrid Winners Feed -->
  <div class="feed-box">
    <div class="feed-head">
      <span>🔥 LIVE ROAD CROSSERS</span>
      <span style="color:#28e04d; font-weight:bold;" id="onlineCount">● 184 Playing</span>
    </div>
    <div id="liveFeedList"></div>
  </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="safeExitTo('game.html')"><span class="nav-icon">🎰</span>Game</div>
  <div class="nav-item" onclick="safeExitTo('wallet.html')"><span class="nav-icon">💰</span>Wallet</div>
  <div class="nav-item" onclick="safeExitTo('refer.html')"><span class="nav-icon">🎁</span>Refer</div>
  <div class="nav-item" onclick="safeExitTo('profile.html')"><span class="nav-icon">👤</span>Profile</div>
</div>

<script>
  const DB_URL = "https://coin-play-7ac49-default-rtdb.firebaseio.com";
  const mobile = localStorage.getItem("activeUser");
  if (!mobile) window.location.replace("index.html");

  let userData = {};
  try {
    userData = JSON.parse(localStorage.getItem("cachedUser") || "{}");
  } catch (e) {}
  let winRateSetting = 35;

  function getTotalBal() {
    const dep = Number(userData.depositBal ?? userData.depositBalance ?? 0) || 0;
    const win = Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0;
    return dep + win;
  }

  function updateHeaderBal() {
    document.getElementById("balDisplay").innerText = getTotalBal().toFixed(2);
  }
  updateHeaderBal();

  async function syncUser() {
    try {
      const [uRes, rRes] = await Promise.all([
        fetch(`${DB_URL}/users/${mobile}.json?t=${Date.now()}`),
        fetch(`${DB_URL}/settings/rates/chicken.json?t=${Date.now()}`)
      ]);
      const u = await uRes.json();
      const r = await rRes.json();
      if (u && typeof u === "object") {
        userData = { ...userData, ...u };
        localStorage.setItem("cachedUser", JSON.stringify(userData));
        updateHeaderBal();
      }
      if (typeof r === "number") winRateSetting = r;
    } catch (e) {}
  }
  syncUser();

  // ==========================================
  // WEB AUDIO 3D CHICKEN ROAD SOUNDS
  // ==========================================
  let soundOn = true;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById("sndBtn").innerText = soundOn ? "🔊" : "🔇";
  }

  function playChickenSound(type) {
    if (!soundOn) return;
    try {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === "hop") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(760, now + 0.11);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === "horn") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(210, now);
        osc.frequency.linearRampToValueAtTime(175, now + 0.35);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.38);
      } else if (type === "cashout") {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now + idx * 0.07);
          gain.gain.setValueAtTime(0.24, now + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.07 + 0.28);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.07);
          osc.stop(now + idx * 0.07 + 0.28);
        });
      }
    } catch (e) {}
  }
   // ==========================================
  // GAME CONFIG & MULTIPLIER LADDERS
  // ==========================================
  const LADDERS = {
    easy: [1.25, 1.55, 1.95, 2.45, 3.10, 4.00, 5.20, 7.00],
    med:  [1.55, 2.30, 3.40, 5.00, 7.50, 11.0, 16.5, 25.0],
    hard: [2.10, 4.20, 8.50, 17.0, 34.0, 68.0, 120.0, 200.0]
  };
  let difficulty = "easy";
  let isPlaying = false;
  let currentLane = 0;
  let activeBet = 0;
  let chickenX = 24;
  let targetChickenX = 24;
  let chickenHopPhase = 0;
  let crashLane = -1;
  let crashCarY = -80;

  function setDiff(mode, el) {
    if (isPlaying) return;
    difficulty = mode;
    document.querySelectorAll(".diff-btn").forEach(b => b.classList.remove("active"));
    el.classList.add("active");
    renderRibbon();
  }

  function renderRibbon() {
    const arr = LADDERS[difficulty];
    document.getElementById("multRibbon").innerHTML = arr.map((m, i) => {
      const stepNum = i + 1;
      let cls = "";
      if (isPlaying && stepNum < currentLane) cls = "passed";
      else if (isPlaying && stepNum === currentLane) cls = "current";
      return `<div class="m-step ${cls}">L${stepNum}: ${m.toFixed(2)}x</div>`;
    }).join("");
  }
  renderRibbon();

  function adjBet(delta) {
    if (isPlaying) return;
    const inp = document.getElementById("betInp");
    inp.value = Math.max(10, (parseInt(inp.value) || 10) + delta);
  }
  function setBet(val) {
    if (isPlaying) return;
    document.getElementById("betInp").value = val;
  }

  function getLaneCenterX(laneIdx) {
    if (laneIdx <= 0) return 24;
    if (laneIdx >= 9) return 396;
    return 48 + (laneIdx - 0.5) * 40.5;
  }

  async function startChickenGame() {
    initAudio();
    if (isPlaying) return;
    const bet = parseInt(document.getElementById("betInp").value);
    if (!bet || bet < 10) return alert("Minimum bet ₹10 hai!");
    if (bet > getTotalBal()) return alert("Wallet mein itna balance nahi hai!");

    let dBal = Number(userData.depositBal ?? userData.depositBalance ?? 0) || 0;
    let wBal = Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0;
    if (dBal >= bet) {
      dBal -= bet;
    } else {
      const rem = bet - dBal;
      dBal = 0;
      wBal -= rem;
    }

    const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
    txns.unshift({ type: "Chicken Road Bet", amt: "-₹" + bet, date: new Date().toLocaleString() });

    userData.depositBal = dBal;
    userData.winningBal = wBal;
    userData.txns = txns.slice(0, 30);
    localStorage.setItem("cachedUser", JSON.stringify(userData));
    updateHeaderBal();

    fetch(`${DB_URL}/users/${mobile}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ depositBal: dBal, winningBal: wBal, txns: userData.txns })
    });

    activeBet = bet;
    isPlaying = true;
    currentLane = 0;
    crashLane = -1;
    chickenX = getLaneCenterX(0);
    targetChickenX = chickenX;
    renderRibbon();
    updateHud();
    renderActionButtons();
  }

  function updateHud() {
    document.getElementById("laneHud").innerText = `LANE: ${currentLane} / 8`;
    const mult = currentLane > 0 ? LADDERS[difficulty][currentLane - 1] : 0;
    const winNow = activeBet * mult;
    document.getElementById("winHud").innerText = `WIN: ₹${winNow.toFixed(2)}`;
  }

  function renderActionButtons() {
    const grid = document.getElementById("actionGrid");
    if (!isPlaying) {
      grid.innerHTML = `<button type="button" class="btn-main btn-play" onclick="startChickenGame()">▶ START CROSSING</button>`;
      return;
    }
    const mult = currentLane > 0 ? LADDERS[difficulty][currentLane - 1] : 0;
    const winNow = (activeBet * mult).toFixed(2);
    const nextMult = LADDERS[difficulty][currentLane] || mult;

    grid.innerHTML = `
      <button type="button" class="btn-main btn-go" onclick="stepForward()">🐔 HOP (${nextMult.toFixed(2)}x)</button>
      <button type="button" class="btn-main btn-cash" ${currentLane === 0 ? "disabled style='opacity:0.45;'" : ""} onclick="cashoutChicken()">💰 CASH ₹${winNow}</button>
    `;
  }

  function stepForward() {
    if (!isPlaying || currentLane >= 8) return;
    initAudio();

    const nextLane = currentLane + 1;
    const diffPenalty = difficulty === "easy" ? 1.0 : (difficulty === "med" ? 0.82 : 0.65);
    const laneDecay = Math.pow(0.84, nextLane - 1);
    const surviveChance = Math.min(82, Math.max(12, winRateSetting * 1.45 * diffPenalty * laneDecay));

    const survived = (Math.random() * 100) < surviveChance;

    if (survived) {
      playChickenSound("hop");
      currentLane = nextLane;
      targetChickenX = getLaneCenterX(currentLane);
      chickenHopPhase = 1.0;
      renderRibbon();
      updateHud();
      renderActionButtons();

      if (currentLane === 8) {
        setTimeout(() => cashoutChicken(), 450);
      }
    } else {
      playChickenSound("horn");
      crashLane = nextLane;
      targetChickenX = getLaneCenterX(nextLane);
      chickenHopPhase = 1.0;
      crashCarY = -50;
      isPlaying = false;
      renderRibbon();
      renderActionButtons();
      document.getElementById("laneHud").innerText = `💥 HIT AT LANE ${nextLane}!`;
      document.getElementById("winHud").innerText = `LOST ₹${activeBet}`;
    }
  }

  async function cashoutChicken() {
    if (!isPlaying || currentLane === 0) return;
    initAudio();
    playChickenSound("cashout");

    const mult = LADDERS[difficulty][currentLane - 1];
    const winAmt = Number((activeBet * mult).toFixed(2));
    isPlaying = false;
    targetChickenX = getLaneCenterX(9);
    chickenHopPhase = 1.0;
    renderActionButtons();

    const newWinBal = Number(((Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0) + winAmt).toFixed(2));
    const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
    txns.unshift({
      type: `Chicken Road Win (${mult.toFixed(2)}x)`,
      amt: "+₹" + winAmt,
      date: new Date().toLocaleString()
    });

    userData.winningBal = newWinBal;
    userData.txns = txns.slice(0, 30);
    localStorage.setItem("cachedUser", JSON.stringify(userData));
    updateHeaderBal();

    const maskedMe = mobile.slice(0, 1) + "***" + mobile.slice(-1);
    liveFeedData.unshift({ name: maskedMe + " (You)", bet: activeBet, mult: mult.toFixed(2) + "x", win: winAmt, isMe: true });
    renderFeed();

    fetch(`${DB_URL}/users/${mobile}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ winningBal: newWinBal, txns: userData.txns })
    });

    fetch(`${DB_URL}/chickenLiveFeed/${mobile}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: maskedMe, bet: activeBet, mult: mult.toFixed(2) + "x", win: winAmt, ts: Date.now() })
    });
  }

  // ==========================================
  // 3D HIGHWAY & TRAFFIC ANIMATION CANVAS
  // ==========================================
  const canvas = document.getElementById("roadCanvas");
  const ctx = canvas.getContext("2d");

  const CAR_COLORS = ["#ef4444", "#3b82f6", "#f59e0b", "#a855f7", "#10b981", "#ec4899"];
  const trafficCars = [];
  for (let lane = 1; lane <= 8; lane++) {
    trafficCars.push({
      lane: lane,
      y: Math.random() * 240,
      speed: (lane % 2 === 0 ? 1 : -1) * (1.2 + (lane % 3) * 0.45),
      color: CAR_COLORS[lane % CAR_COLORS.length]
    });
  }

  function draw3DCar(x, y, color, dirDown) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.beginPath();
    ctx.roundRect(-12, -18, 26, 40, 6);
    ctx.fill();

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-13, -20, 26, 38, 6);
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.28)";
    ctx.beginPath();
    ctx.roundRect(-9, -11, 18, 20, 4);
    ctx.fill();

    ctx.fillStyle = "#fef08a";
    const lightY = dirDown ? 16 : -20;
    ctx.fillRect(-10, lightY, 5, 3);
    ctx.fillRect(5, lightY, 5, 3);
    ctx.restore();
  }

  function draw3DChicken(x, y, hopOffset, isCrushed) {
    ctx.save();
    ctx.translate(x, y - hopOffset);
    if (isCrushed) {
      ctx.scale(1.35, 0.55);
      ctx.font = "28px Segoe UI";
      ctx.textAlign = "center";
      ctx.fillText("💥", 0, 8);
      ctx.restore();
      return;
    }

    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.beginPath();
    ctx.ellipse(0, 14 + hopOffset, 12, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(0, 2, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(0, -10, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#f59e0b";
    ctx.beginPath();
    ctx.moveTo(10, -1);
    ctx.lineTo(17, 2);
    ctx.lineTo(10, 5);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(5, -3, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function animateRoad() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#15803d";
    ctx.fillRect(0, 0, 48, canvas.height);
    ctx.fillStyle = "#ca8a04";
    ctx.fillRect(372, 0, 48, canvas.height);

    ctx.fillStyle = "#262b38";
    ctx.fillRect(48, 0, 324, canvas.height);

    for (let i = 1; i <= 8; i++) {
      const lx = 48 + (i - 1) * 40.5;
      if (isPlaying && i === currentLane + 1) {
        ctx.fillStyle = "rgba(255, 190, 11, 0.14)";
        ctx.fillRect(lx, 0, 40.5, canvas.height);
      }
      ctx.strokeStyle = "rgba(255,255,255,0.22)";
      ctx.setLineDash([10, 10]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(lx, 0);
      ctx.lineTo(lx, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.font = "bold 9px Segoe UI";
      ctx.textAlign = "center";
      ctx.fillText(LADDERS[difficulty][i - 1].toFixed(2) + "x", lx + 20.2, 236);
    }

    trafficCars.forEach(car => {
      if (car.lane <= currentLane && isPlaying) return;
      if (car.lane === crashLane) return;

      car.y += car.speed;
      if (car.y > canvas.height + 30) car.y = -30;
      if (car.y < -30) car.y = canvas.height + 30;
      draw3DCar(getLaneCenterX(car.lane), car.y, car.color, car.speed > 0);
    });

    if (crashLane > 0) {
      if (crashCarY < 135) crashCarY += 14;
      draw3DCar(getLaneCenterX(crashLane), crashCarY, "#ef4444", true);
    }

    chickenX += (targetChickenX - chickenX) * 0.22;
    let hopY = 0;
    if (chickenHopPhase > 0) {
      hopY = Math.sin(chickenHopPhase * Math.PI) * 16;
      chickenHopPhase = Math.max(0, chickenHopPhase - 0.08);
    }
    draw3DChicken(chickenX, 132, hopY, crashLane > 0);

    requestAnimationFrame(animateRoad);
  }
  requestAnimationFrame(animateRoad);

  // Hybrid Live Winners Feed
  const BOTS = ["r***8", "k***3", "a***7", "s***1", "v***9", "m***4", "p***2", "d***5", "n***6", "t***0"];
  let liveFeedData = [
    { name: "r***8", bet: 200, mult: "2.45x", win: 490, isMe: false },
    { name: "k***3", bet: 100, mult: "3.10x", win: 310, isMe: false },
    { name: "a***7", bet: 500, mult: "1.95x", win: 975, isMe: false },
    { name: "s***1", bet: 50, mult: "5.20x", win: 260, isMe: false },
    { name: "v***9", bet: 300, mult: "1.55x", win: 465, isMe: false }
  ];

  function renderFeed() {
    document.getElementById("liveFeedList").innerHTML = liveFeedData.slice(0, 10).map(item => `
      <div class="feed-row win ${item.isMe ? 'me' : ''}">
        <div style="font-weight:bold; color:#ddd;">🐔 ${item.name}</div>
        <div style="color:#aaa;">₹${item.bet}</div>
        <div style="color:#ffbe0b; font-weight:bold;">${item.mult}</div>
        <div style="text-align:right; font-weight:bold; color:#28e04d;">+₹${item.win}</div>
      </div>
    `).join("");
  }
  renderFeed();

  setInterval(async () => {
    const bName = BOTS[Math.floor(Math.random() * BOTS.length)];
    const bBet = [50, 100, 200, 500][Math.floor(Math.random() * 4)];
    const bMult = [1.25, 1.55, 1.95, 2.45, 3.10][Math.floor(Math.random() * 5)];
    liveFeedData.unshift({ name: bName, bet: bBet, mult: bMult.toFixed(2) + "x", win: Math.floor(bBet * bMult), isMe: false });
    document.getElementById("onlineCount").innerText = "● " + (165 + Math.floor(Math.random() * 45)) + " Playing";

    try {
      const res = await fetch(`${DB_URL}/chickenLiveFeed.json?t=${Date.now()}`);
      const real = await res.json();
      if (real) {
        Object.keys(real).forEach(k => {
          const r = real[k];
          if (r && (Date.now() - r.ts) < 25000 && k !== mobile) {
            liveFeedData.unshift({ name: r.name, bet: r.bet, mult: r.mult, win: r.win, isMe: false });
          }
        });
      }
    } catch (e) {}
    renderFeed();
  }, 4500);

  // ==========================================
  // SAFE EXIT & BACK BUTTON CONFIRMATION
  // ==========================================
  function hasRunningBet() {
    return isPlaying;
  }

  function safeExitTo(url) {
    const msg = hasRunningBet()
      ? "⚠️ Aapka Chicken Road round abhi chal raha hai! Agar aap back jayenge toh aapki bet cancel/loss ho jayegi.\n\nKya aap sach mein bahar nikalna chahte hain?"
      : "Kya aap Chicken Road game se bahar nikalna chahte hain?";
    if (confirm(msg)) {
      window.location.href = url;
    }
  }

  history.pushState(null, "", location.href);
  window.addEventListener("popstate", function () {
    const msg = hasRunningBet()
      ? "⚠️ Aapka Chicken Road round abhi chal raha hai! Back jaane par aapki bet cancel/loss ho jayegi.\n\nKya aap sach mein back jaana chahte hain?"
      : "Kya aap Chicken Road game se bahar nikalna chahte hain?";
    if (confirm(msg)) {
      window.location.href = "game.html";
    } else {
      history.pushState(null, "", location.href);
    }
  });

  window.addEventListener("beforeunload", function (e) {
    if (hasRunningBet()) {
      e.preventDefault();
      e.returnValue = "";
    }
  });
</script>
</body>
</html>
