<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Chicken Road - Buffalo Gold</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { background: #090b10; color: #fff; display: flex; justify-content: center; padding-bottom: 75px; }
  .app { width: 100%; max-width: 440px; background: #11151f; min-height: 100vh; padding: 10px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #1a202e; border-radius: 12px; margin-bottom: 8px; border: 1px solid #2c354a; }
  .logo-title { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 16px; color: #ffbe0b; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .sound-btn { background: #262e42; border: 1px solid #3d4966; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .bal-pill { background: #232a3b; border: 1px solid #3c4863; padding: 5px 11px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #28e04d; cursor: pointer; }

  /* 3D Canvas Arena */
  .arena-3d {
    position: relative;
    width: 100%;
    height: 270px;
    border-radius: 16px;
    border: 2px solid #2e384d;
    overflow: hidden;
    background: #141923;
    margin-bottom: 8px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.75);
  }
  canvas { width: 100%; height: 100%; display: block; }
  .hud-top {
    position: absolute; top: 8px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  .hud-badge {
    background: rgba(15, 20, 32, 0.88); border: 1px solid #3b4661;
    padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: #fde047;
  }
  .hud-mult {
    background: rgba(40, 224, 77, 0.22); border: 1px solid #28e04d;
    padding: 3px 12px; border-radius: 12px; font-size: 13px; font-weight: 900; color: #4ade80;
  }

  /* Status Banner */
  .game-banner {
    background: #1a202e; border: 1px solid #2d364a; border-radius: 10px;
    padding: 7px 10px; text-align: center; font-size: 12px; font-weight: bold;
    color: #fde047; margin-bottom: 8px;
  }

  /* Control Deck */
  .deck { background: #1a202e; border: 1px solid #2c354a; border-radius: 16px; padding: 11px; margin-bottom: 10px; }
  .diff-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 9px; }
  .diff-btn {
    background: #11151f; border: 1px solid #2d364a; color: #9ca3af;
    padding: 7px 2px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer;
  }
  .diff-btn.active { background: #293247; color: #fff; border-color: #fbbf24; }
  .diff-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .bet-row { display: flex; gap: 8px; align-items: center; margin-bottom: 9px; }
  .stepper { flex: 1; display: flex; align-items: center; justify-content: space-between; background: #10141d; border: 1px solid #2d364a; border-radius: 12px; padding: 5px 10px; }
  .step-btn { width: 26px; height: 26px; border-radius: 8px; border: 1px solid #3f4a63; background: #22293a; color: #fff; font-weight: bold; cursor: pointer; }
  .bet-inp { background: transparent; border: none; color: #fff; font-size: 16px; font-weight: 800; width: 70px; text-align: center; outline: none; }
  .quick-chips { display: flex; gap: 5px; }
  .q-chip { background: #232a3b; border: none; color: #cbd5e1; padding: 8px 9px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; }

  .action-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .action-grid.dual { grid-template-columns: 1fr 1.25fr; }
  .btn-play {
    width: 100%; padding: 13px; border: none; border-radius: 12px;
    background: linear-gradient(180deg, #28e04d, #149630);
    color: #fff; font-size: 16px; font-weight: 900; cursor: pointer;
    box-shadow: 0 4px 0 #0b591b; text-transform: uppercase;
  }
  .btn-go {
    width: 100%; padding: 13px; border: none; border-radius: 12px;
    background: linear-gradient(180deg, #38bdf8, #0284c7);
    color: #fff; font-size: 15px; font-weight: 900; cursor: pointer;
    box-shadow: 0 4px 0 #075985;
  }
  .btn-cash {
    width: 100%; padding: 13px; border: none; border-radius: 12px;
    background: linear-gradient(180deg, #fbbf24, #d97706);
    color: #000; font-size: 14px; font-weight: 900; cursor: pointer;
    box-shadow: 0 4px 0 #92400e;
  }

  /* Live Feed */
  .feed-box { background: #1a202e; border: 1px solid #2c354a; border-radius: 14px; padding: 10px; }
  .feed-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #cbd5e1; padding-bottom: 7px; border-bottom: 1px solid #2c354a; margin-bottom: 6px; }
  .feed-row {
    display: grid; grid-template-columns: 1.2fr 0.9fr 0.8fr 1.1fr; align-items: center;
    background: #11151f; padding: 6px 8px; border-radius: 8px; margin-bottom: 4px; font-size: 11px;
  }
  .feed-row.win { background: rgba(40, 224, 77, 0.12); border: 1px solid rgba(40, 224, 77, 0.35); }
  .feed-row.me { border-color: #fbbf24; }
  .x-pill { background: #232a3b; color: #fbbf24; padding: 2px 6px; border-radius: 6px; font-weight: bold; width: fit-content; }

  /* Bottom Navigation */
  .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 440px; background: #1a202e; border-top: 1px solid #2c354a; display: flex; justify-content: space-around; padding: 9px 0; z-index: 999; }
  .nav-item { text-align: center; color: #888; font-size: 11px; cursor: pointer; }
  .nav-item.active { color: #ffd700; font-weight: bold; }
  .nav-icon { font-size: 19px; display: block; }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo-title">
      <span onclick="location.href='game.html'" style="cursor:pointer; color:#9ca3af; font-size:16px;">⬅</span>
      <span>🐔 CHICKEN ROAD 3D</span>
    </div>
    <div class="header-right">
      <button type="button" class="sound-btn" id="soundToggleBtn" onclick="toggleSound()">🔊</button>
      <div class="bal-pill" onclick="location.href='wallet.html'">₹<span id="balDisplay">0.00</span></div>
    </div>
  </div>

  <!-- 3D Highway Canvas Arena -->
  <div class="arena-3d">
    <canvas id="road3dCanvas" width="420" height="270"></canvas>
    <div class="hud-top">
      <div class="hud-badge" id="modeBadge">MODE: EASY</div>
      <div class="hud-mult" id="curMultBadge">1.00x</div>
    </div>
  </div>

  <!-- Status Banner -->
  <div class="game-banner" id="statusBanner">3D Highway cross karein! PLAY dabakar shuru karein.</div>

  <!-- Control Deck -->
  <div class="deck">
    <div class="diff-row">
      <button type="button" class="diff-btn active" onclick="setDifficulty('easy', this)">Easy</button>
      <button type="button" class="diff-btn" onclick="setDifficulty('medium', this)">Medium</button>
      <button type="button" class="diff-btn" onclick="setDifficulty('hard', this)">Hard</button>
      <button type="button" class="diff-btn" onclick="setDifficulty('hardcore', this)">Hardcore</button>
    </div>

    <div class="bet-row">
      <div class="stepper">
        <button type="button" class="step-btn" onclick="adjBet(-10)">-</button>
        <input type="number" class="bet-inp" id="betInp" value="20">
        <button type="button" class="step-btn" onclick="adjBet(10)">+</button>
      </div>
      <div class="quick-chips">
        <button type="button" class="q-chip" onclick="setBet(50)">50</button>
        <button type="button" class="q-chip" onclick="setBet(100)">100</button>
        <button type="button" class="q-chip" onclick="setBet(500)">500</button>
      </div>
    </div>

    <div class="action-grid" id="startBtnWrap">
      <button type="button" class="btn-play" onclick="startChickenRun()">PLAY 3D</button>
    </div>

    <div class="action-grid dual" id="activeBtnsWrap" style="display:none;">
      <button type="button" class="btn-cash" id="cashBtn" onclick="cashOutChicken()">CASH OUT ₹0</button>
      <button type="button" class="btn-go" onclick="stepChickenForward()">JUMP NEXT 🐾</button>
    </div>
  </div>

  <!-- Live Feed -->
  <div class="feed-box">
    <div class="feed-head">
      <span>🔥 LIVE 3D WINNERS</span>
      <span style="color:#28e04d; font-weight:bold;" id="onlineTxt">● 212 Playing</span>
    </div>
    <div id="liveFeedList"></div>
  </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="location.href='game.html'"><span class="nav-icon">🎰</span>Game</div>
  <div class="nav-item" onclick="location.href='wallet.html'"><span class="nav-icon">💰</span>Wallet</div>
  <div class="nav-item" onclick="location.href='refer.html'"><span class="nav-icon">🎁</span>Refer</div>
  <div class="nav-item" onclick="location.href='profile.html'"><span class="nav-icon">👤</span>Profile</div>
</div>

<script>
  const DB_URL = "https://coin-play-7ac49-default-rtdb.firebaseio.com";
  const mobile = localStorage.getItem("activeUser");
  if (!mobile) window.location.replace("index.html");

  let userData = JSON.parse(localStorage.getItem("cachedUser") || "{}");
  let winRateSetting = 35;

  function getTotalBal() {
    return Number(userData.depositBal ?? userData.depositBalance ?? 0) + Number(userData.winningBal ?? userData.winningBalance ?? 0);
  }
  function updateHeaderBal() {
    document.getElementById("balDisplay").innerText = getTotalBal().toFixed(2);
  }
  updateHeaderBal();

  async function syncUser() {
    try {
      const [uRes, rRes] = await Promise.all([
        fetch(`${DB_URL}/users/${mobile}.json?t=${Date.now()}`),
        fetch(`${DB_URL}/settings/winRate.json?t=${Date.now()}`)
      ]);
      const u = await uRes.json();
      const r = await rRes.json();
      if (u && u.name) {
        userData = u;
        localStorage.setItem("cachedUser", JSON.stringify(u));
        updateHeaderBal();
      }
      if (typeof r === "number") winRateSetting = r;
    } catch (e) {}
  }
  syncUser();

  // ==========================================
  // WEB AUDIO SOUND EFFECTS
  // ==========================================
  let soundEnabled = true;
  let audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById("soundToggleBtn").innerText = soundEnabled ? "🔊" : "🔇";
  }

  function playSound(type) {
    if (!soundEnabled) return;
    try {
      ensureAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === "jump") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(640, now + 0.14);
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      } else if (type === "coin") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(920, now);
        osc.frequency.setValueAtTime(1380, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === "horn") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.linearRampToValueAtTime(290, now + 0.2);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === "crash") {
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc1.type = "sawtooth";
        osc2.type = "square";
        osc1.frequency.setValueAtTime(380, now);
        osc1.frequency.exponentialRampToValueAtTime(55, now + 0.45);
        osc2.frequency.setValueAtTime(140, now);
        osc2.frequency.exponentialRampToValueAtTime(35, now + 0.45);
        gain.gain.setValueAtTime(0.32, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.48);
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.48);
        osc2.stop(now + 0.48);
      } else if (type === "win") {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.22, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.28);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.28);
        });
      }
    } catch (e) {}
  }

  // ==========================================
  // GAME CONFIG & STATE
  // ==========================================
  const MODES = {
    easy: { label: "EASY", baseFail: 0.14, mults: [1.05, 1.18, 1.32, 1.48, 1.66, 1.88, 2.15, 2.48, 2.90, 3.45, 4.15, 5.00] },
    medium: { label: "MEDIUM", baseFail: 0.24, mults: [1.18, 1.45, 1.80, 2.25, 2.85, 3.60, 4.60, 5.90, 7.60, 10.00] },
    hard: { label: "HARD", baseFail: 0.36, mults: [1.35, 1.90, 2.75, 4.00, 5.90, 8.80, 13.50, 21.00] },
    hardcore: { label: "HARDCORE", baseFail: 0.50, mults: [1.65, 2.80, 4.90, 8.80, 16.50, 32.00] }
  };

  let currentMode = "easy";
  let isGameActive = false;
  let currentStep = 0;
  let visualStep = 0;
  let hopAnim = 0;
  let currentBet = 0;
  let crashedStep = -1;
  let killerCar = null;

  const CAR_TYPES = [
    { body: "#ef4444", roof: "#fca5a5" },
    { body: "#3b82f6", roof: "#93c5fd" },
    { body: "#f59e0b", roof: "#fde68a" },
    { body: "#10b981", roof: "#6ee7b7" },
    { body: "#a855f7", roof: "#e9d5ff" }
  ];
  let ambientCars = [
    { lane: 1, z: 0.22, speed: 0.013, style: CAR_TYPES[0] },
    { lane: 3, z: 0.58, speed: 0.015, style: CAR_TYPES[2] },
    { lane: 4, z: 0.10, speed: 0.012, style: CAR_TYPES[1] }
  ];

  function spawnAmbientCar() {
    const mults = MODES[currentMode].mults;
    const laneIdx = Math.floor(Math.random() * mults.length) + 1;
    if (isGameActive && laneIdx === currentStep) return;
    if (ambientCars.some(c => c.lane === laneIdx && c.z < 0.38)) return;

    const style = CAR_TYPES[Math.floor(Math.random() * CAR_TYPES.length)];
    ambientCars.push({
      lane: laneIdx,
      z: -0.05,
      speed: 0.012 + Math.random() * 0.008,
      style
    });
  }

  function setDifficulty(mode, btn) {
    if (isGameActive) return;
    currentMode = mode;
    document.querySelectorAll(".diff-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("modeBadge").innerText = "MODE: " + MODES[mode].label;
    crashedStep = -1;
    killerCar = null;
    currentStep = 0;
    visualStep = 0;
    ambientCars = [
      { lane: 1, z: 0.25, speed: 0.013, style: CAR_TYPES[0] },
      { lane: 2, z: 0.62, speed: 0.015, style: CAR_TYPES[2] }
    ];
  }

  function adjBet(delta) {
    if (isGameActive) return;
    const inp = document.getElementById("betInp");
    inp.value = Math.max(10, (parseInt(inp.value) || 10) + delta);
  }
  function setBet(val) {
    if (isGameActive) return;
    document.getElementById("betInp").value = val;
  }

  // ==========================================
  // 3D HIGHWAY RENDERER (100% COMPATIBLE)
  // ==========================================
  const canvas = document.getElementById("road3dCanvas");
  const ctx = canvas.getContext("2d");

  function drawRoundedBox(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function project3D(laneWorldX, z) {
    const horizonY = 56;
    const groundY = 258;
    const persp = 0.36 + 0.64 * z;
    const screenY = horizonY + (groundY - horizonY) * Math.pow(Math.max(0, z), 1.12);
    const laneScreenWidth = 94 * persp;
    const cameraCenterScreenX = 110;
    const screenX = cameraCenterScreenX + (laneWorldX - visualStep) * laneScreenWidth;
    return { x: screenX, y: screenY, scale: persp, w: laneScreenWidth };
  }

  function draw3DCar(car, zOverride) {
    const z = zOverride !== undefined ? zOverride : car.z;
    const p = project3D(car.lane, z);
    if (p.x < -80 || p.x > canvas.width + 80) return;

    const w = 54 * p.scale;
    const h = 38 * p.scale;
    const x = p.x - w / 2;
    const y = p.y - h;

    ctx.save();
    // Shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 2 * p.scale, w * 0.58, 7 * p.scale, 0, 0, Math.PI * 2);
    ctx.fill();

    // Car Body
    ctx.fillStyle = car.style.body;
    drawRoundedBox(x, y + h * 0.35, w, h * 0.55, 6 * p.scale);
    ctx.fill();

    // Car Roof
    ctx.fillStyle = car.style.roof;
    drawRoundedBox(x + w * 0.14, y + h * 0.05, w * 0.72, h * 0.38, 5 * p.scale);
    ctx.fill();

    // Windshield
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(x + w * 0.2, y + h * 0.12, w * 0.6, h * 0.24);

    // Headlights
    ctx.fillStyle = "#fef08a";
    ctx.beginPath();
    ctx.arc(x + w * 0.18, y + h * 0.62, 4.2 * p.scale, 0, Math.PI * 2);
    ctx.arc(x + w * 0.82, y + h * 0.62, 4.2 * p.scale, 0, Math.PI * 2);
    ctx.fill();

    // Headlight Beam
    const beamGrad = ctx.createLinearGradient(p.x, y + h * 0.62, p.x, p.y + 28 * p.scale);
    beamGrad.addColorStop(0, "rgba(254, 240, 138, 0.42)");
    beamGrad.addColorStop(1, "rgba(254, 240, 138, 0)");
    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.1, y + h * 0.62);
    ctx.lineTo(x + w * 0.9, y + h * 0.62);
    ctx.lineTo(x + w * 1.15, p.y + 28 * p.scale);
    ctx.lineTo(x - w * 0.15, p.y + 28 * p.scale);
    ctx.closePath();
    ctx.fill();

    // Wheels
    ctx.fillStyle = "#090a0d";
    ctx.fillRect(x + 2 * p.scale, y + h * 0.78, 9 * p.scale, 8 * p.scale);
    ctx.fillRect(x + w - 11 * p.scale, y + h * 0.78, 9 * p.scale, 8 * p.scale);
    ctx.restore();
  }

  function draw3DChicken(stepX, jumpHeight, isSquashed) {
    const z = 0.76;
    const p = project3D(stepX, z);
    const s = p.scale * 1.28;
    const cx = p.x;
    const bob = Math.sin(Date.now() / 180) * 2.5;
    const cy = p.y - jumpHeight * s + (isSquashed ? 0 : bob);

    ctx.save();
    // Ground Shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.beginPath();
    ctx.ellipse(cx, p.y + 4 * s, 20 * s, 7 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    if (isSquashed) {
      ctx.font = `${Math.round(38 * s)}px Arial`;
      ctx.textAlign = "center";
      ctx.fillText("💥", cx, cy - 8 * s);
      ctx.font = `${Math.round(30 * s)}px Arial`;
      ctx.fillText("🍗", cx, cy + 6 * s);
      ctx.restore();
      return;
    }

    // Orange Feet
    ctx.strokeStyle = "#f97316";
    ctx.lineWidth = 3 * s;
    ctx.beginPath();
    ctx.moveTo(cx - 5 * s, cy - 5 * s);
    ctx.lineTo(cx - 5 * s, cy + 3 * s);
    ctx.moveTo(cx + 5 * s, cy - 5 * s);
    ctx.lineTo(cx + 5 * s, cy + 3 * s);
    ctx.stroke();

    // Chicken Body
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(cx, cy - 18 * s, 17 * s, 14 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Chicken Head
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(cx + 7 * s, cy - 32 * s, 10.5 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Red Comb
    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(cx + 4 * s, cy - 43 * s, 4.5 * s, 0, Math.PI * 2);
    ctx.arc(cx + 10 * s, cy - 42 * s, 4 * s, 0, Math.PI * 2);
    ctx.fill();

    // Yellow Beak
    ctx.fillStyle = "#f59e0b";
    ctx.beginPath();
    ctx.moveTo(cx + 16 * s, cy - 33 * s);
    ctx.lineTo(cx + 25 * s, cy - 30 * s);
    ctx.lineTo(cx + 16 * s, cy - 27 * s);
    ctx.closePath();
    ctx.fill();

    // Eye
    ctx.fillStyle = "#0f172a";
    ctx.beginPath();
    ctx.arc(cx + 11 * s, cy - 33 * s, 2.4 * s, 0, Math.PI * 2);
    ctx.fill();

    // Wing
    ctx.fillStyle = "#e2e8f0";
    ctx.beginPath();
    ctx.ellipse(cx - 3 * s, cy - 17 * s, 9 * s, 5.5 * s, -0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function render3DScene() {
    try {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      visualStep += (currentStep - visualStep) * 0.18;
      if (hopAnim > 0) hopAnim = Math.max(0, hopAnim - 0.08);

      const horizonY = 56;
      const groundY = 270;
      const mults = MODES[currentMode].mults;

      // 1. Sky & Buildings
      const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
      skyGrad.addColorStop(0, "#090d1a");
      skyGrad.addColorStop(1, "#1e293b");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, horizonY);

      ctx.fillStyle = "#0f172a";
      for (let bx = 0; bx < canvas.width; bx += 34) {
        const bh = 14 + ((bx * 7) % 24);
        ctx.fillRect(bx, horizonY - bh, 28, bh);
      }

      // 2. 3D Road Ground
      const roadGrad = ctx.createLinearGradient(0, horizonY, 0, groundY);
      roadGrad.addColorStop(0, "#181c26");
      roadGrad.addColorStop(1, "#262c3a");
      ctx.fillStyle = roadGrad;
      ctx.fillRect(0, horizonY, canvas.width, groundY - horizonY);

      // 3. Draw Lanes & Multiplier Coins
      for (let i = 0; i <= mults.length + 1; i++) {
        const farLeft = project3D(i - 0.5, 0);
        const farRight = project3D(i + 0.5, 0);
        const nearLeft = project3D(i - 0.5, 1);
        const nearRight = project3D(i + 0.5, 1);

        if (nearRight.x < -50 || nearLeft.x > canvas.width + 50) continue;

        ctx.beginPath();
        ctx.moveTo(farLeft.x, farLeft.y);
        ctx.lineTo(farRight.x, farRight.y);
        ctx.lineTo(nearRight.x, nearRight.y);
        ctx.lineTo(nearLeft.x, nearLeft.y);
        ctx.closePath();

        if (i === 0) {
          ctx.fillStyle = "#2d3548";
        } else if (i === mults.length + 1) {
          ctx.fillStyle = "#713f12";
        } else if (crashedStep === i) {
          ctx.fillStyle = "rgba(239, 68, 68, 0.35)";
        } else if (i <= currentStep) {
          ctx.fillStyle = "rgba(40, 224, 77, 0.16)";
        } else {
          ctx.fillStyle = (i % 2 === 0) ? "#1f2430" : "#242a38";
        }
        ctx.fill();

        // Lane Divider Line
        ctx.strokeStyle = i === 0 ? "#fbbf24" : "rgba(255, 255, 255, 0.28)";
        ctx.lineWidth = i === 0 ? 2.5 : 1.5;
        ctx.setLineDash(i === 0 ? [] : [8, 8]);
        ctx.beginPath();
        ctx.moveTo(farRight.x, farRight.y);
        ctx.lineTo(nearRight.x, nearRight.y);
        ctx.stroke();
        ctx.setLineDash([]);

        if (i >= 1 && i <= mults.length) {
          const coinPos = project3D(i, 0.76);
          const rx = 26 * coinPos.scale;
          const ry = 14 * coinPos.scale;

          ctx.save();
          ctx.fillStyle = i <= currentStep ? "#15803d" : (i === currentStep + 1 && isGameActive ? "#b45309" : "#334155");
          ctx.beginPath();
          ctx.ellipse(coinPos.x, coinPos.y + 4 * coinPos.scale, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = crashedStep === i ? "#991b1b" : (i <= currentStep ? "#166534" : (i === currentStep + 1 && isGameActive ? "#451a03" : "#1e293b"));
          ctx.strokeStyle = crashedStep === i ? "#ef4444" : (i <= currentStep ? "#4ade80" : (i === currentStep + 1 && isGameActive ? "#fbbf24" : "#64748b"));
          ctx.lineWidth = 2 * coinPos.scale;
          ctx.beginPath();
          ctx.ellipse(coinPos.x, coinPos.y, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = i <= currentStep ? "#bbf7d0" : "#fde047";
          ctx.font = `bold ${Math.max(9, Math.round(11 * coinPos.scale))}px Segoe UI`;
          ctx.textAlign = "center";
          ctx.fillText(mults[i - 1].toFixed(2) + "x", coinPos.x, coinPos.y + 3 * coinPos.scale);
          ctx.restore();
        } else if (i === mults.length + 1) {
          const finPos = project3D(i, 0.72);
          ctx.font = `${Math.round(28 * finPos.scale)}px Arial`;
          ctx.textAlign = "center";
          ctx.fillText("🏆", finPos.x, finPos.y);
        }
      }

      // 4. Update & Draw Cars + Chicken
      if (Math.random() < 0.05) spawnAmbientCar();
      ambientCars.forEach(c => {
        c.z += c.speed;
        if (!c.honked && c.z > 0.65 && Math.abs(c.lane - currentStep) <= 1) {
          c.honked = true;
          if (Math.random() < 0.35) playSound("horn");
        }
      });
      ambientCars = ambientCars.filter(c => c.z < 1.25);

      const renderQueue = [];
      ambientCars.forEach(c => renderQueue.push({ type: "car", z: c.z, obj: c }));
      if (killerCar) renderQueue.push({ type: "killer", z: killerCar.z, obj: killerCar });
      renderQueue.push({ type: "chicken", z: 0.76 });

      renderQueue.sort((a, b) => a.z - b.z);

      renderQueue.forEach(item => {
        if (item.type === "car") {
          draw3DCar(item.obj);
        } else if (item.type === "killer") {
          if (item.obj.z < 0.78) item.obj.z += 0.065;
          draw3DCar(item.obj, item.obj.z);
        } else if (item.type === "chicken") {
          const jumpArc = Math.sin(hopAnim * Math.PI) * 36;
          draw3DChicken(visualStep, jumpArc, crashedStep !== -1);
        }
      });
    } catch (err) {}

    requestAnimationFrame(render3DScene);
  }
  requestAnimationFrame(render3DScene);

  // ==========================================
  // GAMEPLAY ACTIONS
  // ==========================================
  async function startChickenRun() {
    ensureAudio();
    const bet = parseInt(document.getElementById("betInp").value);
    if (!bet || bet < 10) return alert("Minimum bet ₹10 hai!");
    if (bet > getTotalBal()) return alert("Aapke wallet mein itna balance nahi hai!");

    playSound("jump");

    let dBal = Number(userData.depositBal ?? userData.depositBalance ?? 0);
    let wBal = Number(userData.winningBal ?? userData.winningBalance ?? 0);
    if (dBal >= bet) {
      dBal -= bet;
    } else {
      const rem = bet - dBal;
      dBal = 0;
      wBal -= rem;
    }

    const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
    txns.unshift({ type: `Chicken 3D Bet (${MODES[currentMode].label})`, amt: "-₹" + bet, date: new Date().toLocaleString() });

    userData.depositBal = dBal;
    userData.winningBal = wBal;
    userData.txns = txns.slice(0, 30);
    localStorage.setItem("cachedUser", JSON.stringify(userData));
    updateHeaderBal();

    fetch(`${DB_URL}/users/${mobile}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ depositBal: dBal, winningBal: wBal, txns: userData.txns })
    });

    currentBet = bet;
    currentStep = 0;
    visualStep = 0;
    crashedStep = -1;
    killerCar = null;
    isGameActive = true;

    document.querySelectorAll(".diff-btn").forEach(b => b.disabled = true);
    document.getElementById("startBtnWrap").style.display = "none";
    document.getElementById("activeBtnsWrap").style.display = "grid";
    document.getElementById("curMultBadge").innerText = "1.00x";
    document.getElementById("cashBtn").innerText = `CASH OUT ₹${bet}`;
    document.getElementById("statusBanner").innerText = "🐾 JUMP NEXT dabakar saamne wali lane par koodein!";
  }

  function stepChickenForward() {
    if (!isGameActive) return;
    ensureAudio();
    const mults = MODES[currentMode].mults;
    const nextStep = currentStep + 1;
    if (nextStep > mults.length) return;

    ambientCars = ambientCars.filter(c => c.lane !== nextStep);

    const baseFail = MODES[currentMode].baseFail;
    const adminFactor = (100 - winRateSetting) / 65;
    const failProb = Math.min(0.75, Math.max(0.08, baseFail * adminFactor));

    if (Math.random() < failProb) {
      currentStep = nextStep;
      hopAnim = 1.0;
      crashedStep = nextStep;
      isGameActive = false;
      killerCar = {
        lane: nextStep,
        z: 0.15,
        style: { body: "#ef4444", roof: "#fca5a5" }
      };
      playSound("crash");
      document.getElementById("statusBanner").innerHTML = `<span style="color:#ff4d6d;">💥 CRASH! Speeding car ne takkar maar di. ₹${currentBet} lost!</span>`;
      resetDeckUI();
      return;
    }

    currentStep = nextStep;
    hopAnim = 1.0;
    playSound("jump");
    setTimeout(() => playSound("coin"), 110);

    const curMult = mults[currentStep - 1];
    const curWin = Math.floor(currentBet * curMult);
    document.getElementById("curMultBadge").innerText = curMult.toFixed(2) + "x";
    document.getElementById("cashBtn").innerText = `CASH OUT ₹${curWin}`;
    document.getElementById("statusBanner").innerText = `🔥 Lane ${currentStep} Clear! Win: ₹${curWin} (${curMult.toFixed(2)}x)`;

    if (currentStep === mults.length) {
      cashOutChicken();
    }
  }

  async function cashOutChicken() {
    if (!isGameActive) return;
    if (currentStep === 0) return alert("Pehle kam se kam 1 lane cross karein!");

    ensureAudio();
    playSound("win");

    const mults = MODES[currentMode].mults;
    const curMult = mults[currentStep - 1];
    const winAmt = Math.floor(currentBet * curMult);

    isGameActive = false;
    resetDeckUI();

    const newWinBal = Number(userData.winningBal ?? userData.winningBalance ?? 0) + winAmt;
    const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
    txns.unshift({
      type: `Chicken 3D Win (${curMult.toFixed(2)}x)`,
      amt: "+₹" + winAmt,
      date: new Date().toLocaleString()
    });

    userData.winningBal = newWinBal;
    userData.txns = txns.slice(0, 30);
    localStorage.setItem("cachedUser", JSON.stringify(userData));
    updateHeaderBal();

    document.getElementById("statusBanner").innerHTML = `<span style="color:#28e04d;">🎉 CASHED OUT! Aapne ₹${winAmt} (${curMult.toFixed(2)}x) jeete!</span>`;

    const maskedMe = mobile.slice(0, 1) + "***" + mobile.slice(-1);
    liveFeedData.unshift({
      name: maskedMe + " (You)",
      bet: currentBet,
      mult: curMult.toFixed(2) + "x",
      win: winAmt,
      isMe: true
    });
    renderFeed();

    fetch(`${DB_URL}/users/${mobile}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ winningBal: newWinBal, txns: userData.txns })
    });

    fetch(`${DB_URL}/chickenLiveFeed/${mobile}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: maskedMe,
        bet: currentBet,
        mult: curMult.toFixed(2) + "x",
        win: winAmt,
        ts: Date.now()
      })
    });
  }

  function resetDeckUI() {
    document.querySelectorAll(".diff-btn").forEach(b => b.disabled = false);
    document.getElementById("startBtnWrap").style.display = "grid";
    document.getElementById("activeBtnsWrap").style.display = "none";
  }

  // Hybrid Live Feed
  const BOTS = ["r***9", "s***2", "a***7", "m***4", "k***1", "v***8", "p***5", "d***3", "n***6", "t***0"];
  let liveFeedData = [
    { name: "r***9", bet: 500, mult: "2.48x", win: 1240, isMe: false },
    { name: "a***7", bet: 200, mult: "1.80x", win: 360, isMe: false },
    { name: "m***4", bet: 1000, mult: "3.60x", win: 3600, isMe: false },
    { name: "v***8", bet: 100, mult: "1.48x", win: 148, isMe: false },
    { name: "k***1", bet: 300, mult: "2.25x", win: 675, isMe: false }
  ];

  function renderFeed() {
    document.getElementById("liveFeedList").innerHTML = liveFeedData.slice(0, 10).map(item => `
      <div class="feed-row win ${item.isMe ? 'me' : ''}">
        <div style="font-weight:bold; color:#e2e8f0;">🐔 ${item.name}</div>
        <div style="color:#9ca3af;">₹${item.bet}</div>
        <div><span class="x-pill">${item.mult}</span></div>
        <div style="text-align:right; font-weight:bold; color:#28e04d;">+₹${item.win}</div>
      </div>
    `).join("");
  }
  renderFeed();

  setInterval(async () => {
    const bName = BOTS[Math.floor(Math.random() * BOTS.length)];
    const bBet = [50, 100, 200, 500, 1000][Math.floor(Math.random() * 5)];
    const bMult = (1.18 + Math.random() * 3.5).toFixed(2);
    liveFeedData.unshift({
      name: bName,
      bet: bBet,
      mult: bMult + "x",
      win: Math.floor(bBet * Number(bMult)),
      isMe: false
    });
    document.getElementById("onlineTxt").innerText = "● " + (Math.floor(Math.random() * 45) + 190) + " Playing";

    try {
      const res = await fetch(`${DB_URL}/chickenLiveFeed.json?t=${Date.now()}`);
      const real = await res.json();
      if (real) {
        Object.keys(real).forEach(k => {
          const r = real[k];
          if (r && (Date.now() - r.ts) < 25000 && k !== mobile) {
            liveFeedData.unshift({ name: r.name, bet: r.bet, mult: r.mult, win: r.win, isMe: false });
          }
        });
      }
    } catch (e) {}

    renderFeed();
  }, 4500);
</script>
