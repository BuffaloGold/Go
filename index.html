<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buffalo Gold - Verified Login & Sign Up</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body {
    background: radial-gradient(circle at top, #4a0d66, #12021a);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .auth-card {
    width: 100%;
    max-width: 410px;
    background: #1d042b;
    border: 2px solid #ffd700;
    border-radius: 22px;
    padding: 26px 20px;
    box-shadow: 0 0 35px rgba(255, 215, 0, 0.3);
    text-align: center;
  }
  h1 { color: #ffd700; font-size: 26px; text-shadow: 0 2px 8px #ff6600; margin-top: 6px; }
  .sub { font-size: 12px; color: #d8b4e8; margin: 4px 0 20px; }

  .google-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid #ffd700;
    background: #ffffff;
    color: #111;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
  }
  .google-btn:active { transform: scale(0.98); }
  .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .verified-box {
    background: rgba(40, 224, 77, 0.14);
    border: 1px solid #28e04d;
    border-radius: 10px;
    padding: 10px;
    font-size: 12px;
    color: #86efac;
    margin-bottom: 14px;
    text-align: left;
  }
  .form-group { text-align: left; margin-bottom: 13px; }
  label { display: block; font-size: 12px; color: #e2c6f2; margin-bottom: 5px; font-weight: 600; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid #6b1d91;
    background: #12021a;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: #ffd700; }

  .btn-green {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(180deg, #32eb4a, #0e8a1e);
    color: #fff;
    font-weight: 900;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 0 #075211;
  }
  .info-strip {
    margin-top: 16px;
    background: #12021a;
    border: 1px dashed #ffd700;
    border-radius: 10px;
    padding: 10px;
    font-size: 12px;
    color: #fde047;
    line-height: 1.5;
  }
  #debugBar {
    margin-top: 12px;
    font-size: 11px;
    color: #38bdf8;
    min-height: 16px;
  }
</style>
</head>
<body>

<div class="auth-card">
  <div style="font-size:46px;">🐃💰</div>
  <h1>BUFFALO GOLD</h1>
  <p class="sub">100% Verified Accounts • Instant UPI Withdrawal</p>

  <div id="stepGoogle">
    <button type="button" class="google-btn" id="googleSignInBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20" alt="G">
      <span>Continue with Google (Gmail)</span>
    </button>

    <div class="info-strip">
      🔒 <strong>Fake Account Protection:</strong><br>
      Apne Gmail se 1-click verify karein aur payein <strong>₹100 Welcome Bonus</strong> + Referral par <strong>₹50 Extra</strong>!
    </div>
    <div id="debugBar">Loading security...</div>
  </div>

  <div id="stepMobile" style="display:none;">
    <div class="verified-box" id="gmailBadge">✅ Gmail Verified</div>

    <div class="form-group">
      <label>10-Digit Mobile Number (Purana ya Naya Number)</label>
      <input type="tel" id="userMobile" maxlength="10" placeholder="Apna 10-digit number dalein">
    </div>

    <div class="form-group">
      <label id="refLabel" style="color:#ffd700;">Referral Code (Optional - Naye Users Ke Liye)</label>
      <input type="text" id="userRef" placeholder="Jaise: BUF8205 ya Mobile Number">
    </div>

    <button type="button" class="btn-green" id="completeSignupBtn">
      🎁 VERIFY & CONTINUE TO GAME
    </button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
    getRedirectResult, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const debugBar = document.getElementById("debugBar");

  const firebaseConfig = {
    apiKey: "AIzaSyA2XNXfLvE0G0SfU4lxFyh8VO2-kkM_HcA",
    authDomain: "coin-play-7ac49.firebaseapp.com",
    databaseURL: "https://coin-play-7ac49-default-rtdb.firebaseio.com",
    projectId: "coin-play-7ac49",
    storageBucket: "coin-play-7ac49.appspot.com",
    messagingSenderId: "484130715123",
    appId: "1:484130715123:android:bf3a48ab1b5b2de2c54e86"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });

  if (!localStorage.getItem("activeUser")) {
    await signOut(auth).catch(() => {});
  } else {
    window.location.replace("game.html");
  }

  debugBar.innerText = "● Ready to verify";

  let verifiedGoogleUser = null;
  let handledUser = false;

  const params = new URLSearchParams(window.location.search);
  const urlRef = (params.get("ref") || "").trim().toUpperCase();
  if (urlRef) localStorage.setItem("pendingRefCode", urlRef);

  const savedRef = localStorage.getItem("pendingRefCode") || "";
  if (savedRef) {
    const refBox = document.getElementById("userRef");
    refBox.value = savedRef;
    refBox.style.borderColor = "#28e04d";
    refBox.style.color = "#28e04d";
    document.getElementById("refLabel").innerText = "✅ Referral Code Applied (+₹50 Extra Bonus!)";
  }

  const gBtn = document.getElementById("googleSignInBtn");

  async function processGoogleUser(gUser) {
    if (!gUser || handledUser) return;
    handledUser = true;
    sessionStorage.removeItem("bg_google_redirect");
    gBtn.disabled = true;
    gBtn.innerHTML = "<span>Checking Account...</span>";
    debugBar.innerText = "Checking " + gUser.email + "...";

    try {
      const emailKey = gUser.email.replace(/\./g, "_");
      const emailSnap = await get(ref(db, "verifiedEmails/" + emailKey));

      if (emailSnap.exists()) {
        const linkedMobile = emailSnap.val().mobile;
        const userSnap = await get(ref(db, "users/" + linkedMobile));
        if (userSnap.exists()) {
          const u = userSnap.val();
          // Agar purane user ke paas depositBalance naam se bonus pada hai to use depositBal me sync karein
          if (u.depositBal === undefined && u.depositBalance !== undefined) {
            u.depositBal = Number(u.depositBalance);
            await update(ref(db, "users/" + linkedMobile), { depositBal: u.depositBal });
          }
          localStorage.removeItem("pendingRefCode");
          localStorage.setItem("activeUser", linkedMobile);
          localStorage.setItem("cachedUser", JSON.stringify(u));
          window.location.replace("game.html");
          return;
        }
      }

      verifiedGoogleUser = gUser;
      document.getElementById("stepGoogle").style.display = "none";
      document.getElementById("stepMobile").style.display = "block";
      document.getElementById("gmailBadge").innerHTML = `✅ Verified Gmail: <strong>${gUser.email}</strong>`;
    } catch (e) {
      handledUser = false;
      gBtn.disabled = false;
      gBtn.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20"><span>Continue with Google (Gmail)</span>`;
      debugBar.innerText = "Error: " + e.message;
      alert("Database Error: " + e.message);
    }
  }

  getRedirectResult(auth).then((res) => {
    if (res && res.user) processGoogleUser(res.user);
  }).catch(() => {});

  if (sessionStorage.getItem("bg_google_redirect") === "1") {
    onAuthStateChanged(auth, (user) => {
      if (user) processGoogleUser(user);
    });
  }

  gBtn.addEventListener("click", async () => {
    gBtn.disabled = true;
    gBtn.innerHTML = "<span>Opening Google...</span>";
    debugBar.innerText = "Connecting to Google Sign-In...";

    try {
      const result = await signInWithPopup(auth, provider);
      if (result && result.user) {
        await processGoogleUser(result.user);
      }
    } catch (err) {
      if (err.code === "auth/popup-blocked" || err.code === "auth/cancelled-popup-request" || err.code === "auth/operation-not-supported-in-this-environment") {
        sessionStorage.setItem("bg_google_redirect", "1");
        gBtn.innerHTML = "<span>Redirecting to Google...</span>";
        signInWithRedirect(auth, provider);
      } else {
        gBtn.disabled = false;
        gBtn.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20"><span>Continue with Google (Gmail)</span>`;
        debugBar.innerText = "● Ready to verify";
        if (err.code !== "auth/popup-closed-by-user") {
          alert("Google Sign-In Error (" + err.code + "): " + err.message);
        }
      }
    }
  });

  const cBtn = document.getElementById("completeSignupBtn");
  cBtn.addEventListener("click", async () => {
    if (!verifiedGoogleUser) return;
    const mobile = document.getElementById("userMobile").value.trim();
    const refInput = document.getElementById("userRef").value.trim().toUpperCase();

    if (!/^[6-9]\d{9}$/.test(mobile)) {
      return alert("❌ Sahi 10-digit Indian mobile number dalein!");
    }

    cBtn.disabled = true;
    cBtn.innerText = "VERIFYING ACCOUNT...";

    try {
      const emailKey = verifiedGoogleUser.email.replace(/\./g, "_");
      const mobSnap = await get(ref(db, "users/" + mobile));

      if (mobSnap.exists()) {
        const existingUser = mobSnap.val();
        if (!existingUser.email || existingUser.email === verifiedGoogleUser.email) {
          const syncedDepBal = Number(existingUser.depositBal ?? existingUser.depositBalance ?? 0);
          const updatedData = {
            email: verifiedGoogleUser.email,
            uid: verifiedGoogleUser.uid,
            depositBal: syncedDepBal
          };
          await update(ref(db, "users/" + mobile), updatedData);
          await set(ref(db, "verifiedEmails/" + emailKey), {
            mobile: mobile,
            email: verifiedGoogleUser.email,
            uid: verifiedGoogleUser.uid
          });

          const mergedUser = { ...existingUser, ...updatedData };
          localStorage.removeItem("pendingRefCode");
          localStorage.setItem("activeUser", mobile);
          localStorage.setItem("cachedUser", JSON.stringify(mergedUser));
          alert("✅ Aapka purana account Gmail se link ho gaya hai! Welcome back.");
          window.location.replace("game.html");
          return;
        } else {
          cBtn.disabled = false;
          cBtn.innerText = "🎁 VERIFY & CONTINUE TO GAME";
          return alert("❌ Yeh mobile number pehle se kisi doosre Gmail (" + existingUser.email.slice(0, 4) + "***) se linked hai!");
        }
      }

      let welcomeBonus = 100;
      let referredByMobile = "";
      const nowStr = new Date().toLocaleString();

      if (refInput && refInput !== mobile && refInput !== ("BUF" + mobile.slice(-4))) {
        const allSnap = await get(ref(db, "users"));
        if (allSnap.exists()) {
          const allUsers = allSnap.val();
          for (const key in allUsers) {
            const u = allUsers[key] || {};
            if ((u.refCode || "").toUpperCase() === refInput || key === refInput) {
              referredByMobile = key;
              welcomeBonus = 150;
              const curBal = Number(u.depositBal ?? u.depositBalance ?? 0);
              const curRef = Number(u.referCount ?? u.totalRefers ?? 0);
              const curEarn = Number(u.referEarn ?? 0);
              const rTxns = Array.isArray(u.txns) ? [...u.txns] : [];
              rTxns.unshift({
                type: "Referral Bonus (" + (verifiedGoogleUser.displayName || mobile) + ")",
                amt: "+₹50",
                date: nowStr
              });
              await update(ref(db, "users/" + key), {
                depositBal: curBal + 50,
                referCount: curRef + 1,
                referEarn: curEarn + 50,
                txns: rTxns.slice(0, 30)
              });
              break;
            }
          }
        }
      }

      const newRefCode = "BUF" + mobile.slice(-4);
      const initTxns = [{
        type: referredByMobile ? "Welcome + Referral Signup Bonus" : "Welcome Signup Bonus",
        amt: "+₹" + welcomeBonus,
        date: nowStr
      }];

      const userObj = {
        name: verifiedGoogleUser.displayName || "Player",
        email: verifiedGoogleUser.email,
        uid: verifiedGoogleUser.uid,
        mobile: mobile,
        depositBal: welcomeBonus,
        winningBal: 0,
        totalDeposited: 0,
        hasDeposited: false,
        refCode: newRefCode,
        referredBy: referredByMobile,
        referCount: 0,
        referEarn: 0,
        txns: initTxns,
        createdAt: Date.now()
      };

      await set(ref(db, "users/" + mobile), userObj);
      await set(ref(db, "verifiedEmails/" + emailKey), {
        mobile: mobile,
        email: verifiedGoogleUser.email,
        uid: verifiedGoogleUser.uid
      });

      localStorage.removeItem("pendingRefCode");
      localStorage.setItem("activeUser", mobile);
      localStorage.setItem("cachedUser", JSON.stringify(userObj));
      alert("🎉 Gmail Verified! Aapke wallet mein ₹" + welcomeBonus + " Welcome Bonus credit ho gaya hai.");
      window.location.replace("game.html");
    } catch (e) {
      cBtn.disabled = false;
      cBtn.innerText = "🎁 VERIFY & CONTINUE TO GAME";
      alert("Error: " + e.message);
    }
  });
</script>
</body>
</html>
