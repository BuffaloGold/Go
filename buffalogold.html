<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<title>Buffalo Gold 3D Slot - Buffalo Gold</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { background: #0d0214; color: #fff; display: flex; justify-content: center; padding-bottom: 75px; }
  .app { width: 100%; max-width: 440px; background: linear-gradient(180deg, #1f052e 0%, #12021c 100%); min-height: 100vh; padding: 10px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #2b0740; border-radius: 12px; margin-bottom: 8px; border: 1px solid #ffd700; }
  .logo-title { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 16px; color: #ffd700; text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
  .hdr-right { display: flex; align-items: center; gap: 8px; }
  .snd-btn { background: #3e0a5c; border: 1px solid #ffd700; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .bal-pill { background: #14021f; border: 1px solid #28e04d; padding: 5px 11px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #28e04d; cursor: pointer; }

  /* Jackpot Banner */
  .jackpot-strip {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px;
  }
  .jp-box {
    background: linear-gradient(180deg, #4a0e6b, #260538); border: 1px solid #ffd700;
    border-radius: 10px; padding: 5px 4px; text-align: center;
    box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.25);
  }
  .jp-box span { font-size: 9px; color: #ffe885; font-weight: bold; display: block; }
  .jp-box strong { font-size: 13px; color: #ffd700; font-weight: 900; }

  /* 3D Slot Machine Frame */
  .slot-cabinet {
    background: linear-gradient(180deg, #591182 0%, #2d0645 100%);
    border: 3px solid #ffd700;
    border-radius: 18px;
    padding: 12px 10px;
    margin-bottom: 10px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.85), inset 0 0 20px rgba(255,215,0,0.3);
    position: relative;
  }
  .reels-window {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    background: #0b0112; border: 2px solid #b8860b; border-radius: 14px; padding: 8px;
    box-shadow: inset 0 10px 18px rgba(0,0,0,0.9), inset 0 -10px 18px rgba(0,0,0,0.9);
  }
  .reel-col {
    display: flex; flex-direction: column; gap: 6px;
    background: linear-gradient(180deg, #1b0329 0%, #2f0847 50%, #1b0329 100%);
    border-radius: 10px; padding: 6px 4px; border: 1px solid #6b1d91;
    transition: transform 0.1s;
  }
  .reel-col.spinning {
    animation: reelBlur 0.12s infinite linear;
  }
  @keyframes reelBlur {
    0% { transform: translateY(-3px); filter: blur(1.2px); }
    50% { transform: translateY(3px); filter: blur(1.5px); }
    100% { transform: translateY(-3px); filter: blur(1.2px); }
  }
  .sym-cell {
    height: 58px; display: flex; align-items: center; justify-content: center;
    font-size: 36px; border-radius: 8px;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.14), rgba(0,0,0,0.45));
    text-shadow: 0 4px 8px rgba(0,0,0,0.8);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .sym-cell.mid-row {
    border: 1.5px solid rgba(255, 215, 0, 0.55);
    background: radial-gradient(circle at 35% 30%, rgba(255, 215, 0, 0.22), rgba(20, 2, 31, 0.75));
  }
  .sym-cell.win-glow {
    border: 2px solid #28e04d;
    box-shadow: 0 0 16px #28e04d, inset 0 0 10px rgba(40, 224, 77, 0.5);
    transform: scale(1.06);
  }

  .win-banner {
    margin-top: 9px; text-align: center; background: #14021f; border: 1px solid #6b1d91;
    border-radius: 10px; padding: 6px; font-size: 13px; font-weight: 900; color: #ffe885;
  }

  /* Paytable Mini Strip */
  .paytable {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
    background: #1b0429; border: 1px solid #5c197d; border-radius: 12px;
    padding: 6px; margin-bottom: 10px; text-align: center; font-size: 10px;
  }
  .pt-item span { font-size: 18px; display: block; }
  .pt-item strong { color: #ffd700; }

  /* Spin Control Deck */
  .control-deck {
    background: #230633; border: 1px solid #75229e; border-radius: 16px; padding: 11px; margin-bottom: 10px;
  }
  .bet-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .stepper { flex: 1; display: flex; align-items: center; justify-content: space-between; background: #12021c; border: 1px solid #75229e; border-radius: 12px; padding: 6px 10px; }
  .step-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid #ffd700; background: #380952; color: #ffd700; font-weight: bold; cursor: pointer; }
  .bet-inp { background: transparent; border: none; color: #fff; font-size: 16px; font-weight: 900; width: 70px; text-align: center; outline: none; }
  .quick-chips { display: flex; gap: 5px; }
  .q-chip { background: #380952; border: 1px solid #75229e; color: #ffe885; padding: 8px 9px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; }

  .spin-actions { display: grid; grid-template-columns: 1fr 2.2fr; gap: 8px; }
  .btn-auto {
    border: 1px solid #ffd700; border-radius: 12px; background: #14021f; color: #ffd700;
    font-size: 12px; font-weight: 900; cursor: pointer; padding: 10px 4px;
  }
  .btn-auto.active { background: #ff9f1c; color: #000; border-color: #fff; }
  .btn-spin {
    border: none; border-radius: 12px;
    background: linear-gradient(180deg, #ffd700 0%, #e69500 100%);
    color: #000; font-size: 16px; font-weight: 900; cursor: pointer;
    box-shadow: 0 4px 0 #8a5600; text-transform: uppercase;
  }
  .btn-spin:active { transform: scale(0.97); }
  .btn-spin:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Live Feed */
  .feed-box { background: #1e042b; border: 1px solid #5c197d; border-radius: 14px; padding: 10px; }
  .feed-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #ffd700; padding-bottom: 7px; border-bottom: 1px solid #4a1566; margin-bottom: 6px; }
  .feed-row {
    display: grid; grid-template-columns: 1.2fr 0.9fr 0.8fr 1.1fr; align-items: center;
    background: #14021f; padding: 6px 8px; border-radius: 8px; margin-bottom: 4px; font-size: 11px;
  }
  .feed-row.win { background: rgba(40, 224, 77, 0.14); border: 1px solid rgba(40, 224, 77, 0.4); }
  .feed-row.me { border-color: #ffd700; }

  /* Bottom Navigation */
  .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 440px; background: #1e042b; border-top: 1px solid #5c197d; display: flex; justify-content: space-around; padding: 9px 0; z-index: 999; }
  .nav-item { text-align: center; color: #aaa; font-size: 11px; cursor: pointer; }
  .nav-item.active { color: #ffd700; font-weight: bold; }
  .nav-icon { font-size: 19px; display: block; }
</style>

<script>
  const DB_URL = "https://coin-play-7ac49-default-rtdb.firebaseio.com";
  const mobile = localStorage.getItem("activeUser");
  if (!mobile) window.location.replace("index.html");

  let userData = {};
  try {
    userData = JSON.parse(localStorage.getItem("cachedUser") || "{}");
  } catch (e) {}
  let winRateSetting = 20;

  // Per-User Loss, 5-6 Small-Bet Loss Counter & 1-Time 25x Recovery Tracker
  const SLOT_LOSS_KEY = "bg_slot_loss_" + mobile;
  const SLOT_25X_KEY = "bg_slot_25x_" + mobile;
  const SLOT_SMALL_STREAK_KEY = "bg_slot_sm_loss_" + mobile;
  const SLOT_DRY_STREAK_KEY = "bg_slot_dry_" + mobile;

  let slotNetLoss = Number(localStorage.getItem(SLOT_LOSS_KEY) || 0);
  let slot25xGiven = localStorage.getItem(SLOT_25X_KEY) === "1";
  let smallBetConsecLosses = Number(localStorage.getItem(SLOT_SMALL_STREAK_KEY) || 0);
  let slotDryStreak = Number(localStorage.getItem(SLOT_DRY_STREAK_KEY) || 0);

  function trackSlotPnL(deltaLoss) {
    slotNetLoss = Math.max(0, Number((slotNetLoss + deltaLoss).toFixed(2)));
    localStorage.setItem(SLOT_LOSS_KEY, String(slotNetLoss));
  }

  function getTotalBal() {
    const dep = Number(userData.depositBal ?? userData.depositBalance ?? 0) || 0;
    const win = Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0;
    return dep + win;
  }

  function updateHeaderBal() {
    document.getElementById("balDisplay").innerText = getTotalBal().toFixed(2);
  }
  updateHeaderBal();

  async function syncUser() {
    try {
      const [uRes, rRes] = await Promise.all([
        fetch(`${DB_URL}/users/${mobile}.json?t=${Date.now()}`),
        fetch(`${DB_URL}/settings/rates/slot.json?t=${Date.now()}`)
      ]);
      const u = await uRes.json();
      const r = await rRes.json();
      if (u && typeof u === "object") {
        userData = { ...userData, ...u };
        localStorage.setItem("cachedUser", JSON.stringify(userData));
        updateHeaderBal();
      }
      if (typeof r === "number") winRateSetting = r;
    } catch (e) {}
  }
  syncUser();

  let soundOn = true;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById("sndBtn").innerText = soundOn ? "🔊" : "🔇";
  }

  function playSlotSound(type) {
    if (!soundOn) return;
    try {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === "spin") {
        for (let i = 0; i < 8; i++) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(240 + (i % 3) * 90, now + i * 0.08);
          gain.gain.setValueAtTime(0.12, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.005, now + i * 0.08 + 0.06);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.06);
        }
      } else if (type === "stop") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(360, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      } else if (type === "win") {
        [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now + idx * 0.07);
          gain.gain.setValueAtTime(0.24, now + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.07 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.07);
          osc.stop(now + idx * 0.07 + 0.3);
        });
      }
    } catch (e) {}
  }
   const SYMBOLS = [
    { icon: "🐃", mult: 25, weight: 1 },
    { icon: "🪙", mult: 12, weight: 2 },
    { icon: "💎", mult: 8,  weight: 7 },
    { icon: "🦅", mult: 5,  weight: 30 },
    { icon: "🐺", mult: 3,  weight: 60 }
  ];

  let isSpinning = false;
  let autoSpin = false;

  function adjBet(delta) {
    if (isSpinning) return;
    const inp = document.getElementById("betInp");
    inp.value = Math.max(10, (parseInt(inp.value) || 10) + delta);
  }

  function setBet(val) {
    if (isSpinning) return;
    document.getElementById("betInp").value = val;
  }

  function toggleAutoSpin() {
    initAudio();
    autoSpin = !autoSpin;
    const btn = document.getElementById("autoSpinBtn");
    btn.innerText = autoSpin ? "AUTO: ON" : "AUTO: OFF";
    btn.classList.toggle("active", autoSpin);
    if (autoSpin && !isSpinning) spinReels();
  }

  function pickWeightedSymbol(betAmt = 20) {
    // Normal win par chhote symbols (3x / 5x) hi khulenge; 25x sirf ₹500+ loss recovery par
    const pool = betAmt >= 50
      ? [
          { icon: "🦅", mult: 5, weight: 15 },
          { icon: "🐺", mult: 3, weight: 85 }
        ]
      : [
          { icon: "💎", mult: 8, weight: 5 },
          { icon: "🦅", mult: 5, weight: 30 },
          { icon: "🐺", mult: 3, weight: 65 }
        ];

    const totalW = pool.reduce((s, x) => s + x.weight, 0);
    let r = Math.random() * totalW;
    for (const s of pool) {
      if (r < s.weight) return s;
      r -= s.weight;
    }
    return pool[pool.length - 1];
  }

  function pickDifferentSymbol(excludeIcon) {
    const pool = SYMBOLS.filter(s => s.icon !== excludeIcon);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  async function spinReels() {
    initAudio();
    if (isSpinning) return;

    const bet = parseInt(document.getElementById("betInp").value);
    if (!bet || bet < 10) {
      autoSpin = false;
      document.getElementById("autoSpinBtn").innerText = "AUTO: OFF";
      document.getElementById("autoSpinBtn").classList.remove("active");
      return alert("Minimum bet ₹10 hai!");
    }
    if (bet > getTotalBal()) {
      autoSpin = false;
      document.getElementById("autoSpinBtn").innerText = "AUTO: OFF";
      document.getElementById("autoSpinBtn").classList.remove("active");
      return alert("Wallet mein itna balance nahi hai!");
    }

    isSpinning = true;
    document.getElementById("spinBtn").disabled = true;
    document.getElementById("winBanner").innerHTML = "🎰 Reels ghoom rahi hain...";
    playSlotSound("spin");

    for (let c = 0; c < 3; c++) {
      document.getElementById(`c${c}_1`).classList.remove("win-glow");
      document.getElementById(`reelCol${c}`).classList.add("spinning");
    }

    // Deduct Bet
    let dBal = Number(userData.depositBal ?? userData.depositBalance ?? 0) || 0;
    let wBal = Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0;
    if (dBal >= bet) {
      dBal -= bet;
    } else {
      const rem = bet - dBal;
      dBal = 0;
      wBal -= rem;
    }

    const txns = Array.isArray(userData.txns) ? [...userData.txns] : [];
    txns.unshift({ type: "Buffalo Slot Spin", amt: "-₹" + bet, date: new Date().toLocaleString() });

    userData.depositBal = dBal;
    userData.winningBal = wBal;
    userData.txns = txns.slice(0, 30);
    localStorage.setItem("cachedUser", JSON.stringify(userData));
    updateHeaderBal();
    trackSlotPnL(bet);

    fetch(`${DB_URL}/users/${mobile}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ depositBal: dBal, winningBal: wBal, txns: userData.txns })
    });

    // ========================================================
    // SMART BUFFALO GOLD OUTCOME LOGIC:
    // 1. ₹500+ haarne par 1 baar 🐃 25x (jab bet ₹10-₹20 ho)
    // 2. ₹10-₹20 ki bet 5-6 baar haarne ke baad 🐺 3x
    // 3. Dry streak (4/10/15 spins) & Badi bet (₹50+) strict loss
    // ========================================================
    let isWin = false;
    let forcedWinSymbol = null;

    if (slotNetLoss >= 500 && !slot25xGiven && bet <= 20) {
      isWin = true;
      slot25xGiven = true;
      localStorage.setItem(SLOT_25X_KEY, "1");
      forcedWinSymbol = SYMBOLS[0]; // 🐃 25x
    } else if (bet <= 20 && smallBetConsecLosses >= (5 + Math.floor(Math.random() * 2))) {
      isWin = true;
      forcedWinSymbol = SYMBOLS[4]; // 🐺 3x
    } else if (slotDryStreak > 0 && winRateSetting < 65) {
      slotDryStreak--;
      localStorage.setItem(SLOT_DRY_STREAK_KEY, String(slotDryStreak));
      isWin = false;
    } else {
      // Kabhi-kabhi 4, 10, ya 15 spins ki dry streak shuru karein
      if (winRateSetting <= 55 && Math.random() < 0.25) {
        const streaks = [4, 10, 15];
        slotDryStreak = streaks[Math.floor(Math.random() * streaks.length)] - 1;
        localStorage.setItem(SLOT_DRY_STREAK_KEY, String(slotDryStreak));
        isWin = false;
      } else {
        let chance = winRateSetting <= 25 ? 8.0
                   : winRateSetting <= 40 ? 14.0
                   : winRateSetting <= 55 ? 24.0
                   : 45.0;
        if (bet >= 50) chance *= 0.45;
        isWin = (Math.random() * 100) < chance;
      }
    }

    let midSymbols = [];
    if (isWin) {
      const winSym = forcedWinSymbol || pickWeightedSymbol(bet);
      midSymbols = [winSym, winSym, winSym];
      if (bet <= 20) {
        smallBetConsecLosses = 0;
        localStorage.setItem(SLOT_SMALL_STREAK_KEY, "0");
      }
    } else {
      const s0 = pickWeightedSymbol(20);
      const s1 = pickWeightedSymbol(20);
      const s2 = (s0.icon === s1.icon) ? pickDifferentSymbol(s0.icon) : pickWeightedSymbol(20);
      midSymbols = [s0, s1, s2];
      if (bet <= 20) {
        smallBetConsecLosses++;
        localStorage.setItem(SLOT_SMALL_STREAK_KEY, String(smallBetConsecLosses));
      }
    }

    for (let col = 0; col < 3; col++) {
      await new Promise(res => setTimeout(res, 260));
      playSlotSound("stop");
      const colEl = document.getElementById(`reelCol${col}`);
      colEl.classList.remove("spinning");

      const topSym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      const botSym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      document.getElementById(`c${col}_0`).innerText = topSym.icon;
      document.getElementById(`c${col}_1`).innerText = midSymbols[col].icon;
      document.getElementById(`c${col}_2`).innerText = botSym.icon;
    }

    isSpinning = false;
    document.getElementById("spinBtn").disabled = false;

    if (isWin) {
      const mult = midSymbols[0].mult;
      const winAmt = bet * mult;
      playSlotSound("win");
      trackSlotPnL(-winAmt);

      for (let c = 0; c < 3; c++) {
        document.getElementById(`c${c}_1`).classList.add("win-glow");
      }
      document.getElementById("winBanner").innerHTML = `<span style="color:#28e04d;">🎉 ${midSymbols[0].icon}${midSymbols[0].icon}${midSymbols[0].icon} (${mult}x) • YOU WON +₹${winAmt}!</span>`;

      const newWinBal = (Number(userData.winningBal ?? userData.winningBalance ?? 0) || 0) + winAmt;
      const winTxns = Array.isArray(userData.txns) ? [...userData.txns] : [];
      winTxns.unshift({
        type: `Buffalo Slot Win (${mult}x)`,
        amt: "+₹" + winAmt,
        date: new Date().toLocaleString()
      });

      userData.winningBal = newWinBal;
      userData.txns = winTxns.slice(0, 30);
      localStorage.setItem("cachedUser", JSON.stringify(userData));
      updateHeaderBal();

      const maskedMe = mobile.slice(0, 1) + "***" + mobile.slice(-1);
      liveFeedData.unshift({ name: maskedMe + " (You)", bet: bet, mult: mult + "x", win: winAmt, isMe: true });
      renderFeed();

      fetch(`${DB_URL}/users/${mobile}.json`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ winningBal: newWinBal, txns: userData.txns })
      });

      fetch(`${DB_URL}/slotLiveFeed/${mobile}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: maskedMe, bet: bet, mult: mult + "x", win: winAmt, ts: Date.now() })
      });
    } else {
      document.getElementById("winBanner").innerHTML = `<span style="color:#ff9f1c;">No Match • Phir se Spin karein!</span>`;
    }

    if (autoSpin) {
      setTimeout(() => {
        if (autoSpin && !isSpinning) spinReels();
      }, 650);
    }
  }

  // Hybrid Live Winners Feed
  const BOTS = ["r***4", "k***8", "a***1", "s***9", "v***3", "m***7", "p***2", "d***6", "n***5", "t***0"];
  let liveFeedData = [
    { name: "r***4", bet: 100, mult: "25x", win: 2500, isMe: false },
    { name: "k***8", bet: 50, mult: "12x", win: 600, isMe: false },
    { name: "a***1", bet: 200, mult: "8x", win: 1600, isMe: false },
    { name: "s***9", bet: 100, mult: "5x", win: 500, isMe: false },
    { name: "v***3", bet: 500, mult: "3x", win: 1500, isMe: false }
  ];

  function renderFeed() {
    document.getElementById("liveFeedList").innerHTML = liveFeedData.slice(0, 10).map(item => `
      <div class="feed-row win ${item.isMe ? 'me' : ''}">
        <div style="font-weight:bold; color:#ffe885;">🐃 ${item.name}</div>
        <div style="color:#ccc;">₹${item.bet}</div>
        <div style="color:#ffd700; font-weight:bold;">${item.mult}</div>
        <div style="text-align:right; font-weight:bold; color:#28e04d;">+₹${item.win}</div>
      </div>
    `).join("");
  }
  renderFeed();

  setInterval(async () => {
    const bName = BOTS[Math.floor(Math.random() * BOTS.length)];
    const bBet = [20, 50, 100, 200, 500][Math.floor(Math.random() * 5)];
    const bSym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
    liveFeedData.unshift({ name: bName, bet: bBet, mult: bSym.mult + "x", win: bBet * bSym.mult, isMe: false });
    document.getElementById("onlineTxt").innerText = "● " + (280 + Math.floor(Math.random() * 60)) + " Spinning";

    try {
      const res = await fetch(`${DB_URL}/slotLiveFeed.json?t=${Date.now()}`);
      const real = await res.json();
      if (real) {
        Object.keys(real).forEach(k => {
          const r = real[k];
          if (r && (Date.now() - r.ts) < 25000 && k !== mobile) {
            liveFeedData.unshift({ name: r.name, bet: r.bet, mult: r.mult, win: r.win, isMe: false });
          }
        });
      }
    } catch (e) {}
    renderFeed();
  }, 4500);

  function hasRunningBet() {
    return isSpinning || autoSpin;
  }

  function safeExitTo(url) {
    const msg = hasRunningBet()
      ? "⚠️ Aapka Spin / Auto-Spin abhi chal raha hai! Agar aap back jayenge toh aapka spin cancel/loss ho jayega.\n\nKya aap sach mein bahar nikalna chahte hain?"
      : "Kya aap Buffalo Gold Slot se bahar nikalna chahte hain?";
    if (confirm(msg)) {
      autoSpin = false;
      window.location.href = url;
    }
  }

  history.pushState(null, "", location.href);
  window.addEventListener("popstate", function () {
    const msg = hasRunningBet()
      ? "⚠️ Aapka Spin / Auto-Spin abhi chal raha hai! Back jaane par aapka spin cancel/loss ho jayega.\n\nKya aap sach mein back jaana chahte hain?"
      : "Kya aap Buffalo Gold Slot se bahar nikalna chahte hain?";
    if (confirm(msg)) {
      autoSpin = false;
      window.location.href = "game.html";
    } else {
      history.pushState(null, "", location.href);
    }
  });

  window.addEventListener("beforeunload", function (e) {
    if (hasRunningBet()) {
      e.preventDefault();
      e.returnValue = "";
    }
  });
</script>
</body>
</html>
