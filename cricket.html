<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cricket VIP Exchange - Buffalo Gold</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: radial-gradient(circle at top, #230436 0%, #0d0114 100%); color: #fff; display: flex; justify-content: center; padding-bottom: 85px; }
    .container { width: 100%; max-width: 430px; background: rgba(24, 3, 36, 0.96); min-height: 100vh; padding: 10px; box-shadow: 0 0 35px rgba(0,0,0,0.95); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: linear-gradient(135deg, #2d0742, #1a0326); padding: 10px 14px; border-radius: 14px; border: 1px solid rgba(255, 215, 0, 0.4); box-shadow: 0 4px 15px rgba(0,0,0,0.45); }
    .user-info h3 { font-size: 14px; color: #ffd700; letter-spacing: 0.3px; }
    .user-info span { font-size: 11px; color: #bbb; }
    .mini-wallet { text-align: right; cursor: pointer; background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 10px; border: 1px solid rgba(40, 224, 77, 0.35); }
    .mini-wallet div { font-size: 10px; color: #ccc; }
    .mini-wallet strong { font-size: 13px; color: #28e04d; }
    .hero-box { background: linear-gradient(135deg, #560e78 0%, #2a063b 60%, #190224 100%); border: 1.5px solid #ffd700; border-radius: 16px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 20px rgba(255, 215, 0, 0.14); }
    .hero-box h2 { font-size: 16px; color: #ffd700; margin-bottom: 3px; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
    .hero-box p { font-size: 11px; color: #e2e8f0; }
    .refresh-btn { background: linear-gradient(180deg, #ffe44d, #e6b800); color: #000; border: none; padding: 8px 12px; border-radius: 10px; font-weight: 900; font-size: 11px; cursor: pointer; box-shadow: 0 3px 10px rgba(255, 215, 0, 0.3); }
    .filter-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .f-tab { flex: 1; padding: 9px 4px; background: #260636; border: 1px solid #6b1d91; border-radius: 12px; color: #ccc; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.2s; }
    .f-tab.active { background: linear-gradient(180deg, #ffd700, #eab308); color: #000; border-color: #ffd700; box-shadow: 0 3px 12px rgba(255, 215, 0, 0.25); }
    .list-header { background: linear-gradient(90deg, #33094a, #220530); padding: 9px 12px; border-radius: 12px 12px 0 0; border: 1px solid #6b1d91; border-bottom: none; font-size: 12px; font-weight: 800; color: #ffd700; display: flex; justify-content: space-between; }
    .match-list-box { background: #1f042d; border: 1px solid #6b1d91; border-radius: 0 0 14px 14px; overflow: hidden; }
    .match-item { padding: 13px 12px; border-bottom: 1px solid #3c0c54; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.15s; }
    .match-item:last-child { border-bottom: none; }
    .match-item:active { background: #2e0842; }
    .m-left { flex: 1; padding-right: 10px; }
    .b-live { background: #28e04d; color: #000; font-size: 9px; font-weight: 900; padding: 2px 7px; border-radius: 5px; display: inline-flex; align-items: center; gap: 4px; }
    .b-up { background: #3b82f6; color: #fff; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 5px; }
    .b-done { background: #4b5563; color: #ffd700; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 5px; border: 1px solid rgba(255,215,0,0.3); }
    .m-title { font-size: 14px; font-weight: 800; color: #fff; margin: 5px 0 3px; }
    .m-score { font-size: 11px; color: #28e04d; font-weight: 700; }
    .open-pill { background: linear-gradient(180deg, #ffd700, #d97706); color: #000; font-size: 11px; font-weight: 900; padding: 7px 11px; border-radius: 9px; white-space: nowrap; }
    .empty-msg { padding: 28px 15px; text-align: center; color: #ccc; font-size: 13px; line-height: 1.5; }
    .wallet-toast { display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; background: linear-gradient(90deg, #16a34a, #15803d); border: 2px solid #ffd700; color: #fff; padding: 11px 14px; border-radius: 14px; z-index: 3000; font-size: 12px; font-weight: 800; box-shadow: 0 8px 25px rgba(0,0,0,0.75); text-align: center; }
    .wallet-toast.show { display: block; animation: popScale 0.25s ease; }
    @keyframes popScale { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; background: #1f042e; border-top: 1px solid #75229e; display: flex; justify-content: space-around; padding: 10px 0; z-index: 999; }
    .nav-item { text-align: center; color: #bbb; font-size: 11px; cursor: pointer; flex: 1; }
    .nav-item.active { color: #ffd700; font-weight: bold; }
  </style>
</head>
<body>
<div class="wallet-toast" id="walletToast">💰 Balance Credited!</div>
<div class="container">
  <div class="top-bar">
    <div class="user-info">
      <h3 id="userName">Player</h3>
      <span>📱 <span id="userMob">-</span></span>
    </div>
    <div class="mini-wallet" onclick="location.href='wallet.html'">
      <div>Deposit: <strong id="topDep">₹0</strong></div>
      <div>Winning: <strong id="topWin">₹0</strong></div>
    </div>
  </div>

  <div class="hero-box">
    <div>
      <h2>👑 Cricket VIP Exchange</h2>
      <p>Live Ball-by-Ball & Instant Payout</p>
    </div>
    <button class="refresh-btn" onclick="loadMatches()">🔄 Refresh</button>
  </div>

  <div class="filter-tabs">
    <button class="f-tab active" id="tabLive" onclick="setFilter('live', this)">🔴 Live (0)</button>
    <button class="f-tab" id="tabUp" onclick="setFilter('upcoming', this)">🕒 Upcoming (0)</button>
    <button class="f-tab" id="tabDone" onclick="setFilter('completed', this)">✅ Completed (0)</button>
  </div>

  <div class="list-header">
    <span id="listHeading">🔴 Live Matches</span>
    <span>Tap →</span>
  </div>
  <div class="match-list-box" id="matchListContainer">
    <div class="empty-msg">Live matches load ho rahe hain...</div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="location.href='game.html'">🎰<br>Games</div>
  <div class="nav-item active" onclick="loadMatches()">🏏<br>Cricket</div>
  <div class="nav-item" onclick="location.href='wallet.html'">💰<br>Wallet</div>
  <div class="nav-item" onclick="location.href='refer.html'">🎁<br>Refer</div>
  <div class="nav-item" onclick="location.href='profile.html'">👤<br>Profile</div>
</div>

<script>
  const WORKER_URL = "https://lingering-sun-3a12.dkdeepakverma143.workers.dev";
  const FB_URL = "https://coin-play-7ac49-default-rtdb.firebaseio.com";
  const mob = String(localStorage.getItem("activeUser") || "").trim();
  if (!mob) window.location.replace("index.html");

  let matches = [], overrides = {}, filterMode = "live";
  const completedCache = JSON.parse(localStorage.getItem("bg_done_matches") || "{}");

  function markMatchCompleted(id, statusText) {
    if (!id) return;
    completedCache[String(id)] = statusText || "Match Completed";
    localStorage.setItem("bg_done_matches", JSON.stringify(completedCache));
  }

  function notifyWalletCredit(title, bodyText) {
    const toast = document.getElementById("walletToast");
    toast.innerText = `${title} • ${bodyText}`;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 5500);
  }

  function renderUserBox(u, checkCredit) {
    if (!u) return;
    document.getElementById("userName").innerText = u.name || "Player";
    document.getElementById("userMob").innerText = mob || "-";
    const d = Number(u.depositBal ?? u.depositBalance ?? 0);
    const w = Number(u.winningBal ?? u.winningBalance ?? 0);
    document.getElementById("topDep").innerText = "₹" + d;
    document.getElementById("topWin").innerText = "₹" + w;
    if (checkCredit) {
      const kDep = "bg_last_dep_" + mob, kWin = "bg_last_win_" + mob;
      const pD = localStorage.getItem(kDep), pW = localStorage.getItem(kWin);
      if (pD !== null && d > Number(pD)) notifyWalletCredit("💰 Deposit Credited!", `₹${(d - Number(pD)).toFixed(2).replace(/\.00$/, "")} add!`);
      if (pW !== null && w > Number(pW)) notifyWalletCredit("🏆 Winning Credited!", `₹${(w - Number(pW)).toFixed(2).replace(/\.00$/, "")} add!`);
      localStorage.setItem(kDep, String(d));
      localStorage.setItem(kWin, String(w));
    }
  }
  try { renderUserBox(JSON.parse(localStorage.getItem("cachedUser") || "{}"), false); } catch (e) {}

  async function syncUserWallet() {
    if (!mob) return;
    try {
      const r = await fetch(`${FB_URL}/users/${mob}.json?t=${Date.now()}`);
      const u = await r.json();
      if (u) {
        localStorage.setItem("cachedUser", JSON.stringify(u));
        renderUserBox(u, true);
      }
    } catch (e) {}
  }

  function formatIstTime(ms) {
    const dt = new Date(ms);
    if (isNaN(dt.getTime())) return "";
    const now = new Date(), tmrw = new Date(now.getTime() + 86400000);
    const dayTag = dt.toDateString() === now.toDateString() ? "Today" :
                   dt.toDateString() === tmrw.toDateString() ? "Tomorrow" :
                   dt.toLocaleDateString("en-IN", { day: "numeric", month: "short", timeZone: "Asia/Kolkata" });
    const timeStr = dt.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true, timeZone: "Asia/Kolkata" }).toUpperCase();
    return `🕒 ${dayTag}, ${timeStr} IST`;
  }

  function parseCricbuzzListHtml(html, sourceHint = "live") {
    const seenIds = new Set(), seenTitles = new Set(), list = [], startMap = {}, rawMsMap = {};
    if (!html || typeof html !== "string") return list;

    for (const tm of html.matchAll(/"matchId"\s*:\s*"?(\d+)"?[\s\S]{0,700}?"startDate"\s*:\s*"?(\d{10,13})"?/g)) {
      if (startMap[tm[1]]) continue;
      let ms = Number(tm[2]);
      if (ms < 1e12) ms *= 1000;
      rawMsMap[tm[1]] = ms;
      const formatted = formatIstTime(ms);
      if (formatted) startMap[tm[1]] = formatted;
    }

    const linkRx = /href="\/(?:live-cricket-scores|cricket-scores)\/(\d+)\/([^"?#]+)"/g;
    let m;
    while ((m = linkRx.exec(html)) !== null) {
      const mId = String(m[1]);
      if (seenIds.has(mId)) continue;
      seenIds.add(mId);

      const title = m[2].replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase()).trim();
      const titleKey = title.toLowerCase().replace(/\s+/g, " ");
      if (seenTitles.has(titleKey)) continue;
      seenTitles.add(titleKey);

      const rest = html.slice(m.index + m[0].length);
      const nextLinkPos = rest.search(/href="\/(?:live-cricket-scores|cricket-scores)\/\d+\//);
      const sliceLen = nextLinkPos > 0 ? Math.min(950, nextLinkPos + m[0].length) : 700;
      const sub = html.slice(m.index, m.index + sliceLen)
        .replace(/<[^>]+>/g, " ")
        .replace(/&amp;/g, "&")
        .replace(/&#x27;/g, "'")
        .replace(/\s+/g, " ")
        .trim();

      const scores = sub.match(/\b[A-Z]{2,6}\s*\d+(?:\s*[-\/]\s*\d+)?(?:\s*\(\s*\d+(?:\.\d+)?(?:\s*Ovs?)?\s*\))?/g) || [];
      const isDoneText = /\b(match drawn|won by \d+\s+(?:runs?|wkts?|wickets?)|abandoned|match tied|no result)\b/i.test(sub);
      const isLiveKeyword = /\b(innings break|need \d+ runs|trail by|lead by|opt to|elected to|day \d+|stumps|lunch|tea|rain stops play|toss)\b/i.test(sub);
      const rawStartMs = rawMsMap[mId] || 0;
      const nowMs = Date.now();
      const isFutureStart = rawStartMs > (nowMs + 180000);
      const isPastStart = rawStartMs > 0 && rawStartMs <= (nowMs + 180000);

      let type = sourceHint;
      if (isDoneText || sourceHint === "completed" || completedCache[mId]) {
        type = "completed";
      } else if (scores.length > 0 || isLiveKeyword) {
        type = "live";
      } else if (sourceHint === "upcoming" || isFutureStart) {
        type = "upcoming";
      } else if (isPastStart) {
        type = "live";
      } else {
        type = "upcoming";
      }

      const stM = sub.match(/(Match drawn|Match tied|No result|Match abandoned|[A-Za-z][A-Za-z0-9\s]{1,32}?won by\s+\d+\s+(?:runs?|wkts?|wickets?)|[A-Za-z][A-Za-z\s]{1,22}(?:need|trail by|lead by)\s+\d+\s+runs?|Day\s*\d+:\s*(?:Stumps|Lunch|Tea|Innings Break)|Innings Break|[A-Za-z\s]{2,24}\s+opt to\s+(?:bat|bowl))/i);
      const textTimeM = sub.match(/((?:Today|Tomorrow|[A-Z][a-z]{2}\s+\d{1,2})\s*,?\s*\d{1,2}:\d{2}\s*(?:AM|PM)\s*(?:IST|GMT)?)/i);
      const exactStartTime = startMap[mId] || (textTimeM ? `🕒 ${textTimeM[1].trim()}` : "");
      const rawStatus = stM ? stM[1].replace(/^.*?\b(?:Full Commentary|Commentary|Scorecard|Squads|Highlights|News|Photos|Videos|Live Cricket Score)\b\s*/gi, "").trim() : "";

      const cleanStatus = type === "upcoming"
        ? (exactStartTime || "🕒 Upcoming Match")
        : (rawStatus || (type === "completed" ? (completedCache[mId] || "Match Completed") : "Live In Progress"));

      list.push({
        id: mId,
        title,
        scores,
        status: cleanStatus,
        startMs: rawStartMs || 9999999999999,
        type
      });
    }
    return list;
  }

  async function loadMatches() {
    try {
      const [rLive, rUp, rRec, rC] = await Promise.all([
        fetch(`${WORKER_URL}?t=${Date.now()}`).catch(() => null),
        fetch(`${WORKER_URL}?type=upcoming&t=${Date.now()}`).catch(() => null),
        fetch(`${WORKER_URL}?type=recent&t=${Date.now()}`).catch(() => null),
        fetch(`${FB_URL}/cricketControls.json?t=${Date.now()}`).catch(() => null)
      ]);

      overrides = (rC && rC.ok ? await rC.json() : {}) || {};

      const liveHtml = rLive && rLive.ok ? await rLive.text() : "";
      const upHtml = rUp && rUp.ok ? await rUp.text() : "";
      const recHtml = rRec && rRec.ok ? await rRec.text() : "";

      const liveList = parseCricbuzzListHtml(liveHtml, "live");
      const upList = parseCricbuzzListHtml(upHtml, "upcoming");
      const recList = parseCricbuzzListHtml(recHtml, "completed");

      const mergedMap = new Map();

      // 1. Live & Mixed Homepage Matches
      liveList.forEach(m => {
        if (m.type === "completed") markMatchCompleted(m.id, m.status);
        mergedMap.set(String(m.id), m);
      });

      // 2. Upcoming Matches (Auto-promote to Live if start time passed or already in liveList)
      upList.forEach(m => {
        if (!mergedMap.has(String(m.id))) {
          mergedMap.set(String(m.id), m);
        }
      });

      // 3. Completed / Recent Matches
      recList.forEach(m => {
        m.type = "completed";
        markMatchCompleted(m.id, m.status);
        if (!mergedMap.has(String(m.id))) {
          mergedMap.set(String(m.id), m);
        } else {
          const ex = mergedMap.get(String(m.id));
          ex.type = "completed";
          if (m.status) ex.status = m.status;
        }
      });

      const finalMatches = Array.from(mergedMap.values());
      if (finalMatches.length > 0) {
        matches = finalMatches;
        updateTabCounts();
        renderList();
      } else {
        document.getElementById("matchListContainer").innerHTML = `<div class="empty-msg">Abhi koi match available nahi hai. Refresh dabayein.</div>`;
      }
    } catch (e) {
      if (!matches.length) {
        document.getElementById("matchListContainer").innerHTML = `<div class="empty-msg">Worker connect ho raha hai... Refresh dabayein.</div>`;
      }
    }
  }

  function updateTabCounts() {
    const cLive = matches.filter(m => m.type === "live").length;
    const cUp = matches.filter(m => m.type === "upcoming").length;
    const cDone = matches.filter(m => m.type === "completed").length;
    document.getElementById("tabLive").innerText = `🔴 Live (${cLive})`;
    document.getElementById("tabUp").innerText = `🕒 Upcoming (${cUp})`;
    document.getElementById("tabDone").innerText = `✅ Done (${cDone})`;
  }

  function setFilter(mode, btn) {
    filterMode = mode;
    document.querySelectorAll(".f-tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("listHeading").innerText =
      mode === "live" ? "🔴 Live Matches" :
      mode === "upcoming" ? "🕒 Upcoming Schedule (IST)" :
      "✅ Completed Matches";
    renderList();
  }

  function renderList() {
    const box = document.getElementById("matchListContainer");
    let list = matches.filter(m => m.type === filterMode);
    if (filterMode === "upcoming") {
      list.sort((a, b) => (a.startMs || 0) - (b.startMs || 0));
    }

    if (!list.length) {
      box.innerHTML = `<div class="empty-msg">Is category mein abhi koi match nahi hai.</div>`;
      return;
    }

    box.innerHTML = list.map(m => {
      const ov = overrides[m.id] || {};
      const sc = (ov.liveRuns ? `${ov.liveRuns} (${ov.liveOvers || "0.0"} Ov)` : "") || (m.scores.length ? m.scores.join(" | ") : m.status);
      const badge = m.type === "live" ? `<span class="b-live">● LIVE</span>` : m.type === "upcoming" ? `<span class="b-up">UPCOMING</span>` : `<span class="b-done">COMPLETED</span>`;
      const c = m.type === "completed" ? "#ffd700" : m.type === "upcoming" ? "#93c5fd" : "#28e04d";
      return `<div class="match-item" onclick="openMatchPage('${m.id}')">
        <div class="m-left">
          ${badge}
          <div class="m-title">${m.title}</div>
          <div class="m-score" style="color:${c};">${sc}</div>
        </div>
        <div class="open-pill">${m.type === "completed" ? "Result →" : "Play →"}</div>
      </div>`;
    }).join("");
  }

  function openMatchPage(id) {
    const m = matches.find(x => String(x.id) === String(id));
    if (!m) return;
    localStorage.setItem("bg_selected_match", JSON.stringify(m));
    const q = new URLSearchParams({
      id: String(m.id),
      title: m.title,
      type: m.type,
      status: m.status || ""
    });
    window.location.href = `match.html?${q.toString()}`;
  }

  syncUserWallet();
  loadMatches();
  setInterval(() => {
    syncUserWallet();
    loadMatches();
  }, 6000);
</script>
</body>
</html>
