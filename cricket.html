<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Cricket Exchange - Buffalo Gold</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #12021a; color: #fff; display: flex; justify-content: center; padding-bottom: 85px; }
    .container { width: 100%; max-width: 430px; background: #1b0429; min-height: 100vh; padding: 12px; }

    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: #260636; padding: 10px 14px; border-radius: 14px; border: 1px solid #75229e; }
    .user-info h3 { font-size: 14px; color: #ffd700; }
    .user-info span { font-size: 11px; color: #aaa; }
    .mini-wallet { text-align: right; cursor: pointer; }
    .mini-wallet div { font-size: 11px; color: #ccc; }
    .mini-wallet strong { font-size: 13px; color: #28e04d; }

    /* Live Scoreboard */
    .live-score-card {
      background: linear-gradient(145deg, #2d0740, #160221);
      border: 2px solid #ffd700;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.18);
    }

    .score-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: #28e04d; text-transform: uppercase; }
    .blink-dot { width: 8px; height: 8px; background: #28e04d; border-radius: 50%; animation: blink 1.2s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .crr-tag { font-size: 11px; color: #ffd700; background: rgba(255,215,0,0.12); padding: 2px 8px; border-radius: 6px; font-weight: 700; }

    .teams-score { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .team-box { flex: 1; padding-right: 10px; }
    .team-box h4 { font-size: 15px; color: #fff; margin-bottom: 3px; }
    .team-box p { font-size: 11px; color: #bbb; }
    .big-score { text-align: right; }
    .big-score .runs { font-size: 20px; font-weight: 900; color: #ffd700; }
    .big-score .overs { font-size: 11px; color: #ddd; margin-top: 2px; }

    .inning-row {
      display: flex;
      justify-content: space-between;
      background: #14021f;
      border: 1px solid #59167a;
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .inning-row strong { color: #ffd700; }

    .comm-box { font-size: 11px; color: #e5e7eb; background: #240533; padding: 7px 10px; border-radius: 6px; border-left: 3px solid #28e04d; margin-top: 6px; }

    /* Filter Tabs */
    .sports-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 8px 6px; background: #260636; border: 1px solid #6b1d91; border-radius: 10px; color: #ccc; font-size: 12px; font-weight: 700; cursor: pointer; }
    .tab-btn.active { background: #ffd700; color: #000; border-color: #ffd700; }

    /* Section Header */
    .section-bar { background: #260636; padding: 8px 12px; border-radius: 10px 10px 0 0; border: 1px solid #6b1d91; border-bottom: none; font-size: 12px; font-weight: 700; color: #ffd700; display: flex; justify-content: space-between; }
    .odds-labels { display: flex; gap: 38px; padding-right: 14px; }

    /* Match List */
    .match-list { background: #220530; border: 1px solid #6b1d91; border-radius: 0 0 12px 12px; overflow: hidden; }
    .match-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #3c0c54; cursor: pointer; }
    .match-row:last-child { border-bottom: none; }
    .match-row.selected-match { background: #310845; }
    .match-info { flex: 1; padding-right: 8px; }
    .match-status { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
    .badge-live { background: #28e04d; color: #000; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 4px; }
    .badge-upcoming { background: #3b82f6; color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
    .badge-ended { background: #6b7280; color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
    .match-time { font-size: 10px; color: #aaa; }
    .match-title { font-size: 13px; font-weight: 700; color: #fff; }
    .match-series { font-size: 11px; color: #28e04d; margin-top: 2px; font-weight: 600; }

    /* Odds Boxes */
    .odds-group { display: flex; gap: 5px; }
    .odd-box { width: 52px; height: 38px; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
    .odd-back { background: #72bbef; color: #000; }
    .odd-lay { background: #faa9ba; color: #000; }
    .odd-val { font-size: 13px; font-weight: 800; }
    .odd-vol { font-size: 9px; opacity: 0.85; }

    /* Empty / Setup Message */
    .info-empty { padding: 24px 14px; text-align: center; color: #ccc; font-size: 13px; line-height: 1.5; }

    /* Bet Slip */
    .bet-modal { display: none; position: fixed; bottom: 58px; width: 100%; max-width: 430px; background: #260636; border-top: 2px solid #ffd700; padding: 14px; z-index: 1000; box-shadow: 0 -6px 20px rgba(0,0,0,0.6); }
    .bet-modal.open { display: block; }
    .bet-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
    .bet-input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #75229e; background: #12021a; color: #fff; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    .quick-stakes { display: flex; gap: 6px; margin-bottom: 10px; }
    .stake-chip { flex: 1; background: #3b0a52; color: #ffd700; border: 1px solid #75229e; padding: 6px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .bet-actions { display: flex; gap: 8px; }
    .btn-cancel { flex: 1; padding: 10px; background: #4b5563; color: #fff; border: none; border-radius: 8px; font-weight: 700; }
    .btn-place { flex: 2; padding: 10px; background: #28e04d; color: #000; border: none; border-radius: 8px; font-weight: 800; }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; background: #1f042e; border-top: 1px solid #75229e; display: flex; justify-content: space-around; padding: 10px 0; z-index: 999; }
    .nav-item { text-align: center; color: #bbb; text-decoration: none; font-size: 11px; cursor: pointer; flex: 1; }
    .nav-item.active { color: #ffd700; font-weight: bold; }
    .nav-icon { font-size: 19px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <div class="user-info">
      <h3 id="userName">Player</h3>
      <span>📱 <span id="userMob">-</span></span>
    </div>
    <div class="mini-wallet" onclick="location.href='wallet.html'">
      <div>Deposit: <strong id="topDep">₹0</strong></div>
      <div>Winning: <strong id="topWin">₹0</strong></div>
    </div>
  </div>

  <!-- Real Live Scoreboard -->
  <div class="live-score-card" id="scoreCard">
    <div class="score-top">
      <div class="live-indicator"><span class="blink-dot"></span> <span id="liveStatusText">REAL LIVE SCORE</span></div>
      <div class="crr-tag" id="matchTypeTag">CRICKET</div>
    </div>

    <div class="teams-score">
      <div class="team-box">
        <h4 id="scoreMatchTitle">Loading Real Matches...</h4>
        <p id="scoreVenueText">Fetching live data from server</p>
      </div>
      <div class="big-score">
        <div class="runs" id="scoreMainRuns">--/--</div>
        <div class="overs" id="scoreMainOvers">-- Ov</div>
      </div>
    </div>

    <div id="inningsContainer"></div>

    <div class="comm-box" id="commText">
      Real match status yahan update hoga...
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="sports-tabs">
    <button class="tab-btn active" onclick="filterMatches('all', this)">🏏 All Matches</button>
    <button class="tab-btn" onclick="filterMatches('live', this)">🔴 Live Now</button>
    <button class="tab-btn" onclick="filterMatches('upcoming', this)">🕒 Upcoming</button>
    <button class="tab-btn" onclick="fetchRealMatches()">🔄 Refresh</button>
  </div>

  <div class="section-bar">
    <span>Real Cricket Matches</span>
    <div class="odds-labels">
      <span>Back</span>
      <span>Lay</span>
    </div>
  </div>

  <div class="match-list" id="matchContainer">
    <div class="info-empty">Live matches load ho rahe hain...</div>
  </div>
</div>

<!-- Bet Slip -->
<div class="bet-modal" id="betModal">
  <div class="bet-header">
    <span id="betMatchTitle">Match</span>
    <span id="betTypeTag" style="color:#ffd700;">BACK @ 1.80</span>
  </div>
  <input type="number" class="bet-input" id="stakeInput" value="100" placeholder="Enter Stake (Min ₹100)" />
  <div class="quick-stakes">
    <button class="stake-chip" onclick="setStake(100)">+100</button>
    <button class="stake-chip" onclick="setStake(500)">+500</button>
    <button class="stake-chip" onclick="setStake(1000)">+1K</button>
    <button class="stake-chip" onclick="setStake(5000)">+5K</button>
  </div>
  <div class="bet-actions">
    <button class="btn-cancel" onclick="closeBetSlip()">Cancel</button>
    <button class="btn-place" onclick="confirmBet()">Place Bet</button>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="location.href='game.html'"><span class="nav-icon">🎰</span>Games</div>
  <div class="nav-item active" onclick="location.href='cricket.html'"><span class="nav-icon">🏏</span>Cricket</div>
  <div class="nav-item" onclick="location.href='wallet.html'"><span class="nav-icon">💰</span>Wallet</div>
  <div class="nav-item" onclick="location.href='refer.html'"><span class="nav-icon">🎁</span>Refer</div>
  <div class="nav-item" onclick="location.href='profile.html'"><span class="nav-icon">👤</span>Profile</div>
</div>

<script>
  // ============================================================
  // YAHAN APNI CRICKETDATA.ORG (CRICAPI) KI FREE API KEY DALEIN:
  const CRIC_API_KEY = "YAHAN_APNI_KEY_DALEIN";
  // ============================================================

  const mobile = localStorage.getItem("activeUser");
  if (!mobile) window.location.replace("index.html");

  let userBal = 0;
  try {
    const cached = JSON.parse(localStorage.getItem("cachedUser") || "{}");
    if (cached && cached.name) {
      document.getElementById("userName").innerText = cached.name;
      document.getElementById("userMob").innerText = mobile;
      const dep = Number(cached.depositBal ?? cached.depositBalance ?? 0);
      const win = Number(cached.winningBal ?? cached.winningBalance ?? 0);
      userBal = dep + win;
      document.getElementById("topDep").innerText = "₹" + dep;
      document.getElementById("topWin").innerText = "₹" + win;
    }
  } catch (e) {}

  let allMatches = [];
  let currentFilter = "all";
  let selectedMatchId = null;
  let selectedBet = null;

  async function fetchRealMatches() {
    const container = document.getElementById("matchContainer");

    if (!CRIC_API_KEY || CRIC_API_KEY === "b10ae8c8-70d1-442e-b709-98e66298e902") {
      document.getElementById("scoreMatchTitle").innerText = "API Key Required";
      document.getElementById("scoreVenueText").innerText = "cricketdata.org se free key lekar code mein dalein";
      document.getElementById("commText").innerText = "Abhi koi fake match nahi chalaya gaya hai. Free API key dalte hi 100% real live score aur ball-by-ball overs dikhenge.";
      container.innerHTML = `<div class="info-empty">⚠️ <b>Real Live Score Setup:</b><br>1. <b>cricketdata.org</b> par free account banayein.<br>2. Wahan se apni <b>API Key</b> copy karein.<br>3. <code>cricket.html</code> mein <code>CRIC_API_KEY</code> ki jagah paste karke save karein.</div>`;
      return;
    }

    try {
      const res = await fetch(`https://api.cricapi.com/v1/currentMatches?apikey=${CRIC_API_KEY}&offset=0`);
      const json = await res.json();

      if (json.status !== "success" || !json.data) {
        container.innerHTML = `<div class="info-empty">API Limit poori ho gayi ya invalid key hai. CricketData dashboard check karein.</div>`;
        return;
      }

      allMatches = json.data.map((m, idx) => {
        const isLive = m.matchStarted && !m.matchEnded;
        const isUpcoming = !m.matchStarted;
        // Deterministic realistic odds based on match id
        const baseOdd = (1.70 + ((idx % 5) * 0.08)).toFixed(2);
        const layOdd = (parseFloat(baseOdd) + 0.02).toFixed(2);

        return {
          id: m.id,
          name: m.name || "Cricket Match",
          matchType: (m.matchType || "T20").toUpperCase(),
          status: m.status || "",
          venue: m.venue || "International Venue",
          date: m.date || "",
          isLive,
          isUpcoming,
          matchEnded: m.matchEnded,
          score: m.score || [],
          back: baseOdd,
          lay: layOdd
        };
      });

      // Live matches ko sabse upar rakhein
      allMatches.sort((a, b) => (b.isLive === a.isLive) ? 0 : b.isLive ? 1 : -1);

      if (allMatches.length > 0) {
        const active = allMatches.find(x => x.id === selectedMatchId) || allMatches[0];
        updateScoreboard(active);
      }

      renderMatches();
    } catch (err) {
      container.innerHTML = `<div class="info-empty">Internet ya API connection error. Refresh button dabayein.</div>`;
    }
  }

  function updateScoreboard(m) {
    selectedMatchId = m.id;
    document.getElementById("scoreMatchTitle").innerText = m.name;
    document.getElementById("scoreVenueText").innerText = m.venue;
    document.getElementById("matchTypeTag").innerText = m.matchType;
    document.getElementById("liveStatusText").innerText = m.isLive ? "LIVE MATCH" : m.isUpcoming ? "UPCOMING" : "COMPLETED";
    document.getElementById("commText").innerText = m.status || "Match details updated.";

    const innDiv = document.getElementById("inningsContainer");
    innDiv.innerHTML = "";

    if (m.score && m.score.length > 0) {
      const latest = m.score[m.score.length - 1];
      document.getElementById("scoreMainRuns").innerText = `${latest.r}/${latest.w}`;
      document.getElementById("scoreMainOvers").innerText = `(${latest.o} Ov)`;

      m.score.forEach(s => {
        const row = document.createElement("div");
        row.className = "inning-row";
        row.innerHTML = `<span>${s.inning}</span><strong>${s.r}/${s.w} (${s.o} Ov)</strong>`;
        innDiv.appendChild(row);
      });
    } else {
      document.getElementById("scoreMainRuns").innerText = m.isUpcoming ? "SOON" : "--/--";
      document.getElementById("scoreMainOvers").innerText = m.date;
    }
  }

  function renderMatches() {
    const container = document.getElementById("matchContainer");
    container.innerHTML = "";

    const filtered = allMatches.filter(m => {
      if (currentFilter === "live") return m.isLive;
      if (currentFilter === "upcoming") return m.isUpcoming;
      return true;
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div class="info-empty">Is category mein abhi koi match nahi chal raha hai.</div>`;
      return;
    }

    filtered.forEach(m => {
      const row = document.createElement("div");
      row.className = "match-row" + (m.id === selectedMatchId ? " selected-match" : "");
      row.onclick = (e) => {
        if (!e.target.closest(".odd-box")) {
          updateScoreboard(m);
          renderMatches();
          document.getElementById("scoreCard").scrollIntoView({ behavior: "smooth" });
        }
      };

      const badge = m.isLive
        ? `<span class="badge-live">LIVE</span>`
        : m.isUpcoming
        ? `<span class="badge-upcoming">UPCOMING</span>`
        : `<span class="badge-ended">ENDED</span>`;

      const scoreSummary = (m.score && m.score.length > 0)
        ? m.score.map(s => `${s.r}/${s.w} (${s.o})`).join(" | ")
        : m.status;

      row.innerHTML = `
        <div class="match-info">
          <div class="match-status">
            ${badge}
            <span class="match-time">${m.matchType} • ${m.date}</span>
          </div>
          <div class="match-title">${m.name}</div>
          <div class="match-series">${scoreSummary}</div>
        </div>
        <div class="odds-group">
          <div class="odd-box odd-back" onclick="openBetSlip('${m.name.replace(/'/g, "")}', 'BACK', '${m.back}')">
            <span class="odd-val">${m.back}</span>
            <span class="odd-vol">BACK</span>
          </div>
          <div class="odd-box odd-lay" onclick="openBetSlip('${m.name.replace(/'/g, "")}', 'LAY', '${m.lay}')">
            <span class="odd-val">${m.lay}</span>
            <span class="odd-vol">LAY</span>
          </div>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function filterMatches(type, btn) {
    currentFilter = type;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderMatches();
  }

  function openBetSlip(title, side, odd) {
    selectedBet = { title, side, odd };
    document.getElementById("betMatchTitle").innerText = title;
    document.getElementById("betTypeTag").innerText = `${side} @ ${odd}`;
    document.getElementById("betModal").classList.add("open");
  }

  function closeBetSlip() {
    document.getElementById("betModal").classList.remove("open");
  }

  function setStake(val) {
    document.getElementById("stakeInput").value = val;
  }

  function confirmBet() {
    const stake = Number(document.getElementById("stakeInput").value);
    if (!stake || stake < 100) {
      alert("Minimum bet ₹100 hai!");
      return;
    }
    if (stake > userBal) {
      alert("Insufficient balance! Pehle Wallet mein deposit karein.");
      location.href = "wallet.html";
      return;
    }
    alert(`Bet Placed!\n${selectedBet.title}\n${selectedBet.side} @ ${selectedBet.odd} | Stake: ₹${stake}`);
    closeBetSlip();
  }

  // Real data load karein aur har 20 second mein refresh karein
  fetchRealMatches();
  setInterval(fetchRealMatches, 20000);
</script>
</body>
</html>
