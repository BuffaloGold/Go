<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cricket Exchange - Buffalo Gold</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #12021a; color: #fff; display: flex; justify-content: center; padding-bottom: 80px; }
    .container { width: 100%; max-width: 430px; background: #1b0429; min-height: 100vh; padding: 12px; }

    /* Top Bar matching game.html */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: #260636; padding: 10px 14px; border-radius: 14px; border: 1px solid #75229e; }
    .user-info h3 { font-size: 14px; color: #ffd700; }
    .user-info span { font-size: 11px; color: #aaa; }
    .mini-wallet { text-align: right; cursor: pointer; }
    .mini-wallet div { font-size: 11px; color: #ccc; }
    .mini-wallet strong { font-size: 13px; color: #28e04d; }

    /* Banner */
    .promo-banner { background: linear-gradient(135deg, #4a0d66, #2d0842); border: 1.5px solid #ffd700; border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .promo-banner h2 { color: #ffd700; font-size: 16px; margin-bottom: 2px; }
    .promo-banner p { font-size: 11px; color: #ddd; }
    .live-pill { background: #28e04d; color: #000; font-weight: 800; font-size: 11px; padding: 5px 9px; border-radius: 8px; }

    /* Sports Tabs */
    .sports-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 8px 6px; background: #260636; border: 1px solid #6b1d91; border-radius: 10px; color: #ccc; font-size: 12px; font-weight: 700; cursor: pointer; }
    .tab-btn.active { background: #ffd700; color: #000; border-color: #ffd700; }

    /* Section Header */
    .section-bar { background: #260636; padding: 8px 12px; border-radius: 10px 10px 0 0; border: 1px solid #6b1d91; border-bottom: none; font-size: 12px; font-weight: 700; color: #ffd700; display: flex; justify-content: space-between; }
    .odds-labels { display: flex; gap: 38px; padding-right: 14px; }

    /* Match List (No Casino Grid Below) */
    .match-list { background: #220530; border: 1px solid #6b1d91; border-radius: 0 0 12px 12px; overflow: hidden; }
    .match-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #3c0c54; }
    .match-row:last-child { border-bottom: none; }
    .match-info { flex: 1; padding-right: 8px; }
    .match-status { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
    .badge-live { background: #28e04d; color: #000; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 4px; }
    .badge-upcoming { background: #3b82f6; color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
    .badge-fancy { background: rgba(255, 215, 0, 0.15); color: #ffd700; border: 1px solid #ffd700; font-size: 9px; padding: 0 4px; border-radius: 4px; }
    .match-time { font-size: 10px; color: #aaa; }
    .match-title { font-size: 13px; font-weight: 700; color: #fff; }
    .match-series { font-size: 10px; color: #bbb; margin-top: 2px; }

    /* Odds Boxes */
    .odds-group { display: flex; gap: 5px; }
    .odd-box { width: 52px; height: 38px; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
    .odd-back { background: #72bbef; color: #000; }
    .odd-lay { background: #faa9ba; color: #000; }
    .odd-val { font-size: 13px; font-weight: 800; }
    .odd-vol { font-size: 9px; opacity: 0.85; }

    /* Bet Slip */
    .bet-modal { display: none; position: fixed; bottom: 58px; width: 100%; max-width: 430px; background: #260636; border-top: 2px solid #ffd700; padding: 14px; z-index: 1000; box-shadow: 0 -6px 20px rgba(0,0,0,0.6); }
    .bet-modal.open { display: block; }
    .bet-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
    .bet-input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #75229e; background: #12021a; color: #fff; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    .quick-stakes { display: flex; gap: 6px; margin-bottom: 10px; }
    .stake-chip { flex: 1; background: #3b0a52; color: #ffd700; border: 1px solid #75229e; padding: 6px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .bet-actions { display: flex; gap: 8px; }
    .btn-cancel { flex: 1; padding: 10px; background: #4b5563; color: #fff; border: none; border-radius: 8px; font-weight: 700; }
    .btn-place { flex: 2; padding: 10px; background: #28e04d; color: #000; border: none; border-radius: 8px; font-weight: 800; }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; background: #1f042e; border-top: 1px solid #75229e; display: flex; justify-content: space-around; padding: 10px 0; z-index: 999; }
    .nav-item { text-align: center; color: #bbb; text-decoration: none; font-size: 11px; cursor: pointer; flex: 1; }
    .nav-item.active { color: #ffd700; font-weight: bold; }
    .nav-icon { font-size: 19px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <div class="user-info">
      <h3 id="userName">Player</h3>
      <span>📱 <span id="userMob">-</span></span>
    </div>
    <div class="mini-wallet" onclick="location.href='wallet.html'">
      <div>Deposit: <strong id="topDep">₹0</strong></div>
      <div>Winning: <strong id="topWin">₹0</strong></div>
    </div>
  </div>

  <div class="promo-banner">
    <div>
      <h2>🏏 Cricket Exchange</h2>
      <p>Match Winner • Session • Fancy Odds</p>
    </div>
    <div class="live-pill">IN-PLAY</div>
  </div>

  <div class="sports-tabs">
    <button class="tab-btn active" onclick="filterSport('all', this)">🔥 All</button>
    <button class="tab-btn" onclick="filterSport('cricket', this)">🏏 Cricket</button>
    <button class="tab-btn" onclick="filterSport('soccer', this)">⚽ Soccer</button>
    <button class="tab-btn" onclick="filterSport('tennis', this)">🎾 Tennis</button>
  </div>

  <div class="section-bar">
    <span>Matches</span>
    <div class="odds-labels">
      <span>Back</span>
      <span>Lay</span>
    </div>
  </div>

  <div class="match-list" id="matchContainer"></div>
</div>

<!-- Bet Slip -->
<div class="bet-modal" id="betModal">
  <div class="bet-header">
    <span id="betMatchTitle">Match</span>
    <span id="betTypeTag" style="color:#ffd700;">BACK @ 1.80</span>
  </div>
  <input type="number" class="bet-input" id="stakeInput" value="100" placeholder="Enter Stake (Min ₹100)" />
  <div class="quick-stakes">
    <button class="stake-chip" onclick="setStake(100)">+100</button>
    <button class="stake-chip" onclick="setStake(500)">+500</button>
    <button class="stake-chip" onclick="setStake(1000)">+1K</button>
    <button class="stake-chip" onclick="setStake(5000)">+5K</button>
  </div>
  <div class="bet-actions">
    <button class="btn-cancel" onclick="closeBetSlip()">Cancel</button>
    <button class="btn-place" onclick="confirmBet()">Place Bet</button>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="location.href='game.html'"><span class="nav-icon">🎰</span>Games</div>
  <div class="nav-item active" onclick="location.href='cricket.html'"><span class="nav-icon">🏏</span>Cricket</div>
  <div class="nav-item" onclick="location.href='wallet.html'"><span class="nav-icon">💰</span>Wallet</div>
  <div class="nav-item" onclick="location.href='refer.html'"><span class="nav-icon">🎁</span>Refer</div>
  <div class="nav-item" onclick="location.href='profile.html'"><span class="nav-icon">👤</span>Profile</div>
</div>

<script>
  const mobile = localStorage.getItem("activeUser");
  if (!mobile) window.location.replace("index.html");

  let userBal = 0;
  try {
    const cached = JSON.parse(localStorage.getItem("cachedUser") || "{}");
    if (cached && cached.name) {
      document.getElementById("userName").innerText = cached.name;
      document.getElementById("userMob").innerText = mobile;
      const dep = Number(cached.depositBal ?? cached.depositBalance ?? 0);
      const win = Number(cached.winningBal ?? cached.winningBalance ?? 0);
      userBal = dep + win;
      document.getElementById("topDep").innerText = "₹" + dep;
      document.getElementById("topWin").innerText = "₹" + win;
    }
  } catch (e) {}

  const matchesData = [
    { sport: "cricket", live: true, fancy: true, time: "In-Play • 14.2 Ov", title: "India v Australia", series: "T20 International Series", back: "1.78", bVol: "45K", lay: "1.80", lVol: "32K" },
    { sport: "cricket", live: true, fancy: true, time: "In-Play • 8.4 Ov", title: "Mumbai Indians v Chennai Super Kings", series: "Indian Premier League", back: "1.92", bVol: "80K", lay: "1.94", lVol: "61K" },
    { sport: "cricket", live: true, fancy: true, time: "In-Play • 2nd Inn", title: "England v South Africa", series: "ODI Series", back: "2.10", bVol: "24K", lay: "2.14", lVol: "19K" },
    { sport: "cricket", live: false, fancy: true, time: "Today, 7:30 PM", title: "RCB v Kolkata Knight Riders", series: "Indian Premier League", back: "1.86", bVol: "50K", lay: "1.88", lVol: "42K" },
    { sport: "soccer", live: true, fancy: false, time: "In-Play • 64'", title: "Real Madrid v FC Barcelona", series: "La Liga", back: "2.05", bVol: "30K", lay: "2.08", lVol: "28K" },
    { sport: "tennis", live: true, fancy: false, time: "In-Play • Set 2", title: "Carlos Alcaraz v Jannik Sinner", series: "ATP Masters", back: "1.72", bVol: "22K", lay: "1.75", lVol: "20K" }
  ];

  let selectedBet = null;

  function renderMatches(filter = "all") {
    const container = document.getElementById("matchContainer");
    container.innerHTML = "";
    matchesData.filter(m => filter === "all" || m.sport === filter).forEach(m => {
      const row = document.createElement("div");
      row.className = "match-row";
      row.innerHTML = `
        <div class="match-info">
          <div class="match-status">
            ${m.live ? '<span class="badge-live">LIVE</span>' : '<span class="badge-upcoming">UPCOMING</span>'}
            ${m.fancy ? '<span class="badge-fancy">BM | FANCY</span>' : ''}
            <span class="match-time">${m.time}</span>
          </div>
          <div class="match-title">${m.title}</div>
          <div class="match-series">${m.series}</div>
        </div>
        <div class="odds-group">
          <div class="odd-box odd-back" onclick="openBetSlip('${m.title}', 'BACK', '${m.back}')">
            <span class="odd-val">${m.back}</span>
            <span class="odd-vol">${m.bVol}</span>
          </div>
          <div class="odd-box odd-lay" onclick="openBetSlip('${m.title}', 'LAY', '${m.lay}')">
            <span class="odd-val">${m.lay}</span>
            <span class="odd-vol">${m.lVol}</span>
          </div>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function filterSport(sport, btn) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderMatches(sport);
  }

  function openBetSlip(title, side, odd) {
    selectedBet = { title, side, odd };
    document.getElementById("betMatchTitle").innerText = title;
    document.getElementById("betTypeTag").innerText = `${side} @ ${odd}`;
    document.getElementById("betModal").classList.add("open");
  }

  function closeBetSlip() {
    document.getElementById("betModal").classList.remove("open");
  }

  function setStake(val) {
    document.getElementById("stakeInput").value = val;
  }

  function confirmBet() {
    const stake = Number(document.getElementById("stakeInput").value);
    if (!stake || stake < 100) {
      alert("Minimum bet ₹100 hai!");
      return;
    }
    if (stake > userBal) {
      alert("Insufficient balance! Pehle Wallet mein deposit karein.");
      location.href = "wallet.html";
      return;
    }
    alert(`Bet Placed!\n${selectedBet.title}\n${selectedBet.side} @ ${selectedBet.odd} | Stake: ₹${stake}`);
    closeBetSlip();
  }

  renderMatches("all");
</script>
</body>
</html>
