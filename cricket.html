<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cricket VIP Exchange - Buffalo Gold</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: radial-gradient(circle at top, #230436 0%, #0d0114 100%); color: #fff; display: flex; justify-content: center; padding-bottom: 85px; }
    .container { width: 100%; max-width: 430px; background: rgba(24, 3, 36, 0.97); min-height: 100vh; padding: 12px; box-shadow: 0 0 35px rgba(0,0,0,0.95); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: linear-gradient(135deg, #2d0742, #1a0326); padding: 10px 14px; border-radius: 14px; border: 1px solid rgba(255, 215, 0, 0.4); }
    .user-info h3 { font-size: 14px; color: #ffd700; }
    .user-info span { font-size: 11px; color: #bbb; }
    .mini-wallet { text-align: right; cursor: pointer; background: rgba(0,0,0,0.45); padding: 6px 10px; border-radius: 10px; border: 1px solid rgba(40, 224, 77, 0.35); }
    .mini-wallet div { font-size: 10px; color: #ccc; }
    .mini-wallet strong { font-size: 13px; color: #28e04d; }
    .hero-box { background: linear-gradient(135deg, #560e78 0%, #2a063b 60%, #190224 100%); border: 1.5px solid #ffd700; border-radius: 16px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .hero-box h2 { font-size: 16px; color: #ffd700; margin-bottom: 3px; }
    .hero-box p { font-size: 11px; color: #e2e8f0; }
    .refresh-btn { background: linear-gradient(180deg, #ffe44d, #e6b800); color: #000; border: none; padding: 8px 13px; border-radius: 10px; font-weight: 900; font-size: 11px; cursor: pointer; }
    .filter-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .f-tab { flex: 1; padding: 10px 4px; background: #260636; border: 1px solid #6b1d91; border-radius: 12px; color: #ccc; font-size: 11px; font-weight: 800; cursor: pointer; }
    .f-tab.active { background: linear-gradient(180deg, #ffd700, #eab308); color: #000; border-color: #ffd700; }
    .list-header { background: linear-gradient(90deg, #33094a, #220530); padding: 9px 12px; border-radius: 12px 12px 0 0; border: 1px solid #6b1d91; border-bottom: none; font-size: 12px; font-weight: 800; color: #ffd700; display: flex; justify-content: space-between; }
    .match-list-box { background: #1f042d; border: 1px solid #6b1d91; border-radius: 0 0 14px 14px; overflow: hidden; }
    .match-item { padding: 14px 12px; border-bottom: 1px solid #3c0c54; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .match-item:last-child { border-bottom: none; }
    .match-item:active { background: #2e0842; }
    .m-left { flex: 1; padding-right: 10px; }
    .b-live { background: #28e04d; color: #000; font-size: 9px; font-weight: 900; padding: 2px 7px; border-radius: 5px; display: inline-block; }
    .b-up { background: #3b82f6; color: #fff; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 5px; display: inline-block; }
    .b-done { background: #4b5563; color: #ffd700; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 5px; display: inline-block; }
    .m-title { font-size: 14px; font-weight: 800; color: #fff; margin: 5px 0 4px; }
    .m-score { font-size: 12px; font-weight: 700; }
    .open-pill { background: linear-gradient(180deg, #ffd700, #d97706); color: #000; font-size: 11px; font-weight: 900; padding: 8px 12px; border-radius: 9px; white-space: nowrap; }
    .empty-msg { padding: 30px 15px; text-align: center; color: #ccc; font-size: 13px; }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; background: #1f042e; border-top: 1px solid #75229e; display: flex; justify-content: space-around; padding: 10px 0; z-index: 999; }
    .nav-item { text-align: center; color: #bbb; font-size: 11px; cursor: pointer; flex: 1; }
    .nav-item.active { color: #ffd700; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <div class="user-info">
      <h3 id="userName">Player</h3>
      <span>📱 <span id="userMob">-</span></span>
    </div>
    <div class="mini-wallet" onclick="location.href='wallet.html'">
      <div>Deposit: <strong id="topDep">₹0</strong></div>
      <div>Winning: <strong id="topWin">₹0</strong></div>
    </div>
  </div>

  <div class="hero-box">
    <div>
      <h2>👑 Cricket VIP Exchange</h2>
      <p>Live Match Winner • Instant Settlement</p>
    </div>
    <button class="refresh-btn" onclick="loadMatches()">🔄 Refresh</button>
  </div>

  <div class="filter-tabs">
    <button class="f-tab active" id="tabLive" onclick="setFilter('live', this)">🔴 Live (0)</button>
    <button class="f-tab" id="tabUp" onclick="setFilter('upcoming', this)">🕒 Upcoming (0)</button>
    <button class="f-tab" id="tabDone" onclick="setFilter('completed', this)">✅ Done (0)</button>
  </div>

  <div class="list-header">
    <span id="listHeading">🔴 Live Matches</span>
    <span>Select Match →</span>
  </div>
  <div class="match-list-box" id="matchListContainer">
    <div class="empty-msg">Matches load ho rahe hain...</div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="location.href='game.html'">🎰<br>Games</div>
  <div class="nav-item active" onclick="loadMatches()">🏏<br>Cricket</div>
  <div class="nav-item" onclick="location.href='wallet.html'">💰<br>Wallet</div>
  <div class="nav-item" onclick="location.href='refer.html'">🎁<br>Refer</div>
  <div class="nav-item" onclick="location.href='profile.html'">👤<br>Profile</div>
</div>

<script>
  const WORKER_URL = "https://lingering-sun-3a12.dkdeepakverma143.workers.dev";
  const FB_URL = "https://coin-play-7ac49-default-rtdb.firebaseio.com";
  const mob = String(localStorage.getItem("activeUser") || "").trim();
  if (!mob) window.location.replace("index.html");

  let matches = [], overrides = {}, filterMode = "live";

  function renderUserBox(u) {
    if (!u) return;
    document.getElementById("userName").innerText = u.name || "Player";
    document.getElementById("userMob").innerText = mob || "-";
    document.getElementById("topDep").innerText = "₹" + Number(u.depositBal ?? u.depositBalance ?? 0);
    document.getElementById("topWin").innerText = "₹" + Number(u.winningBal ?? u.winningBalance ?? 0);
  }
  try { renderUserBox(JSON.parse(localStorage.getItem("cachedUser") || "{}")); } catch (e) {}

  async function syncUserWallet() {
    try {
      const u = await (await fetch(`${FB_URL}/users/${mob}.json?t=${Date.now()}`)).json();
      if (u) { localStorage.setItem("cachedUser", JSON.stringify(u)); renderUserBox(u); }
    } catch (e) {}
  }

  function formatIstTime(ms) {
    const dt = new Date(ms);
    if (isNaN(dt.getTime())) return "";
    const now = new Date(), tmrw = new Date(now.getTime() + 86400000);
    const dayTag = dt.toDateString() === now.toDateString() ? "Today" :
                   dt.toDateString() === tmrw.toDateString() ? "Tomorrow" :
                   dt.toLocaleDateString("en-IN", { day: "numeric", month: "short", timeZone: "Asia/Kolkata" });
    const timeStr = dt.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true, timeZone: "Asia/Kolkata" }).toUpperCase();
    return `🕒 ${dayTag}, ${timeStr} IST`;
  }

  function parseMatchesFromHtml(html, forcedBucket) {
    const seen = new Set(), out = [], startMap = {}, rawMsMap = {};
    if (!html) return out;

    for (const tm of html.matchAll(/"matchId"\s*:\s*"?(\d+)"?[\s\S]{0,700}?"startDate"\s*:\s*"?(\d{10,13})"?/g)) {
      if (startMap[tm[1]]) continue;
      let ms = Number(tm[2]); if (ms < 1e12) ms *= 1000;
      rawMsMap[tm[1]] = ms;
      startMap[tm[1]] = formatIstTime(ms);
    }

    const rx = /href="\/(?:live-cricket-scores|cricket-scores)\/(\d+)\/([^"?#]+)"/g;
    let m;
    while ((m = rx.exec(html)) !== null) {
      const id = String(m[1]);
      if (seen.has(id)) continue;
      seen.add(id);

      const title = m[2].replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase()).trim();
      const rest = html.slice(m.index + m[0].length);
      const nextPos = rest.search(/href="\/(?:live-cricket-scores|cricket-scores)\/\d+\//);
      const sub = html.slice(m.index, m.index + (nextPos > 0 ? Math.min(850, nextPos + m[0].length) : 650))
        .replace(/<[^>]+>/g, " ").replace(/&amp;/g, "&").replace(/\s+/g, " ").trim();

      const scores = sub.match(/\b[A-Z]{2,6}\s*\d+(?:\s*[-\/]\s*\d+)?(?:\s*\(\s*\d+(?:\.\d+)?(?:\s*Ovs?)?\s*\))?/g) || [];
      const isDone = /\b(won by \d+\s+(?:runs?|wkts?|wickets?)|match drawn|match tied|abandoned|no result)\b/i.test(sub);
      const isLiveTxt = /\b(innings break|need \d+ runs|trail by|lead by|opt to|elected to|day \d+|stumps|lunch|tea|toss)\b/i.test(sub);
      const startMs = rawMsMap[id] || 0;

      let type = forcedBucket;
      if (!type) {
        if (isDone) type = "completed";
        else if (scores.length > 0 || isLiveTxt) type = "live";
        else if (startMs > Date.now() + 180000) type = "upcoming";
        else type = "upcoming";
      }

      const stM = sub.match(/(Match drawn|Match tied|No result|Match abandoned|[A-Za-z][A-Za-z0-9\s]{1,32}?won by\s+\d+\s+(?:runs?|wkts?|wickets?)|[A-Za-z][A-Za-z\s]{1,22}(?:need|trail by|lead by)\s+\d+\s+runs?|Day\s*\d+:\s*(?:Stumps|Lunch|Tea|Innings Break)|Innings Break|[A-Za-z\s]{2,24}\s+opt to\s+(?:bat|bowl))/i);
      const cleanStatus = type === "upcoming"
        ? (startMap[id] || "🕒 Upcoming Match")
        : (stM ? stM[1].replace(/^.*?\b(?:Commentary|Scorecard|Squads|Highlights|News)\b\s*/gi, "").trim() : (type === "completed" ? "Match Completed" : "Live In Progress"));

      out.push({ id, title, scores, status: cleanStatus, startMs: startMs || 9e15, type });
    }
    return out;
  }

  async function loadMatches() {
    try {
      const [rLive, rUp, rRec, rC] = await Promise.all([
        fetch(`${WORKER_URL}?t=${Date.now()}`).catch(() => null),
        fetch(`${WORKER_URL}?type=upcoming&t=${Date.now()}`).catch(() => null),
        fetch(`${WORKER_URL}?type=recent&t=${Date.now()}`).catch(() => null),
        fetch(`${FB_URL}/cricketControls.json?t=${Date.now()}`).catch(() => null)
      ]);
      overrides = (rC && rC.ok ? await rC.json() : {}) || {};

      const autoList = parseMatchesFromHtml(rLive && rLive.ok ? await rLive.text() : "", null);
      const upList = parseMatchesFromHtml(rUp && rUp.ok ? await rUp.text() : "", "upcoming");
      const doneList = parseMatchesFromHtml(rRec && rRec.ok ? await rRec.text() : "", "completed");

      const map = new Map();
      // 1. Live & Auto matches
      autoList.forEach(m => map.set(m.id, m));
      // 2. Upcoming matches (jo pehle se Live/Completed mein nahi hain)
      upList.forEach(m => { if (!map.has(m.id)) map.set(m.id, m); });
      // 3. Completed matches (jo pehle se Live/Upcoming mein nahi hain)
      doneList.forEach(m => { if (!map.has(m.id)) map.set(m.id, m); });

      matches = Array.from(map.values());
      document.getElementById("tabLive").innerText = `🔴 Live (${matches.filter(x => x.type === "live").length})`;
      document.getElementById("tabUp").innerText = `🕒 Upcoming (${matches.filter(x => x.type === "upcoming").length})`;
      document.getElementById("tabDone").innerText = `✅ Done (${matches.filter(x => x.type === "completed").length})`;
      renderList();
    } catch (e) {
      document.getElementById("matchListContainer").innerHTML = `<div class="empty-msg">Network error! Refresh dabayein.</div>`;
    }
  }

  function setFilter(mode, btn) {
    filterMode = mode;
    document.querySelectorAll(".f-tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("listHeading").innerText =
      mode === "live" ? "🔴 Live Matches" : mode === "upcoming" ? "🕒 Upcoming Matches" : "✅ Completed Matches";
    renderList();
  }

  function renderList() {
    const box = document.getElementById("matchListContainer");
    let list = matches.filter(m => m.type === filterMode);
    if (filterMode === "upcoming") list.sort((a, b) => a.startMs - b.startMs);

    if (!list.length) {
      box.innerHTML = `<div class="empty-msg">Is category mein abhi koi match nahi hai.</div>`;
      return;
    }

    box.innerHTML = list.map(m => {
      const ov = overrides[m.id] || {};
      const sc = (ov.liveRuns ? `${ov.liveRuns} (${ov.liveOvers || "0.0"} Ov)` : "") || (m.scores.length ? m.scores.join(" | ") : m.status);
      const badge = m.type === "live" ? `<span class="b-live">● LIVE</span>` : m.type === "upcoming" ? `<span class="b-up">UPCOMING</span>` : `<span class="b-done">COMPLETED</span>`;
      const color = m.type === "completed" ? "#ffd700" : m.type === "upcoming" ? "#93c5fd" : "#28e04d";
      return `<div class="match-item" onclick="openMatch('${m.id}')">
        <div class="m-left">
          ${badge}
          <div class="m-title">${m.title}</div>
          <div class="m-score" style="color:${color};">${sc}</div>
        </div>
        <div class="open-pill">${m.type === "completed" ? "Result →" : "Play →"}</div>
      </div>`;
    }).join("");
  }

  function openMatch(id) {
    const m = matches.find(x => x.id === String(id));
    if (!m) return;
    localStorage.setItem("bg_selected_match", JSON.stringify(m));
    window.location.href = `match.html?id=${encodeURIComponent(m.id)}&title=${encodeURIComponent(m.title)}&type=${encodeURIComponent(m.type)}`;
  }

  syncUserWallet();
  loadMatches();
  setInterval(() => { syncUserWallet(); loadMatches(); }, 8000);
</script>
</body>
</html>
